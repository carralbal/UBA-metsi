<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1030" viewBox="0 0 1344 1030" role="img" aria-label="Una cartera mínima selecciona representaciones por pregunta, decisión, audiencia, evidencia, costo y vigencia, y prueba su utilidad sin depender de la explicación del autor."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#CCCCCC"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4D4D4D"/></marker></defs><path d="M121 32 H211 L200 47 H110 Z" fill="#CFFF00"/><rect width="100%" height="100%" fill="#FFFFFF"/><text x="120.0" y="78.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start"><tspan x="120.0" dy="0.0">La pregunta elige la vista</tspan></text><rect x="120.0" y="154.0" width="1104.0" height="118" rx="9" fill="#E6E6E6" stroke="#CCCCCC" stroke-width="2"/><text x="148.0" y="202.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="148.0" dy="0.0">Pregunta sobre validación previa sin exclusión ni</tspan><tspan x="148.0" dy="45.9">sobrepromesa</tspan></text><rect x="162.0" y="290.0" width="1020.0" height="118" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="190.0" y="338.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="190.0" dy="0.0">Proceso: dónde espera el huésped</tspan></text><rect x="204.0" y="426.0" width="936.0" height="118" rx="9" fill="#E6E6E6" stroke="#CCCCCC" stroke-width="2"/><text x="232.0" y="474.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="232.0" dy="0.0">Estados: cuándo puede confirmarse</tspan></text><rect x="246.0" y="562.0" width="852.0" height="118" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="274.0" y="610.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="274.0" dy="0.0">Autoridad: quién decide la excepción</tspan></text><rect x="288.0" y="698.0" width="768.0" height="118" rx="9" fill="#E6E6E6" stroke="#CCCCCC" stroke-width="2"/><text x="316.0" y="746.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="316.0" dy="0.0">Experiencia: quién encuentra una barrera</tspan></text><rect x="330.0" y="834.0" width="684.0" height="118" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="358.0" y="882.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="358.0" dy="0.0">Prueba sin autor: la audiencia puede</tspan><tspan x="358.0" dy="45.9">decidir</tspan></text></svg>
