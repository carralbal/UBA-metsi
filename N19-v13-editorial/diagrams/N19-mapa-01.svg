<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">N19, la alternativa se prueba contra la misma capacidad</title>
  <desc id="desc">Una capacidad de Hotel Horizonte abre seis rutas de realización: configurar, integrar, construir, contratar, operar manualmente y no automatizar. Todas atraviesan el mismo episodio ordinario, una falla, una reparación y una prueba de salida. La arquitectura provisional combina configuración para el flujo común, integración para la evidencia de cerradura, revisión humana para excepciones sensibles y construcción como opción condicionada. La salida se practica exportando reglas, reconstruyendo episodios y midiendo pérdida de significado.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12 Z" fill="#767874"/></marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}
      .eyebrow{font-size:25px;font-weight:700;letter-spacing:7px}.title{font-size:54px;letter-spacing:-1.2px}.subtitle{font-size:26px;fill:#5E605D}
      .section{font-size:21px;font-weight:700;letter-spacing:4px}.label{font-size:22px;font-weight:700}.body{font-size:19px;fill:#555754}.small{font-size:17px;fill:#686A67}.number{font-size:18px;font-weight:700;letter-spacing:3px}
      .rule{stroke:#A9ABA7;stroke-width:2}.rail{fill:none;stroke:#858782;stroke-width:3}.rail-selected{fill:none;stroke:#202020;stroke-width:4}.route{fill:none;stroke:#767874;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#F7F7F4"/><rect x="36" y="36" width="1728" height="1028" rx="20" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M72 74 H210 L196 94 H58 Z" fill="#CFFF00"/><text x="238" y="94" class="sans eyebrow">N19 · CAMPO DE REALIZACIÓN</text>
  <text x="72" y="168" class="serif title">La alternativa se prueba contra la misma capacidad</text>
  <text x="74" y="212" class="sans subtitle">Precio y demostración no alcanzan: importan operación, dependencia, reparación y salida.</text><path d="M72 246 H1728" class="rule"/>

  <text x="84" y="300" class="sans section">CAPACIDAD COMÚN</text><text x="500" y="300" class="sans section">SEIS RUTAS POSIBLES</text><text x="936" y="300" class="sans section">MISMA PRUEBA</text><text x="1500" y="300" class="sans section">DECISIÓN</text>
  <g aria-label="Capacidad de Hotel Horizonte">
    <path d="M84 338 H416 L446 368 V762 H84 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2.2"/>
    <path d="M84 338 H258 L244 360 H70 Z" fill="#CFFF00"/><text x="116" y="396" class="sans number">HH-19 · LLEGADA</text>
    <text x="116" y="452" class="serif" style="font-size:29px">Confirmar una habitación</text><text x="116" y="491" class="serif" style="font-size:29px">accesible sólo cuando</text><text x="116" y="530" class="serif" style="font-size:29px">coinciden asignación,</text><text x="116" y="569" class="serif" style="font-size:29px">preparación y cerradura.</text>
    <line x1="116" y1="608" x2="410" y2="608" class="rule"/>
    <text x="116" y="648" class="sans body">La persona puede corregir.</text><text x="116" y="680" class="sans body">Recepción puede detener.</text><text x="116" y="720" class="sans number">USO · EXCEPCIÓN · REPARACIÓN</text>
  </g>
  <path d="M446 550 H484" class="route"/>

  <g aria-label="Opciones de realización">
    <rect x="500" y="338" width="970" height="424" rx="12" fill="#F0F1EE" stroke="#B3B5B1" stroke-width="2"/>
    <line x1="920" y1="338" x2="920" y2="762" class="rule"/><line x1="1060" y1="338" x2="1060" y2="762" class="rule"/><line x1="1200" y1="338" x2="1200" y2="762" class="rule"/><line x1="1340" y1="338" x2="1340" y2="762" class="rule"/>
    <text x="990" y="366" class="sans small" text-anchor="middle">EPISODIO</text><text x="1130" y="366" class="sans small" text-anchor="middle">FALLA</text><text x="1270" y="366" class="sans small" text-anchor="middle">REPARACIÓN</text><text x="1405" y="366" class="sans small" text-anchor="middle">SALIDA</text>

    <g><circle cx="536" cy="414" r="16" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="536" y="420" class="sans number" text-anchor="middle">1</text><text x="570" y="421" class="sans label">CONFIGURAR</text><text x="740" y="421" class="sans small">flujo común</text><path d="M900 414 H1448" class="rail-selected"/><circle cx="990" cy="414" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/><circle cx="1130" cy="414" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="1270" cy="414" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="1405" cy="414" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g><circle cx="536" cy="480" r="16" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="536" y="486" class="sans number" text-anchor="middle">2</text><text x="570" y="487" class="sans label">INTEGRAR</text><text x="740" y="487" class="sans small">estado y evidencia</text><path d="M900 480 H1448" class="rail-selected"/><circle cx="990" cy="480" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="1130" cy="480" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/><circle cx="1270" cy="480" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="1405" cy="480" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g><circle cx="536" cy="546" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="536" y="552" class="sans number" text-anchor="middle">3</text><text x="570" y="553" class="sans label">CONSTRUIR</text><text x="740" y="553" class="sans small">opción condicionada</text><path d="M900 546 H1448" class="rail" stroke-dasharray="10 9"/><circle cx="990" cy="546" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1130" cy="546" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1270" cy="546" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1405" cy="546" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/></g>
    <g><circle cx="536" cy="612" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="536" y="618" class="sans number" text-anchor="middle">4</text><text x="570" y="619" class="sans label">CONTRATAR</text><text x="740" y="619" class="sans small">servicio gobernable</text><path d="M900 612 H1448" class="rail"/><circle cx="990" cy="612" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1130" cy="612" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1270" cy="612" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1405" cy="612" r="7" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/></g>
    <g><circle cx="536" cy="678" r="16" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="536" y="684" class="sans number" text-anchor="middle">5</text><text x="570" y="685" class="sans label">OPERAR MANUALMENTE</text><path d="M900 678 H1448" class="rail-selected"/><circle cx="990" cy="678" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="1130" cy="678" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/><circle cx="1270" cy="678" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/><circle cx="1405" cy="678" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g><circle cx="536" cy="734" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="536" y="740" class="sans number" text-anchor="middle">6</text><text x="570" y="741" class="sans label">NO AUTOMATIZAR</text><text x="790" y="741" class="sans small">límite deliberado</text><path d="M900 734 H1448" class="rail" stroke-dasharray="4 9"/></g>
  </g>

  <path d="M1470 550 H1490" class="route"/>
  <g aria-label="Arquitectura provisional">
    <path d="M1502 338 H1706 L1730 362 V762 H1502 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2.2"/>
    <text x="1530" y="392" class="sans number">ARQUITECTURA</text><text x="1530" y="422" class="sans number">PROVISIONAL</text>
    <line x1="1530" y1="448" x2="1698" y2="448" class="rule"/>
    <text x="1530" y="492" class="sans label">Configurar</text><text x="1530" y="520" class="sans small">camino ordinario</text>
    <text x="1530" y="572" class="sans label">Integrar</text><text x="1530" y="600" class="sans small">cerradura y rastro</text>
    <text x="1530" y="652" class="sans label">Revisión humana</text><text x="1530" y="680" class="sans small">excepción sensible</text>
    <path d="M1530 708 H1686" stroke="#CFFF00" stroke-width="7"/><text x="1530" y="744" class="sans small">construir si falla la salida</text>
  </g>

  <path d="M72 824 H1728" class="rule"/><text x="84" y="870" class="sans section">PRUEBA DE SALIDA ANTES DE FIRMAR</text>
  <g aria-label="Prueba de portabilidad">
    <path d="M84 906 H420 L438 924 V990 H84 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="252" y="946" class="sans number" text-anchor="middle" style="font-size:16px;letter-spacing:2px">EXPORTAR REGLAS Y EVENTOS</text><text x="252" y="976" class="sans small" text-anchor="middle">no sólo estados finales</text>
    <path d="M438 948 H486" class="route"/><rect x="500" y="906" width="364" height="84" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><text x="682" y="946" class="sans number" text-anchor="middle">RECONSTRUIR EPISODIOS</text><text x="682" y="976" class="sans small" text-anchor="middle">en un destino alternativo</text>
    <path d="M864 948 H912" class="route"/><rect x="926" y="906" width="364" height="84" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="1108" y="946" class="sans number" text-anchor="middle">MEDIR PÉRDIDA</text><text x="1108" y="976" class="sans small" text-anchor="middle">significado, tiempo y costo</text>
    <path d="M1290 948 H1338" class="route"/><path d="M1352 906 H1706 L1724 924 V990 H1352 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><circle cx="1390" cy="948" r="10" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="1418" y="946" class="sans number">ACEPTAR DEPENDENCIA</text><text x="1418" y="976" class="sans small">con evidencia y condición de salida</text>
  </g>
  <text x="84" y="1036" class="sans small">LA ELECCIÓN PROFESIONAL ES UNA ARQUITECTURA REVISABLE, NO UN RANKING UNIVERSAL.</text><text x="1710" y="1036" class="sans small" text-anchor="end">N19 · METSI</text>
</svg>
