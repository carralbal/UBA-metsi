<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N34, la cadena se prueba en ambos sentidos</title>
  <desc id="desc">La promesa de una llegada accesible se recorre hacia adelante desde problema, evidencia y explicación hasta decisión, realización, operación y gobierno. El recorrido inverso parte de una consecuencia o incidente y vuelve hasta la autoridad, la evidencia y el encuadre que lo habilitaron. Dos contradicciones abiertas impiden fabricar coherencia. Una puerta no compensable permite continuar, limitar, producir evidencia o detener.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:44px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.metric{font-size:30px}.rule{stroke:#A8AAA6;stroke-width:2}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}.pale{fill:#E4E6E3;stroke:#777A76;stroke-width:2}.soft{fill:#F1F2EF;stroke:#A8AAA6;stroke-width:2}.arrow{fill:none;stroke:#737673;stroke-width:3}.volt{fill:#CFFF00;stroke:#202020;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N34 · EXPEDIENTE INTEGRADO</text>
  <text x="68" y="155" class="serif title">La cadena se prueba en ambos sentidos</text><text x="70" y="196" class="sans subtitle">Una colección de entregables correctos no demuestra una intervención coherente.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Promesa y dos recorridos">
    <text x="72" y="270" class="sans section">HH-34 · UNA MISMA PROMESA ORGANIZA EL EXPEDIENTE</text>
    <rect x="72" y="302" width="1056" height="82" class="soft"/><text x="104" y="334" class="sans number">PROMESA Y POBLACIÓN</text><text x="378" y="340" class="serif metric">llegada accesible, operable y reparable</text><circle cx="1090" cy="326" r="9" class="volt"/>
    <path d="M140 452 H510" class="arrow" marker-end="url(#arrow)"/><text x="140" y="420" class="sans number">RECORRIDO HACIA ADELANTE</text><text x="140" y="442" class="sans small">del reclamo a la consecuencia</text>
    <path d="M1060 452 H690" class="arrow" marker-end="url(#arrow)"/><text x="690" y="420" class="sans number">RECORRIDO INVERSO</text><text x="690" y="442" class="sans small">del incidente al encuadre</text>
  </g>

  <g aria-label="Cadena integrada">
    <text x="72" y="492" class="sans section">OCHO RELACIONES CRÍTICAS, NO OCHO ARCHIVOS AISLADOS</text>
    <path d="M600 526 V1144" class="rule"/>
    <g aria-label="Problema"><circle cx="600" cy="570" r="25" class="volt"/><text x="600" y="576" class="sans number" text-anchor="middle">01</text><rect x="72" y="526" width="456" height="88" class="outline"/><text x="100" y="558" class="sans number">PROBLEMA</text><text x="100" y="590" class="sans label">mecanismos rivales y población</text><path d="M528 570 H568" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Evidencia"><circle cx="600" cy="650" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="600" y="656" class="sans number" text-anchor="middle">02</text><rect x="672" y="606" width="456" height="88" class="pale"/><text x="700" y="638" class="sans number">EVIDENCIA</text><text x="700" y="670" class="sans label">fuente, vigencia, objeción y límite</text><path d="M632 650 H672" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Explicación"><circle cx="600" cy="730" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="600" y="736" class="sans number" text-anchor="middle">03</text><rect x="72" y="686" width="456" height="88" class="soft"/><text x="100" y="718" class="sans number">EXPLICACIÓN</text><text x="100" y="750" class="sans label">garantía, rival y condición de refutación</text><path d="M528 730 H568" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Alternativa"><circle cx="600" cy="810" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="600" y="816" class="sans number" text-anchor="middle">04</text><rect x="672" y="766" width="456" height="88" class="outline"/><text x="700" y="798" class="sans number">ALTERNATIVA</text><text x="700" y="830" class="sans label">mismo reclamo, prueba y salida</text><path d="M632 810 H672" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Decisión"><circle cx="600" cy="890" r="25" class="volt"/><text x="600" y="896" class="sans number" text-anchor="middle">05</text><rect x="72" y="846" width="456" height="88" class="pale"/><text x="100" y="878" class="sans number">DECISIÓN</text><text x="100" y="910" class="sans label">autoridad, desacuerdo y revisión</text><path d="M528 890 H568" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Realización"><circle cx="600" cy="970" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="600" y="976" class="sans number" text-anchor="middle">06</text><rect x="672" y="926" width="456" height="88" class="soft"/><text x="700" y="958" class="sans number">REALIZACIÓN</text><text x="700" y="990" class="sans label">capacidad, contrato, corte y versión</text><path d="M632 970 H672" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Operación"><circle cx="600" cy="1050" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="600" y="1056" class="sans number" text-anchor="middle">07</text><rect x="72" y="1006" width="456" height="88" class="outline"/><text x="100" y="1038" class="sans number">OPERACIÓN</text><text x="100" y="1070" class="sans label">señal, contingencia y reparación</text><path d="M528 1050 H568" class="arrow" marker-end="url(#arrow)"/></g>
    <g aria-label="Gobierno"><circle cx="600" cy="1130" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="600" y="1136" class="sans number" text-anchor="middle">08</text><rect x="672" y="1086" width="456" height="88" class="pale"/><text x="700" y="1118" class="sans number">GOBIERNO</text><text x="700" y="1150" class="sans label">cambio, incidente, retiro y aprendizaje</text><path d="M632 1130 H672" class="arrow" marker-end="url(#arrow)"/></g>
  </g>

  <g aria-label="Contradicciones abiertas">
    <text x="72" y="1222" class="sans section">LA COHERENCIA NO SE FABRICA: CONSERVA CONTRADICCIONES ABIERTAS</text>
    <rect x="72" y="1254" width="506" height="108" class="outline"/><text x="104" y="1288" class="sans number">PROMESA Y OPERACIÓN</text><text x="104" y="1324" class="sans label">Comercial declara disponibilidad antes</text><text x="104" y="1350" class="sans body">de que Recepción pueda sostenerla.</text>
    <rect x="622" y="1254" width="506" height="108" class="outline"/><text x="654" y="1288" class="sans number">EVALUACIÓN Y POBLACIÓN</text><text x="654" y="1324" class="sans label">La prueba del asistente no representa</text><text x="654" y="1350" class="sans body">todas las condiciones de accesibilidad.</text>
  </g>

  <g aria-label="Puerta de integración">
    <path d="M600 1364 V1404" class="arrow" marker-end="url(#arrow)"/>
    <rect x="72" y="1420" width="1056" height="112" class="pale"/><text x="104" y="1454" class="sans number">PUERTA NO COMPENSABLE · PROBLEMA · VALOR · OPERACIÓN · TECNOLOGÍA · RIESGO · REPARACIÓN</text>
    <text x="104" y="1498" class="sans label">CONTINUAR</text><text x="342" y="1498" class="sans label">LIMITAR</text><text x="552" y="1498" class="sans label">PRODUCIR EVIDENCIA</text><text x="910" y="1498" class="sans label">DETENER</text><circle cx="1086" cy="1491" r="9" class="volt"/>
    <text x="600" y="1562" class="sans small" text-anchor="middle">una cadena defendible permite ir de la promesa al efecto y del incidente a la decisión que lo habilitó</text>
  </g>
</svg>
