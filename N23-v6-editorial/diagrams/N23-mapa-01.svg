<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N23, un corte vertical conserva una llegada completa</title>
  <desc id="desc">La izquierda muestra cinco componentes terminados que no permiten completar una llegada. El centro representa un corte vertical HH-23 que atraviesa promesa, información, decisión, autoridad, acción material y reparación para una población limitada. La derecha aplica una puerta de terminado sobre uso, operación, reparación y aprendizaje. Abajo, la secuencia amplía una sola dimensión por vez y revalida la evidencia.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:45px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.rule{stroke:#A8AAA6;stroke-width:2}.edge{fill:none;stroke:#737673;stroke-width:3}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N23 · CORTE POR CAPACIDAD</text>
  <text x="68" y="155" class="serif title">Un corte vertical conserva una llegada completa</text>
  <text x="70" y="196" class="sans subtitle">Reducir alcance no significa romper el outcome en piezas sin uso.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Componentes terminados sin capacidad">
    <text x="72" y="270" class="sans section">CINCO ENTREGAS, NINGUNA LLEGADA POSIBLE</text>
    <rect x="72" y="304" width="356" height="554" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/>
    <g aria-label="Interfaz"><circle cx="108" cy="350" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="142" y="348" class="sans label">Interfaz</text><text x="142" y="375" class="sans body">consulta un estado viejo</text><path d="M104 400 H396" class="rule"/></g>
    <g aria-label="API"><circle cx="108" cy="448" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="142" y="446" class="sans label">API</text><text x="142" y="473" class="sans body">responde sin excepción</text><path d="M104 498 H396" class="rule"/></g>
    <g aria-label="Reglas"><circle cx="108" cy="546" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="142" y="544" class="sans label">Reglas</text><text x="142" y="571" class="sans body">omiten accesibilidad</text><path d="M104 596 H396" class="rule"/></g>
    <g aria-label="Analítica"><circle cx="108" cy="644" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="142" y="642" class="sans label">Analítica</text><text x="142" y="669" class="sans body">pierde reparaciones</text><path d="M104 694 H396" class="rule"/></g>
    <g aria-label="Capacitación"><circle cx="108" cy="742" r="16" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="142" y="740" class="sans label">Capacitación</text><text x="142" y="767" class="sans body">describe otra versión</text></g>
    <path d="M104 794 H396" class="rule"/><text x="104" y="828" class="sans number">OUTPUTS</text><text x="396" y="828" class="sans body" text-anchor="end">sin outcome</text>
  </g>

  <g aria-label="Corte vertical HH-23">
    <text x="468" y="326" class="sans section">SLICE HH-23</text>
    <path d="M468 354 H796 L814 372 V858 H468 Z" class="outline"/><path d="M468 354 H596 L584 376 H456 Z" fill="#CFFF00"/>
    <text x="500" y="402" class="sans number">RESERVA DIRECTA · UN TURNO</text><text x="500" y="426" class="sans small">dos pisos · revisión humana · reversión</text>
    <g><text x="500" y="458" class="sans label">Promesa</text><text x="770" y="458" class="sans body" text-anchor="end">habitación utilizable</text><path d="M500 476 H780" class="rule"/></g>
    <g><text x="500" y="522" class="sans label">Información</text><text x="770" y="522" class="sans small" text-anchor="end">tres estados coherentes</text><path d="M500 540 H780" class="rule"/></g>
    <g><text x="500" y="586" class="sans label">Decisión</text><text x="770" y="586" class="sans body" text-anchor="end">Recepción confirma</text><path d="M500 604 H780" class="rule"/></g>
    <g><text x="500" y="650" class="sans label">Autoridad</text><text x="770" y="650" class="sans body" text-anchor="end">Lucía puede revertir</text><path d="M500 668 H780" class="rule"/></g>
    <g><text x="500" y="714" class="sans label">Acción</text><text x="770" y="714" class="sans body" text-anchor="end">cerradura responde</text><path d="M500 732 H780" class="rule"/></g>
    <g><text x="500" y="778" class="sans label">Reparación</text><text x="770" y="778" class="sans body" text-anchor="end">alternativa explicada</text></g>
    <rect x="498" y="804" width="284" height="30" fill="#CFFF00"/><text x="640" y="825" class="sans number" text-anchor="middle">EPISODIO COMPLETO</text>
  </g>

  <g aria-label="Puerta de terminado">
    <path d="M846 304 H1128 V858 H846 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="878" y="350" class="sans section">TERMINADO</text>
    <g><circle cx="892" cy="412" r="18" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><path d="M882 412 L890 420 L902 404" fill="none" stroke="#202020" stroke-width="3"/><text x="926" y="418" class="sans label">Uso</text><text x="878" y="450" class="sans body">la llegada concluye</text></g>
    <g><circle cx="892" cy="518" r="18" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><path d="M882 518 L890 526 L902 510" fill="none" stroke="#202020" stroke-width="3"/><text x="926" y="524" class="sans label">Operación</text><text x="878" y="556" class="sans body">el turno la sostiene</text></g>
    <g><circle cx="892" cy="624" r="18" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><path d="M882 624 L890 632 L902 616" fill="none" stroke="#202020" stroke-width="3"/><text x="926" y="630" class="sans label">Reparación</text><text x="878" y="662" class="sans body">la falla tiene retorno</text></g>
    <g><circle cx="892" cy="730" r="18" fill="#CFFF00" stroke="#202020" stroke-width="2"/><path d="M882 730 L890 738 L902 722" fill="none" stroke="#202020" stroke-width="3"/><text x="926" y="736" class="sans label">Aprendizaje</text><text x="878" y="768" class="sans body">la evidencia cambia</text><text x="878" y="794" class="sans body">el corte siguiente</text></g>
    <path d="M886 826 H1088" class="rule"/><text x="987" y="850" class="sans number" text-anchor="middle">CAPACIDAD, NO DEMO</text>
  </g>
  <path d="M428 580 H458 M814 580 H836" class="edge" marker-end="url(#arrow)"/>

  <g aria-label="Secuencia de expansión">
    <text x="72" y="928" class="sans section">AMPLIAR UNA DIMENSIÓN Y REVALIDAR</text>
    <path d="M72 964 H1128 V1248 H72 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/>
    <g aria-label="Corte uno"><circle cx="188" cy="1034" r="28" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="188" y="1040" class="sans number" text-anchor="middle">01</text><text x="116" y="1094" class="sans label">Episodio base</text><text x="116" y="1125" class="sans body">directo · un turno</text><text x="116" y="1152" class="sans body">dos pisos · reversión</text></g>
    <path d="M278 1034 H422" class="edge" marker-end="url(#arrow)"/><text x="350" y="1014" class="sans small" text-anchor="middle">evidencia de operación</text>
    <g aria-label="Corte dos"><circle cx="492" cy="1034" r="28" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="492" y="1040" class="sans number" text-anchor="middle">02</text><text x="420" y="1094" class="sans label">Variar personas</text><text x="420" y="1125" class="sans body">sumar turno nocturno</text><text x="420" y="1152" class="sans body">sin apoyo privado</text></g>
    <path d="M582 1034 H726" class="edge" marker-end="url(#arrow)"/><text x="654" y="1014" class="sans small" text-anchor="middle">evidencia de transferencia</text>
    <g aria-label="Corte tres"><circle cx="796" cy="1034" r="28" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="796" y="1040" class="sans number" text-anchor="middle">03</text><text x="724" y="1094" class="sans label">Elegir nueva deuda</text><text x="724" y="1125" class="sans body">canal, volumen o excepción</text><text x="724" y="1152" class="sans body">requieren otra hipótesis</text></g>
    <g aria-label="Puerta de expansión"><rect x="966" y="996" width="126" height="124" fill="#E4E6E3" stroke="#202020" stroke-width="2"/><path d="M990 1020 H1068 L1058 1038 H980 Z" fill="#CFFF00"/><text x="1029" y="1070" class="sans number" text-anchor="middle">PUERTA</text><text x="1029" y="1098" class="sans body" text-anchor="middle">revalidar</text></g>
    <path d="M824 1188 H376" class="edge" marker-end="url(#arrow)"/><text x="600" y="1218" class="sans small" text-anchor="middle">cada expansión vuelve a examinar mecanismo, riesgo y dependencia</text>
  </g>

  <g aria-label="Frontera de capacidad">
    <text x="72" y="1310" class="sans section">LA FRONTERA NEGATIVA TAMBIÉN ES PARTE DEL CORTE</text>
    <path d="M72 1342 H1128 V1460 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/>
    <text x="104" y="1388" class="sans label">Incluye ahora</text><text x="104" y="1424" class="sans body">llegada directa anticipada, revisión humana y retorno seguro</text>
    <path d="M602 1366 V1436" class="rule"/>
    <text x="642" y="1388" class="sans label">No promete todavía</text><text x="642" y="1424" class="sans body">canales externos, sobreventa ni automatización general</text>
  </g>
  <path d="M72 1502 H1128" class="rule"/><text x="72" y="1538" class="sans small">UNA PIEZA TERMINADA NO EQUIVALE A UNA CAPACIDAD SOSTENIDA.</text><text x="1128" y="1538" class="sans small" text-anchor="end">N23 · METSI</text>
</svg>
