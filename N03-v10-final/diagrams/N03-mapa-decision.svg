<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Frontera y bucle reforzador de Hotel Horizonte</title><desc id="desc">La presión por ocupación aumenta sobreventa, reparación manual, demora de datos e incertidumbre, que vuelve a alimentar la decisión. Proveedores y reglas externas permanecen fuera del control directo pero dentro del análisis.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><rect width="1600" height="820" fill="#FAFAF8"/><g id="header"><path d="M55 105 H1545" stroke="#202020" stroke-width="3"/><text x="55" y="68" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="55" y="68">N03 · FRONTERAS Y RETROALIMENTACIÓN</tspan></text><text x="55" y="154" text-anchor="start" font-family="Avenir" font-size="38" font-weight="500" fill="#202020"><tspan x="55" y="154">Una mejora local puede regresar como una causa nueva</tspan></text></g><g id="boundary"><rect x="85" y="185" width="1110" height="555" rx="4" fill="none" stroke="#555" stroke-width="2.5" stroke-dasharray="11 9"/><text x="115" y="221" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="115" y="221">FRONTERA DEL SERVICIO OBSERVADO</tspan></text><text x="115" y="252" text-anchor="start" font-family="Avenir" font-size="16" font-weight="500" fill="#202020"><tspan x="115" y="252">La frontera no es el perímetro técnico: incluye las relaciones necesarias para explicar y decidir.</tspan></text></g><g id="feedback-connectors"><path d="M450 320 C468 270 476 268 495 285" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 285 C830 268 838 270 855 320" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M1105 426 C1180 470 1170 530 1112 565" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 628 H590" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 625 C130 555 118 475 170 426" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/></g><g id="reinforcing-loop"><circle cx="690" cy="458" r="45" fill="#202020"/><text x="690" y="471" text-anchor="middle" font-family="Avenir" font-size="34" font-weight="700" fill="#FFFFFF"><tspan x="690" y="471">R</tspan></text><text x="690" y="525" text-anchor="middle" font-family="Avenir" font-size="16" font-weight="600" fill="#202020"><tspan x="690" y="525">la consecuencia vuelve</tspan><tspan x="690" y="545">como condición nueva</tspan></text></g><g id="external-conditions"><rect x="1230" y="185" width="315" height="555" fill="#E4E6E5"/><path d="M1230 185 V740" stroke="#202020" stroke-width="3"/><text x="1265" y="238" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="1265" y="238">FUERA DEL CONTROL DIRECTO</tspan></text><text x="1265" y="268" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="1265" y="268">DENTRO DEL ANÁLISIS</tspan></text><path d="M1265 292 H1508" stroke="#202020" stroke-width="2"/><text x="1265" y="342" text-anchor="start" font-family="Avenir" font-size="19" font-weight="700" fill="#202020"><tspan x="1265" y="342">REGLAS OTA</tspan></text><text x="1265" y="390" text-anchor="start" font-family="Avenir" font-size="19" font-weight="700" fill="#202020"><tspan x="1265" y="390">PROVEEDORES</tspan></text><text x="1265" y="438" text-anchor="start" font-family="Avenir" font-size="19" font-weight="700" fill="#202020"><tspan x="1265" y="438">JURISDICCIÓN</tspan></text><path d="M1265 490 H1508" stroke="#CFFF00" stroke-width="8"/><text x="1265" y="540" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="1265" y="540">REVISAR LA FRONTERA</tspan></text><text x="1265" y="577" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="1265" y="577">si cambia la explicación,</tspan></text><text x="1265" y="606" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="1265" y="606">el daño o la decisión</tspan></text></g><g id="n1"><path d="M135 300 H426 L450 324 V426 H135 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="159" y="347" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="159" y="347">PRESIÓN POR OCUPACIÓN</tspan></text><text x="159" y="392" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="159" y="392">aumenta el margen</tspan></text><circle cx="430" cy="320" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="n2"><path d="M495 230 H786 L810 254 V356 H495 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="519" y="277" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="519" y="277">SOBREVENTA</tspan></text><text x="519" y="322" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="519" y="322">eleva la exposición</tspan></text><circle cx="790" cy="250" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="n3"><path d="M855 300 H1146 L1170 324 V426 H855 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="879" y="347" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="879" y="347">REPARACIÓN MANUAL</tspan></text><text x="879" y="392" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="879" y="392">absorbe excepciones</tspan></text><circle cx="1150" cy="320" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="n4"><path d="M790 565 H1126 L1150 589 V691 H790 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="814" y="612" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="814" y="612">DATOS MENOS OPORTUNOS</tspan></text><text x="814" y="657" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="814" y="657">degradan la coordinación</tspan></text><circle cx="1130" cy="585" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="n5"><path d="M230 565 H566 L590 589 V691 H230 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="254" y="612" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="254" y="612">INCERTIDUMBRE</tspan></text><text x="254" y="657" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="254" y="657">realimenta la decisión</tspan></text><circle cx="570" cy="585" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g></svg>