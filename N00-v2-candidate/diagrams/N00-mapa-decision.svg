<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="2369" viewBox="0 0 1344 2369" role="img" aria-label="Secuencia de diez transformaciones en orden de lectura: del pedido al problema, del software al sistema de trabajo, de la opinión a la evidencia, de la actividad al mecanismo, del modelo a la decisión, del marco a la estrategia situada, del output al outcome, de la aplicación al ecosistema, de la demostración de IA a la autonomía gobernada y del portfolio a la práctica reflexiva."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#CCCCCC"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4D4D4D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="120.0" y="78.0" fill="#272525" font-family="Avenir, sans-serif" font-size="48" font-weight="700" text-anchor="start"><tspan x="120.0" dy="0.0">Diez transformaciones que construyen</tspan><tspan x="120.0" dy="56.6">juicio profesional</tspan></text><text x="120.0" y="210.6" fill="#4D4D4D" font-family="Avenir, sans-serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="120.0" dy="0.0">El recorrido no agrega temas aislados. Cada paso cambia el objeto de análisis</tspan><tspan x="120.0" dy="34.8">y la decisión que puede defenderse.</tspan></text><path d="M 672.0 491.4 L 672.0 515.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 691.4 L 672.0 715.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 891.4 L 672.0 915.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 1091.4 L 672.0 1115.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 1291.4 L 672.0 1315.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 1491.4 L 672.0 1515.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 1691.4 L 672.0 1715.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 1891.4 L 672.0 1915.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 672.0 2091.4 L 672.0 2115.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="120.0" y="315.4" width="1104.0" height="176.0" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="349.4" fill="#4D4D4D" font-family="Avenir, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">01</tspan></text><text x="144.0" y="390.4" fill="#272525" font-family="Avenir, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Del pedido al problema</tspan></text><rect x="120.0" y="515.4" width="1104.0" height="176.0" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="549.4" fill="#4D4D4D" font-family="Avenir, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">02</tspan></text><text x="144.0" y="590.4" fill="#272525" font-family="Avenir, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Del software al sistema de trabajo</tspan></text><rect x="120.0" y="715.4" width="1104.0" height="176.0" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="749.4" fill="#4D4D4D" font-family="Avenir, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">03</tspan></text><text x="144.0" y="790.4" fill="#272525" font-family="Avenir, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">De la opinión a la evidencia</tspan></text><rect x="120.0" y="915.4" width="1104.0" height="176.0" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="949.4" fill="#4D4D