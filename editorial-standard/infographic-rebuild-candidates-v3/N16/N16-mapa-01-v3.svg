108.0" y="756.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="108.0" dy="0.0">03</tspan></text><text x="112.0" y="785.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="112.0" dy="0.0">Tablero: limpieza</tspan><tspan x="112.0" dy="28.1">terminada</tspan></text><circle cx="420.0" cy="740.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n4"><circle cx="880.0" cy="555.0" r="130.0" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="880.0" y="455.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="middle"><tspan x="880.0" dy="0.0">04</tspan></text><text x="880.0" y="547.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="middle"><tspan x="880.0" dy="0.0">R73, mismo episodio</tspan><tspan x="880.0" dy="28.1">transversal</tspan></text><circle cx="1000.0" cy="435.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n5"><rect x="1260.0" y="380.0" width="430.0" height="170.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="1278.0" y="406.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1278.0" dy="0.0">05</tspan></text><text x="1282.0" y="435.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1282.0" dy="0.0">Corregir, decidir, investigar</tspan><tspan x="1282.0" dy="28.1">o aceptar riesgo</tspan></text><circle cx="1680.0" cy="390.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n6"><rect x="1260.0" y="670.0" width="430.0" height="170.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1278.0" y="696.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1278.0" dy="0.0">06</tspan></text><text x="1282.0" y="725.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1282.0" dy="0.0">Proponer, validar, usar,</tspan><tspan x="1282.0" dy="28.1">revisar y retirar</tspan></text><circle cx="1680.0" cy="680.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><text x="750.0" y="330.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="750.0" dy="0.0">MISMO EPISODIO</tspan></text></g><g id="footer"><path d="M 90 1000 H 1710" stroke="#CCCCCC" stroke-width="2"/><text x="90.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">METSI · LA FORMA VISUAL RESPONDE AL ARGUMENTO</tspan></text><text x="1710.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="end"><tspan x="1710.0" dy="0.0">CONTRADICTION</tspan></text></g></svg>
