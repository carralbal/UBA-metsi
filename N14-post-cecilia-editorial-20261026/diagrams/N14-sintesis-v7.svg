<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" role="img" aria-labelledby="N14-summary-title N14-summary-desc"><title id="N14-summary-title">N14: del concepto al producto</title><desc id="N14-summary-desc">Delimitar: Seguimos una llegada hasta ingreso adecuado; la preparación previa conserva su reloj propio. → Reconstruir: Contrastamos procedimiento, eventos y experiencia; separamos trabajo de espera. → Hacer visible: Cada traspaso, cola y excepción necesita una próxima acción y una responsabilidad. → Probar el conjunto: Una mejora debe sostener el resultado sin trasladar demora, carga o exclusión.</desc><rect x="0" y="0" width="640" height="860" fill="#fafaf8"/><text x="20" y="27" fill="#171917" font-family="Avenir" font-size="13" font-weight="600">RECORRIDO DE SÍNTESIS · N14</text><rect x="20" y="55" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="55" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="83" r="13" fill="#171917"/><text x="43" y="88" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">1</text><text x="73" y="87" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Delimitar</text><text x="39" y="111" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Seguimos una llegada hasta ingreso adecuado; la preparación previa</text><text x="39" y="130" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">conserva su reloj propio.</text><text x="310" y="213.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="218.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="218.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="246.0" r="13" fill="#171917"/><text x="43" y="251.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">2</text><text x="73" y="250.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Reconstruir</text><text x="39" y="274.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Contrastamos procedimiento, eventos y experiencia; separamos trabajo</text><text x="39" y="293.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">de espera.</text><text x="310" y="376.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="381.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="381.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="409.0" r="13" fill="#171917"/><text x="43" y="414.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">3</text><text x="73" y="413.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Hacer visible</text><text x="39" y="437.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Cada traspaso, cola y excepción necesita una próxima acción y una</text><text x="39" y="456.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">responsabilidad.</text><text x="310" y="539.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="544.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="544.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="572.0" r="13" fill="#171917"/><text x="43" y="577.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">4</text><text x="73" y="576.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Probar el conjunto</text><text x="39" y="600.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Una mejora debe sostener el resultado sin trasladar demora, carga o</text><text x="39" y="619.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">exclusión.</text><rect x="20" y="710" width="600" height="140" fill="#171917"/><text x="39" y="736" fill="#cfff00" font-family="Avenir" font-size="13" font-weight="600">PRODUCTO PARA EL ENCUENTRO</text><text x="39" y="765" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">Un mapa HH-14 de una llegada, con tareas, esperas, traspasos y una</text><text x="39" y="787" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">excepción; una ficha que indique evidencia de cierre y cómo</text><text x="39" y="809" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">comprobar un cambio sin trasladar la cola.</text></svg>