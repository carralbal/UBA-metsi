<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" role="img" aria-labelledby="N08-summary-title N08-summary-desc"><title id="N08-summary-title">N08: del concepto al producto</title><desc id="N08-summary-desc">Recorte: Seguir una reserva desde la llegada hasta una habitación adecuada o una alternativa acordada. → Registro: Separar acciones observadas, interpretación provisional y preguntas abiertas. → Función: Investigar qué permite detectar, decidir o evitar una práctica antes de eliminarla. → Rediseño: Conservar la función útil, sustituir mecanismos riesgosos y volver a observar después del cambio.</desc><rect x="0" y="0" width="640" height="860" fill="#fafaf8"/><text x="20" y="27" fill="#171917" font-family="Avenir" font-size="13" font-weight="600">RECORRIDO DE SÍNTESIS · N08</text><rect x="20" y="55" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="55" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="83" r="13" fill="#171917"/><text x="43" y="88" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">1</text><text x="73" y="87" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Recorte</text><text x="39" y="111" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Seguir una reserva desde la llegada hasta una habitación adecuada o</text><text x="39" y="130" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">una alternativa acordada.</text><text x="310" y="213.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="218.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="218.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="246.0" r="13" fill="#171917"/><text x="43" y="251.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">2</text><text x="73" y="250.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Registro</text><text x="39" y="274.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Separar acciones observadas, interpretación provisional y preguntas</text><text x="39" y="293.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">abiertas.</text><text x="310" y="376.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="381.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="381.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="409.0" r="13" fill="#171917"/><text x="43" y="414.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">3</text><text x="73" y="413.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Función</text><text x="39" y="437.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Investigar qué permite detectar, decidir o evitar una práctica antes</text><text x="39" y="456.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">de eliminarla.</text><text x="310" y="539.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="544.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="544.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="572.0" r="13" fill="#171917"/><text x="43" y="577.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">4</text><text x="73" y="576.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Rediseño</text><text x="39" y="600.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Conservar la función útil, sustituir mecanismos riesgosos y volver a</text><text x="39" y="619.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">observar después del cambio.</text><rect x="20" y="710" width="600" height="140" fill="#171917"/><text x="39" y="736" fill="#cfff00" font-family="Avenir" font-size="13" font-weight="600">PRODUCTO PARA EL ENCUENTRO</text><text x="39" y="765" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">Una ficha HH-08 que separe descripción, interpretación y pregunta,</text><text x="39" y="787" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">acompañada por un mapa mínimo de las capas del servicio.</text></svg>