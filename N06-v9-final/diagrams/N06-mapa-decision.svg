<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc"><title id="title">La evidencia vale por la decisión que puede cambiar</title><desc id="desc">Una secuencia relaciona pregunta decisoria, hipótesis rivales, cartera de evidencia, señal suficiente e hito de decisión. El valor se evalúa por relevancia, poder de discriminación, oportunidad y costo, y conduce a continuar, modificar, detener o investigar más.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#404140"/></marker></defs><rect width="1800" height="700" fill="#FAFAF8"/><path d="M55 100 H1745" stroke="#202020" stroke-width="3"/><text x="55" y="65" text-anchor="start" font-family="Avenir" font-size="23" font-weight="700" fill="#202020"><tspan x="55" y="65">N06 · VALOR DE INFORMACIÓN</tspan></text><text x="55" y="150" text-anchor="start" font-family="Avenir" font-size="38" font-weight="500" fill="#202020"><tspan x="55" y="150">La evidencia vale por la decisión que puede cambiar</tspan></text><g fill="none" stroke="#404140" stroke-width="3" marker-end="url(#arrow)"><path d="M325 330 H395"/><path d="M665 330 H735"/><path d="M1005 330 H1075"/><path d="M1345 330 H1415"/></g><g id="question"><path d="M55 230 H300 L325 255 V430 H55 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="77" y="268" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="77" y="268">01</tspan></text><text x="77" y="317" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="77" y="317">PREGUNTA DECISORIA</tspan></text><text x="77" y="374" text-anchor="start" font-family="Avenir" font-size="16" font-weight="500" fill="#202020"><tspan x="77" y="374">Qué decisión podría cambiar</tspan></text><circle cx="299" cy="254" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="hypotheses"><path d="M395 230 H640 L665 255 V430 H395 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="417" y="268" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="417" y="268">02</tspan></text><text x="417" y="317" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="417" y="317">HIPÓTESIS RIVALES</tspan></text><text x="417" y="374" text-anchor="start" font-family="Avenir" font-size="16" font-weight="500" fill="#202020"><tspan x="417" y="374">Qué explicaciones debemos</tspan><tspan x="417" y="394">distinguir</tspan></text><circle cx="639" cy="254" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="portfolio"><path d="M735 230 H980 L1005 255 V430 H735 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="757" y="268" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="757" y="268">03</tspan></text><text x="757" y="317" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="757" y="317">CARTERA DE EVIDENCIA</tspan></text><text x="757" y="374" text-anchor="start" font-family="Avenir" font-size="16" font-weight="500" fill="#202020"><tspan x="757" y="374">Qué combinación reduce la</tspan><tspan x="757" y="394">incertidumbre</tspan></text><circle cx="979" cy="254" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="signal"><path d="M1075 230 H1320 L1345 255 V430 H1075 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="1097" y="268" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="1097" y="268">04</tspan></text><text x="1097" y="317" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="1097" y="317">SEÑAL SUFICIENTE</tspan></text><text x="1097" y="374" text-anchor="start" font-family="Avenir" font-size="16" font-weight="500" fill="#202020"><tspan x="1097" y="374">Qué resultado permite dejar de</tspan><tspan x="1097" y="394">investigar</tspan></text><circle cx="1319" cy="254" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="milestone"><path d="M1415 230 H1660 L1685 255 V430 H1415 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="1437" y="268" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="1437" y="268">05</tspan></text><text x="1437" y="317" text-anchor="start" font-family="Avenir" font-size="22" font-weight="700" fill="#202020"><tspan x="1437" y="317">HITO DE DECISIÓN</tspan></text><text x="1437" y="374" text-anchor="start" font-family="Avenir" font-size="16" font-weight="500" fill="#202020"><tspan x="1437" y="374">Qué compromiso resulta</tspan><tspan x="1437" y="394">razonable ahora</tspan></text><circle cx="1659" cy="254" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><rect x="55" y="492" width="1690" height="64" fill="#E4E6E5"/><path d="M55 492 H355" stroke="#CFFF00" stroke-width="8"/><text x="80" y="532" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="80" y="532">CRITERIOS DE VALOR</tspan></text><text x="545" y="532" text-anchor="middle" font-family="Avenir" font-size="18" font-weight="600" fill="#202020"><tspan x="545" y="532">relevancia</tspan></text><text x="860" y="532" text-anchor="middle" font-family="Avenir" font-size="18" font-weight="600" fill="#202020"><tspan x="860" y="532">poder de discriminación</tspan></text><text x="1195" y="532" text-anchor="middle" font-family="Avenir" font-size="18" font-weight="600" fill="#202020"><tspan x="1195" y="532">oportunidad</tspan></text><text x="1510" y="532" text-anchor="middle" font-family="Avenir" font-size="18" font-weight="600" fill="#202020"><tspan x="1510" y="532">costo</tspan></text><path d="M520 510 V540 M1040 510 V540 M1360 510 V540" stroke="#A0A2A0" stroke-width="1.5"/><text x="900" y="628" text-anchor="middle" font-family="Avenir" font-size="20" font-weight="700" fill="#202020"><tspan x="900" y="628">SALIDAS LEGÍTIMAS  ·  CONTINUAR  ·  MODIFICAR  ·  DETENER  ·  INVESTIGAR MÁS</tspan></text></svg>