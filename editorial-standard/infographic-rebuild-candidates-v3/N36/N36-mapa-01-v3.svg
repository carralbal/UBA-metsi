-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1218.0" dy="0.0">03</tspan></text><text x="1222.0" y="475.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1222.0" dy="0.0">Teoría declarada</tspan></text><circle cx="1460.0" cy="430.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n4"><polygon points="1200.0,690.0 1518.0,690.0 1540.0,712.0 1540.0,850.0 1200.0,850.0" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1218.0" y="716.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1218.0" dy="0.0">04</tspan></text><text x="1222.0" y="745.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1222.0" dy="0.0">Doble bucle</tspan></text><circle cx="1530.0" cy="700.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n5"><rect x="650.0" y="690.0" width="340.0" height="160.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="668.0" y="716.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="668.0" dy="0.0">05</tspan></text><text x="672.0" y="745.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="672.0" dy="0.0">Asistencia de IA acotada</tspan></text><circle cx="980.0" cy="700.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n6"><rect x="80.0" y="690.0" width="340.0" height="160.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="716.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="98.0" dy="0.0">06</tspan></text><text x="102.0" y="745.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-an