<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">N06 · Una cartera mínima de evidencia</title>
  <desc id="description">Una pregunta prioritaria orienta cuatro fuentes distintas: entrevistas, observación, documentos y registros. Antes de contrastarlas se revisa si son independientes y si los casos incluyen variaciones pertinentes. El resultado es una conclusión limitada por la evidencia disponible.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#555a58" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1800" height="1100" fill="#f4f3ef"/>
  <g id="masthead" font-family="Avenir Next,Arial,sans-serif" fill="#1c1d1b">
    <path d="M88 50 H1712" stroke="#9da09b" stroke-width="2"/>
    <path d="M88 72 H206" stroke="#cfff00" stroke-width="10"/>
    <text x="225" y="83" font-size="24" font-weight="700" letter-spacing="5">METSI · N06 · MAPA DE EVIDENCIA</text>
    <text x="88" y="160" font-size="60" font-weight="600">Una cartera mínima no es una pila de métodos</text>
    <text x="90" y="205" font-size="28" fill="#626760">Cada fuente responde una pregunta diferente; ninguna confirma por sí sola toda la explicación.</text>
  </g>
  <g id="routes" fill="none" stroke="#7c817d" stroke-width="2.5">
    <path d="M900 320 V365" marker-end="url(#arrow)"/>
    <path d="M685 440 H790"/>
    <path d="M685 540 H790"/>
    <path d="M685 640 H790"/>
    <path d="M685 740 H790"/>
    <path d="M1102 490 H1190" stroke-dasharray="7 8"/>
    <path d="M1102 690 H1190" stroke-dasharray="7 8"/>
    <path d="M945 790 V863" marker-end="url(#arrow)"/>
  </g>
  <g id="question" font-family="Avenir Next,Arial,sans-serif">
    <rect x="88" y="244" width="1624" height="76" fill="#e3e6e1"/>
    <rect x="88" y="244" width="10" height="76" fill="#cfff00"/>
    <text x="122" y="276" font-size="19" font-weight="800" letter-spacing="3" fill="#4c554a">PUNTO DE PARTIDA</text>
    <text x="500" y="295" font-size="36" font-weight="600" fill="#1c1d1b">¿Qué duda podría cambiar la próxima decisión?</text>
  </g>
  <g id="sources" font-family="Avenir Next,Arial,sans-serif" fill="#1c1d1b">
    <text x="90" y="385" font-size="22" font-weight="800" letter-spacing="3">FUENTES CON LÍMITES DISTINTOS</text>
    <path d="M88 400 H690" stroke="#8b908a" stroke-width="2"/>
    <g id="interviews">
      <rect x="88" y="410" width="600" height="85" fill="#f9f9f6"/>
      <rect x="88" y="410" width="8" height="85" fill="#7d8985"/>
      <text x="118" y="447" font-size="31" font-weight="600">Entrevistas</text>
      <text x="118" y="478" font-size="22" fill="#535953">Interpretaciones y experiencias</text>
      <circle cx="685" cy="440" r="8" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    </g>
    <g id="observation">
      <rect x="88" y="510" width="600" height="85" fill="#e7e9e5"/>
      <rect x="88" y="510" width="8" height="85" fill="#7d8985"/>
      <text x="118" y="547" font-size="31" font-weight="600">Observación</text>
      <text x="118" y="578" font-size="22" fill="#535953">Secuencias e interrupciones</text>
      <circle cx="685" cy="540" r="8" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    </g>
    <g id="documents">
      <rect x="88" y="610" width="600" height="85" fill="#f9f9f6"/>
      <rect x="88" y="610" width="8" height="85" fill="#7d8985"/>
      <text x="118" y="647" font-size="31" font-weight="600">Documentos</text>
      <text x="118" y="678" font-size="22" fill="#535953">Reglas y compromisos escritos</text>
      <circle cx="685" cy="640" r="8" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    </g>
    <g id="records">
      <rect x="88" y="710" width="600" height="85" fill="#e7e9e5"/>
      <rect x="88" y="710" width="8" height="85" fill="#7d8985"/>
      <text x="118" y="747" font-size="31" font-weight="600">Registros</text>
      <text x="118" y="778" font-size="22" fill="#535953">Eventos, no todo el trabajo humano</text>
      <circle cx="685" cy="740" r="8" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    </g>
  </g>
  <g id="synthesis" font-family="Avenir Next,Arial,sans-serif" fill="#1c1d1b">
    <path d="M790 400 L1102 400 L1102 788 L790 788 Z" fill="#dadeda" stroke="#7c817d" stroke-width="2"/>
    <path d="M800 408 L1092 408 L1092 778 L800 778 Z" fill="#f4f3ef" stroke="#a9ada7" stroke-width="2"/>
    <circle cx="946" cy="570" r="93" fill="none" stroke="#7d827d" stroke-width="2"/>
    <circle cx="946" cy="570" r="65" fill="none" stroke="#9da29d" stroke-width="2"/>
    <circle cx="946" cy="570" r="14" fill="#cfff00" stroke="#1c1d1b" stroke-width="2"/>
    <text x="946" y="700" font-size="37" font-weight="600" text-anchor="middle">Contrastar</text>
    <text x="946" y="738" font-size="22" text-anchor="middle" fill="#535953">no acumular</text>
    <circle cx="790" cy="440" r="7" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    <circle cx="790" cy="540" r="7" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    <circle cx="790" cy="640" r="7" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
    <circle cx="790" cy="740" r="7" fill="#f4f3ef" stroke="#7c817d" stroke-width="2"/>
  </g>
  <g id="checks" font-family="Avenir Next,Arial,sans-serif" fill="#1c1d1b">
    <text x="1190" y="385" font-size="22" font-weight="800" letter-spacing="3">DOS CONTROLES ANTES DE AFIRMAR</text>
    <path d="M1190 400 H1712" stroke="#8b908a" stroke-width="2"/>
    <g id="independence">
      <rect x="1190" y="410" width="522" height="182" fill="#ece5d8"/>
      <text x="1214" y="452" font-size="31" font-weight="600">¿Son independientes?</text>
      <text x="1214" y="492" font-size="23">Un tablero, un informe y una</text>
      <text x="1214" y="522" font-size="23">presentación pueden repetir</text>
      <text x="1214" y="552" font-size="23">la misma consulta.</text>
      <circle cx="1190" cy="490" r="8" fill="#ece5d8" stroke="#7c817d" stroke-width="2"/>
    </g>
    <g id="variation">
      <rect x="1190" y="610" width="522" height="182" fill="#e4e8e5"/>
      <text x="1214" y="652" font-size="31" font-weight="600">¿Qué casos faltan?</text>
      <text x="1214" y="692" font-size="23">Día y noche; casos habituales</text>
      <text x="1214" y="722" font-size="23">y excepciones; canales directos</text>
      <text x="1214" y="752" font-size="23">y de agencias.</text>
      <circle cx="1190" cy="690" r="8" fill="#e4e8e5" stroke="#7c817d" stroke-width="2"/>
    </g>
  </g>
  <g id="conclusion" font-family="Avenir Next,Arial,sans-serif">
    <rect x="88" y="864" width="1624" height="170" fill="#1c1d1b"/>
    <rect x="88" y="864" width="1624" height="9" fill="#cfff00"/>
    <text x="120" y="916" font-size="21" font-weight="800" letter-spacing="3" fill="#cfff00">CONCLUSIÓN SITUADA</text>
    <text x="120" y="966" font-size="38" fill="#f6f5f0">“Encontramos esta dificultad en los casos revisados;</text>
    <text x="120" y="1008" font-size="38" fill="#f6f5f0">todavía necesitamos medir con qué frecuencia ocurre.”</text>
  </g>
  <g id="footer" font-family="Avenir Next,Arial,sans-serif" fill="#646963">
    <text x="89" y="1070" font-size="20">Fuentes: N06, movimiento 2 · §06. La fuerza de la conclusión no puede superar la fuerza de la evidencia.</text>
  </g>
</svg>
