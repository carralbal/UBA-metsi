<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N35, la tesis permanece y el recorrido cambia con la decisión</title>
  <desc id="desc">Una tesis acotada conserva afirmación, evidencia, garantía, límite, objeción y revisión. Cinco audiencias recorren esa misma estructura para tomar decisiones distintas. Dirección decide exposición y recursos, revisión técnica decide reproducibilidad, Operaciones decide capacidad de actuar y reparar, Comercial decide una promesa sostenible y las personas afectadas deciden si aceptar, objetar o pedir revisión. La transferencia se comprueba cuando un equipo nuevo reexplica el criterio, actúa en un caso distinto y reconoce cuándo detenerse.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:42px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.thesis{font-size:27px}.rule{stroke:#A8AAA6;stroke-width:2}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}.pale{fill:#E4E6E3;stroke:#777A76;stroke-width:2}.soft{fill:#F1F2EF;stroke:#A8AAA6;stroke-width:2}.arrow{fill:none;stroke:#737673;stroke-width:3}.volt{fill:#CFFF00;stroke:#202020;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N35 · MATRIZ DE DEFENSA Y TRANSFERENCIA</text>
  <text x="68" y="154" class="serif title">La tesis permanece; el recorrido cambia</text><text x="68" y="201" class="serif title">con la decisión</text>
  <text x="70" y="242" class="sans subtitle">Adaptar una comunicación no autoriza a alterar su evidencia ni su límite.</text><path d="M68 272 H1132" class="rule"/>

  <g aria-label="Tesis estable">
    <text x="72" y="318" class="sans section">HH-35 · UNA TESIS ESTABLE Y DISCUTIBLE</text>
    <rect x="72" y="348" width="1056" height="118" class="soft"/>
    <text x="104" y="383" class="sans number">DECISIÓN ACOTADA</text>
    <text x="104" y="422" class="serif thesis">ampliar durante treinta días el ingreso asistido,</text>
    <text x="104" y="453" class="serif thesis">con revisión humana y condición explícita de salida</text>
    <circle cx="1090" cy="378" r="9" class="volt"/>
  </g>

  <g aria-label="Columna vertebral argumental">
    <text x="72" y="516" class="sans section">LA COLUMNA VERTEBRAL NO CAMBIA ENTRE VERSIONES</text>
    <path d="M112 574 H1084" class="arrow" marker-end="url(#arrow)"/>
    <g><circle cx="126" cy="574" r="24" class="volt"/><text x="126" y="580" class="sans number" text-anchor="middle">01</text><text x="84" y="622" class="sans label">AFIRMACIÓN</text></g>
    <g><circle cx="314" cy="574" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="314" y="580" class="sans number" text-anchor="middle">02</text><text x="276" y="622" class="sans label">EVIDENCIA</text></g>
    <g><circle cx="502" cy="574" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="502" y="580" class="sans number" text-anchor="middle">03</text><text x="465" y="622" class="sans label">GARANTÍA</text></g>
    <g><circle cx="690" cy="574" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="690" y="580" class="sans number" text-anchor="middle">04</text><text x="661" y="622" class="sans label">LÍMITE</text></g>
    <g><circle cx="878" cy="574" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="878" y="580" class="sans number" text-anchor="middle">05</text><text x="838" y="622" class="sans label">OBJECIÓN</text></g>
    <g><circle cx="1066" cy="574" r="24" class="volt"/><text x="1066" y="580" class="sans number" text-anchor="middle">06</text><text x="1022" y="622" class="sans label">REVISIÓN</text></g>
  </g>

  <g aria-label="Cinco audiencias y cinco decisiones">
    <text x="72" y="684" class="sans section">CINCO AUDIENCIAS · CINCO DECISIONES · UNA MISMA REALIDAD</text>
    <path d="M316 714 V1138" class="rule"/><path d="M762 714 V1138" class="rule"/>

    <g aria-label="Dirección"><text x="88" y="758" class="sans number">01 · DIRECCIÓN</text><text x="340" y="758" class="sans label">Decide exposición y recursos</text><text x="786" y="752" class="sans body">valor · riesgo residual · alternativa</text><text x="786" y="777" class="sans body">próxima puerta y condición de retiro</text><path d="M88 800 H1112" class="rule"/></g>
    <g aria-label="Revisión técnica"><text x="88" y="848" class="sans number">02 · REVISIÓN TÉCNICA</text><text x="340" y="848" class="sans label">Decide reproducibilidad</text><text x="786" y="842" class="sans body">arquitectura · datos · pruebas</text><text x="786" y="867" class="sans body">trazas, fallas y permisos</text><path d="M88 890 H1112" class="rule"/></g>
    <g aria-label="Operaciones"><text x="88" y="938" class="sans number">03 · OPERACIONES</text><text x="340" y="938" class="sans label">Decide si puede actuar y reparar</text><text x="786" y="932" class="sans body">estados · señales · autoridad</text><text x="786" y="957" class="sans body">contingencia y escalamiento</text><path d="M88 980 H1112" class="rule"/></g>
    <g aria-label="Comercial"><text x="88" y="1028" class="sans number">04 · COMERCIAL</text><text x="340" y="1028" class="sans label">Decide una promesa sostenible</text><text x="786" y="1022" class="sans body">población · condiciones · límite</text><text x="786" y="1047" class="sans body">consecuencia y reparación</text><path d="M88 1070 H1112" class="rule"/></g>
    <g aria-label="Personas afectadas"><text x="88" y="1118" class="sans number">05 · PERSONAS AFECTADAS</text><text x="370" y="1118" class="sans label">Deciden aceptar, objetar o revisar</text><text x="786" y="1112" class="sans body">propósito · dato · consecuencia</text><text x="786" y="1137" class="sans body">opciones y canal de revisión</text></g>
  </g>

  <g aria-label="Objeción como prueba">
    <rect x="72" y="1190" width="1056" height="94" class="outline"/>
    <text x="104" y="1225" class="sans number">OBJECIÓN FUNDADA</text><text x="322" y="1225" class="sans label">reabre el enlace exacto que cuestiona</text>
    <text x="104" y="1260" class="sans body">aceptar · limitar · refutar con evidencia · posponer, pero nunca borrar la pregunta</text><circle cx="1090" cy="1218" r="9" class="volt"/>
  </g>

  <g aria-label="Prueba de transferencia">
    <text x="72" y="1340" class="sans section">LA TRANSFERENCIA SE PRUEBA EN UN CASO NUEVO</text>
    <rect x="72" y="1372" width="224" height="104" class="soft"/><text x="96" y="1406" class="sans number">CASO DISTINTO</text><text x="96" y="1440" class="sans body">otra población, regla</text><text x="96" y="1464" class="sans body">y autoridad</text>
    <path d="M296 1424 H338" class="arrow" marker-end="url(#arrow)"/>
    <rect x="350" y="1372" width="224" height="104" class="pale"/><text x="374" y="1406" class="sans number">REEXPLICAR</text><text x="374" y="1440" class="sans body">criterio, límite</text><text x="374" y="1464" class="sans body">y objeción</text>
    <path d="M574 1424 H616" class="arrow" marker-end="url(#arrow)"/>
    <rect x="628" y="1372" width="224" height="104" class="soft"/><text x="652" y="1406" class="sans number">ACTUAR</text><text x="652" y="1440" class="sans body">decidir, detener</text><text x="652" y="1464" class="sans body">y reparar</text>
    <path d="M852 1424 H894" class="arrow" marker-end="url(#arrow)"/>
    <rect x="906" y="1372" width="222" height="104" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="930" y="1406" class="sans number">TRANSFERIDO</text><text x="930" y="1440" class="sans body">puede justificar</text><text x="930" y="1464" class="sans body">y revisar sin copiar</text>
    <text x="600" y="1542" class="sans small" text-anchor="middle">si el equipo sólo repite la solución o depende de quien la presentó, todavía no existe capacidad transferida</text>
  </g>
</svg>
