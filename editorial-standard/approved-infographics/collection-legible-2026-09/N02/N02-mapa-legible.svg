<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">El sistema no termina en la pantalla</title><desc id="desc">Son cinco objetos relacionados. Confundirlos cambia el problema que intentamos resolver. Para probar una función miramos la aplicación. Para explicar una promesa incumplida, ampliamos la mirada.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="El sistema no termina en la pantalla">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N02">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N02 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">El sistema no termina en la pantalla</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Son cinco objetos relacionados. Confundirlos cambia el problema que</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">intentamos resolver.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<path d="M52 320.6 V1288 H1148" fill="none" stroke="#A5A79F" stroke-width="2"/>
<g id="item-0" aria-label="Situación problemática" data-row-bottom="504.48">
<text x="100" y="363.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Situación problemática</text>
<text x="100" y="407.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Incluye tensiones, perspectivas, restricciones e historia.</text>
<text x="100" y="453.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Es el contexto que vuelve necesario intervenir.</text>
</g>
<path d="M76 512.48 V1288 H1148" fill="none" stroke="#A5A79F" stroke-width="2"/>
<g id="item-1" aria-label="Sistema de trabajo" data-row-bottom="696.36">
<text x="124" y="555.48" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Sistema de trabajo</text>
<text x="124" y="599.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Personas y actividades producen un servicio.</text>
<text x="124" y="645.28" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La tecnología participa, pero no trabaja sola.</text>
</g>
<path d="M100 704.36 V1288 H1148" fill="none" stroke="#A5A79F" stroke-width="2"/>
<g id="item-2" aria-label="Sistema de información" data-row-bottom="888.24">
<text x="148" y="747.36" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Sistema de información</text>
<text x="148" y="791.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Se produce, interpreta y usa información.</text>
<text x="148" y="837.16" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Importa quién la entiende, la corrige y decide con ella.</text>
</g>
<path d="M124 896.24 V1288 H1148" fill="none" stroke="#A5A79F" stroke-width="2"/>
<g id="item-3" aria-label="Sistema técnico" data-row-bottom="1080.12">
<text x="172" y="939.24" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Sistema técnico</text>
<text x="172" y="983.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Aplicaciones, integraciones, dispositivos y redes.</text>
<text x="172" y="1029.04" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Es la infraestructura que permite parte del trabajo.</text>
</g>
<path d="M148 1088.12 V1288 H1148" fill="none" stroke="#A5A79F" stroke-width="2"/>
<g id="item-4" aria-label="Aplicación" data-row-bottom="1272.0">
<text x="196" y="1131.12" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Aplicación</text>
<text x="196" y="1175.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Es una pieza del sistema técnico.</text>
<text x="196" y="1220.9199999999998" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Que funcione no demuestra que el servicio cumpla su promesa.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 416.54 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 608.4200000000001 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 800.3 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 992.18 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-4-decision" d="M1148 1184.06 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Elegir la frontera">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Elegir la frontera</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Para probar una función miramos la aplicación. Para explicar una promesa</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">incumplida, ampliamos la mirada.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>