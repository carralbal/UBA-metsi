<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Cinco lógicas para decisiones distintas</title><desc id="desc">Se pueden combinar, pero hay que explicar qué aporta cada una. La evidencia debe alcanzar, la reparación debe funcionar y Recepción debe poder detener el uso. Elegí según conocimiento, costo del error y reversibilidad.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Cinco lógicas para decisiones distintas">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N17">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N17 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Cinco lógicas para decisiones distintas</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Se pueden combinar, pero hay que explicar qué aporta cada una.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Predictiva" data-row-bottom="489.6">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Predictiva</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Planificar compromisos costosos de cambiar.</text>
<text x="530" y="383.04" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Por ejemplo, contratos, migración y</text>
<text x="530" y="416.08000000000004" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">ventanas de intervención.</text>
</g>
<g id="item-1" aria-label="Iterativa" data-row-bottom="685.2">
<path d="M52 497.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="541.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Iterativa</text>
<text x="530" y="539.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Revisar una solución en versiones</text>
<text x="530" y="572.64" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">sucesivas.</text>
<text x="530" y="611.6800000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Por ejemplo, mejorar una regla compartida</text>
<text x="530" y="644.72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">sobre estados.</text>
</g>
<g id="item-2" aria-label="Incremental" data-row-bottom="880.8000000000001">
<path d="M52 693.2 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="737.2" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Incremental</text>
<text x="530" y="735.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Ampliar una capacidad que ya funciona</text>
<text x="530" y="768.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">completa.</text>
<text x="530" y="807.2800000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Por ejemplo, pasar de dos pisos a una</text>
<text x="530" y="840.32" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">población mayor.</text>
</g>
<g id="item-3" aria-label="Adaptativa" data-row-bottom="1076.3999999999999">
<path d="M52 888.8 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="932.8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Adaptativa</text>
<text x="530" y="930.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cambiar la secuencia según las señales.</text>
<text x="530" y="969.8399999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No sostener el plan si la situación que lo</text>
<text x="530" y="1002.8799999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">justificaba cambió.</text>
</g>
<g id="item-4" aria-label="Experimental" data-row-bottom="1272.0">
<path d="M52 1084.4 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1128.4" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Experimental</text>
<text x="530" y="1126.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Probar una hipótesis con exposición</text>
<text x="530" y="1159.44" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">protegida.</text>
<text x="530" y="1198.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Por ejemplo, comprobar una promesa de</text>
<text x="530" y="1231.52" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">llegada anticipada.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 399.8 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 595.4 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 791.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 986.6 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-4-decision" d="M1148 1182.1999999999998 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Antes de ampliar">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Antes de ampliar</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La evidencia debe alcanzar, la reparación debe funcionar y Recepción</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">debe poder detener el uso. Elegí según conocimiento, costo del error y</text>
<text x="78" y="1540.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">reversibilidad.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>