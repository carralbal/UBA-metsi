<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">El flujo conserva identidad y hace visible la espera</title><desc id="desc">El sistema de cambio sólo puede mejorar cuando sigue una unidad estable desde la demanda hasta la capacidad en uso, hace visibles sus colas y cierra el feedback con una decisión modificada. La composición utiliza la topología flowboard para relacionar seis elementos del argumento.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4D4D4D"/></marker></defs><rect width="1800" height="1100" fill="#F6F4EE"/><rect x="42" y="34" width="1716" height="1024" rx="18" fill="none" stroke="#CCCCCC" stroke-width="2"/><g id="header"><path d="M 82 55 H 222 L 207 76 H 67 Z" fill="#CFFF00"/><text x="250.0" y="74.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#272525" text-anchor="start"><tspan x="250.0" dy="0.0">N25 · MAPA CONCEPTUAL</tspan></text><text x="90.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#272525" text-anchor="start"><tspan x="90.0" dy="0.0">El flujo conserva identidad y hace visible la espera</tspan></text><text x="90.0" y="208.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">El sistema de cambio sólo puede mejorar cuando sigue una unidad estable desde la demanda hasta la capacidad en uso,</tspan><tspan x="90.0" dy="26.8">hace visibles sus colas y cierra el feedback con una decisión modificada.</tspan></text><path d="M 90 253.0 H 1710" stroke="#CCCCCC" stroke-width="2"/></g><g id="connectors"><path d="M 400 560 H 470" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 790 560 H 860" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1180 560 H 1250" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 470 820 H 1180" fill="none" stroke="#CFFF00" stroke-width="8"/></g><g id="objects"><g id="n1"><rect x="80.0" y="270.0" width="320.0" height="140.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="296.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="98.0" dy="0.0">01</tspan></text><text x="102.0" y="325.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="102.0" dy="0.0">Unidad de cambio</tspan></text><circle cx="390.0" cy="280.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n2"><rect x="470.0" y="270.0" width="320.0" height="140.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="488.0" y="296.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="488.0" dy="0.0">02</tspan></text><text x="492.0" y="325.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="492.0" dy="0.0">Reloj de demanda</tspan></text><circle cx="780.0" cy="280.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="board0"><rect x="80" y="465" width="320" height="310" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="500.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="98.0" dy="0.0">DEMANDA</tspan></text><text x="104.0" y="585.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="104.0" dy="0.0">Reloj de compromiso</tspan></text></g><g id="board1"><rect x="470" y="465" width="320" height="310" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="488.0" y="500.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="488.0" dy="0.0">EN CURSO</tspan></text><text x="494.0" y="585.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="494.0" dy="0.0">Trabajo en curso de</tspan><tspan x="494.0" dy="28.1">siete a tres</tspan></text></g><g id="board2"><rect x="860" y="465" width="320" height="310" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="878.0" y="500.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="878.0" dy="0.0">VALIDACIÓN</tspan></text><text x="884.0" y="585.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="884.0" dy="0.0">Validación semanal</tspan></text></g><g id="board3"><rect x="1250" y="465" width="320" height="310" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1268.0" y="500.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="1268.0" dy="0.0">SALIDA</tspan></text><text x="1274.0" y="585.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1274.0" dy="0.0">Circuito de</tspan><tspan x="1274.0" dy="28.1">retroalimentación</tspan></text></g><g id="n3"><circle cx="365" cy="740" r="7" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/><text x="104.0" y="730.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="104.0" dy="0.0">03</tspan></text></g><g id="n4"><circle cx="755" cy="740" r="7" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/><text x="494.0" y="730.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="494.0" dy="0.0">04</tspan></text></g><g id="n5"><circle cx="1145" cy="740" r=