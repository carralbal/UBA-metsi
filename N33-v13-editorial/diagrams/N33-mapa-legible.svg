<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">La aprobación tiene condiciones</title><desc id="desc">Autorizar un uso una vez no autoriza cualquier versión futura. La respuesta al incidente actualiza las condiciones de uso. Una autorización sin seguimiento no equivale a gobierno.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="La aprobación tiene condiciones">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N33">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N33 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">La aprobación tiene condiciones</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Autorizar un uso una vez no autoriza cualquier versión futura.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Registrar el uso" data-row-bottom="489.6">
<circle cx="82" cy="344.0" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="354.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="345.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Registrar el uso</text>
<text x="145" y="389.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Propósito, población, autoridad y riesgos.</text>
<text x="145" y="434.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Nombrar qué se permite y bajo qué límites.</text>
</g>
<path id="e-item-0-item-1" d="M82 374.0 V504.6" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Conservar la configuración" data-row-bottom="685.2">
<circle cx="82" cy="539.6" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="549.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="540.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Conservar la configuración</text>
<text x="145" y="584.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Modelo, fuentes, permisos y proveedor.</text>
<text x="145" y="630.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Poder reconstruir con qué versión se tomó una decisión.</text>
</g>
<path id="e-item-1-item-2" d="M82 569.6 V700.2" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Observar cambios e incidentes" data-row-bottom="880.8000000000001">
<circle cx="82" cy="735.2" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="745.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="736.2" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Observar cambios e incidentes</text>
<text x="145" y="780.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una fuente contradictoria o un permiso nuevo cambian el uso.</text>
<text x="145" y="826.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Reevaluar; reducir exposición si la evidencia dejó de valer.</text>
</g>
<path id="e-item-2-item-3" d="M82 765.2 V895.8000000000001" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Responder" data-row-bottom="1076.3999999999999">
<circle cx="82" cy="930.8" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="940.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="931.8" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Responder</text>
<text x="145" y="975.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Contener, explicar y reparar.</text>
<text x="145" y="1021.5999999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cambiar la regla y probarla antes de volver a ampliar.</text>
</g>
<path id="e-item-3-item-4" d="M82 960.8 V1091.3999999999999" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-4" aria-label="Retirar cuando corresponde" data-row-bottom="1272.0">
<circle cx="82" cy="1126.4" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1136.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">05</text>
<text x="145" y="1127.4" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Retirar cuando corresponde</text>
<text x="145" y="1171.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Revocar permisos y sostener continuidad.</text>
<text x="145" y="1217.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Preservar evidencia legítima y quitar dependencias residuales.</text>
</g>
<path id="e-item-4-item-0" d="M1144 1235 H1170 V310 H1134" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Volver al registro">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Volver al registro</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La respuesta al incidente actualiza las condiciones de uso. Una</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">autorización sin seguimiento no equivale a gobierno.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>