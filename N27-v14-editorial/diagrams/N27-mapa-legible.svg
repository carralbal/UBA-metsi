<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Un mensaje válido no alcanza para entregar la llave.</title><desc id="desc">El estado liberada sólo confirma limpieza terminada, no una habitación asignable. Cuatro franjas distinguen forma o sintaxis, significado o semántica, tiempo y acción operacional. Las cuatro confluyen en un contrato que permite anticipar la misma consecuencia y responder ante fallas. Se proponen pruebas de duplicación, demora, desorden y versión.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect x="0" y="0" width="1200" height="1620" fill="#F7F6F2"/>
<g id="encabezado" aria-label="encabezado">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">METSI · N27 · MAPA DE DECISIÓN</text>
<text x="52" y="118" font-family="Georgia,serif" font-size="52" font-weight="400" text-anchor="start" fill="#202020">Un mensaje válido</text>
<text x="52" y="182" font-family="Georgia,serif" font-size="52" font-weight="400" text-anchor="start" fill="#202020">no alcanza para entregar la llave.</text>
<text x="52" y="226" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Hotel Horizonte · «Liberada» no quiere decir «asignable».</text>
<path d="M52 250 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
</g>
<g id="distincion" aria-label="Limpieza terminada ≠ habitación lista para entregar.">
<rect x="52" y="270" width="1096" height="127" fill="#E5E6E0" stroke="#A5A79F" stroke-width="1.5"/>
<text x="80" y="318" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Limpieza terminada ≠ habitación lista para entregar.</text>
<text x="80" y="362" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">También hay que comprobar la cerradura y las restricciones.</text>
</g>
<text x="52" y="440" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">CUATRO ACUERDOS SOBRE EL MISMO MENSAJE</text>
<path id="e-forma" d="M1148 548 H1176" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-significado" d="M1148 752 H1176" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-tiempo" d="M1148 956 H1176" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-accion" d="M1148 1160 H1176" fill="none" stroke="#92958F" stroke-width="2"/>
<path d="M1176 548 V1297 H600 V1320" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="forma" aria-label="Forma (sintaxis)">
<rect x="52" y="475" width="1096" height="177" fill="#E5E6E0" stroke="#A5A79F" stroke-width="1.5"/>
<circle cx="93" cy="527" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="93" y="536" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">1</text>
<text x="145" y="536" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#202020">Forma</text>
<text x="145" y="579" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">(sintaxis)</text>
<path d="M423 498 V629" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="458" y="524" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">¿Tiene los datos necesarios?</text>
<text x="458" y="569" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Campos, tipos y versión acordados.</text>
<text x="458" y="607" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">La estructura correcta es sólo una parte.</text>
</g>
<g id="significado" aria-label="Significado (semántica)">
<rect x="52" y="679" width="1096" height="177" fill="#F7F6F2" stroke="#A5A79F" stroke-width="1.5"/>
<circle cx="93" cy="731" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="93" y="740" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">2</text>
<text x="145" y="740" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#202020">Significado</text>
<text x="145" y="783" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">(semántica)</text>
<path d="M423 702 V833" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="458" y="728" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">¿Qué quiere decir «liberada»?</text>
<text x="458" y="773" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">La limpieza terminó. No afirma, por sí sola,</text>
<text x="458" y="811" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">que se pueda entregar esa habitación.</text>
</g>
<g id="tiempo" aria-label="Tiempo (vigencia y orden)">
<rect x="52" y="883" width="1096" height="177" fill="#E5E6E0" stroke="#A5A79F" stroke-width="1.5"/>
<circle cx="93" cy="935" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="93" y="944" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">3</text>
<text x="145" y="944" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#202020">Tiempo</text>
<text x="145" y="987" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">(vigencia y orden)</text>
<path d="M423 906 V1037" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="458" y="932" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">¿Sigue siendo válido ahora?</text>
<text x="458" y="977" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Un duplicado no repite la acción.</text>
<text x="458" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Una demora abre una verificación visible.</text>
</g>
<g id="accion" aria-label="Acción (operación)">
<rect x="52" y="1087" width="1096" height="177" fill="#F7F6F2" stroke="#A5A79F" stroke-width="1.5"/>
<circle cx="93" cy="1139" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="93" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">4</text>
<text x="145" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#202020">Acción</text>
<text x="145" y="1191" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">(operación)</text>
<path d="M423 1110 V1241" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="458" y="1136" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">¿Qué se hace si hay un problema?</text>
<text x="458" y="1181" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Definir quién decide, cómo se informa</text>
<text x="458" y="1219" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">la espera y quién corrige el error.</text>
</g>
<g id="aceptacion" aria-label="Todos anticipan la misma consecuencia">
<rect x="52" y="1325" width="1096" height="161" fill="#E5E6E0" stroke="#A5A79F" stroke-width="1.5"/>
<rect x="52" y="1325" width="8" height="161" fill="#CFFF00"/>
<text x="80" y="1367" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">EL CONTRATO ESTÁ COMPLETO CUANDO…</text>
<text x="80" y="1420" font-family="Georgia,serif" font-size="42" font-weight="400" text-anchor="start" fill="#202020">Todos anticipan la misma consecuencia</text>
<text x="80" y="1462" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">y saben qué hacer ante errores, demoras o datos dudosos.</text>
</g>
<g id="prueba" aria-label="Prueba: duplicar, demorar, desordenar y cambiar la versión.">
<text x="52" y="1537" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Prueba: duplicar, demorar, desordenar y cambiar la versión.</text>
</g>
<g id="revision" aria-label="Revisar tras 30 transiciones o ante una entrega incorrecta.">
<text x="52" y="1590" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Revisar tras 30 transiciones o ante una entrega incorrecta.</text>
</g>
</svg>
