<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="atlas-title atlas-desc">
  <title id="atlas-title">Atlas radial de prácticas y marcos METSI</title>
  <desc id="atlas-desc">Ocho estaciones A a H forman un anillo alrededor de METSI. La estación A está seleccionada y despliega, sobre una misma superficie de papel cálido, sus prácticas y vínculos con las lecturas.</desc>
  <defs>
    <style>
      .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:4px}.display{font:400 62px Georgia,serif}.title{font:400 44px Georgia,serif}.body{font:400 21px Georgia,serif}.meta{font:700 15px Arial,sans-serif;letter-spacing:2px}.label{font:700 18px Arial,sans-serif}.node{font:400 34px Georgia,serif}.small{font:400 16px Arial,sans-serif}.line{stroke:#b9b8b1;stroke-width:2}.sector{fill:none;stroke:#e1e1dc;stroke-width:72;stroke-linecap:butt}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#f6f4ee"/>
  <rect x="55" y="55" width="1690" height="1090" fill="none" stroke="#c8c6bf" stroke-width="2"/>
  <text class="eyebrow" x="105" y="125" fill="#6f8e00">ATLAS DE PRÁCTICAS Y MARCOS</text>
  <text class="display" x="565" y="135" fill="#242522">Un campo de prácticas,</text>
  <text class="display" x="565" y="205" fill="#242522">no un catálogo de métodos.</text>
  <text class="body" x="565" y="255" fill="#666762">Cada estación reorganiza las prácticas según el problema que permite comprender</text>
  <text class="body" x="565" y="286" fill="#666762">y la decisión que ayuda a tomar.</text>
  <path d="M105 325 H1695" class="line" fill="none"/>

