<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">N16, una contradicción se clasifica antes de corregirse</title>
  <desc id="desc">Cuatro vistas de Hotel Horizonte usan la palabra entregable para condiciones diferentes. Un recorrido del mismo caso R73 contrasta propósito, nivel, tiempo, identidad, evidencia y autoridad. La diferencia se registra como legítima, error, brecha temporal o tensión abierta, con tratamiento, responsable y plazo. Una línea de ciclo de vida conecta propuesta, validación, uso, revisión y retiro.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#747672"/></marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}
      .eyebrow{font-size:25px;font-weight:700;letter-spacing:7px}.title{font-size:55px;letter-spacing:-1.2px}.subtitle{font-size:26px;fill:#5F615E}
      .section{font-size:22px;font-weight:700;letter-spacing:4px}.label{font-size:24px;font-weight:700}.body{font-size:20px;fill:#4F514E}.small{font-size:18px;fill:#666864}.number{font-size:19px;font-weight:700;letter-spacing:3px}
      .rule{stroke:#A9ABA7;stroke-width:2}.route{fill:none;stroke:#747672;stroke-width:3;marker-end:url(#arrow)}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#F7F7F4"/><rect x="36" y="36" width="1728" height="1028" rx="20" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M72 74 H210 L196 94 H58 Z" fill="#CFFF00"/><text x="238" y="94" class="sans eyebrow">N16 · EXPEDIENTE DE COHERENCIA</text>
  <text x="72" y="168" class="serif title">Una contradicción se clasifica antes de corregirse</text>
  <text x="74" y="212" class="sans subtitle">La diferencia revela qué vista, momento o compromiso todavía necesita gobierno.</text><line x1="72" y1="246" x2="1728" y2="246" class="rule"/>

  <text x="84" y="300" class="sans section">CUATRO AFIRMACIONES</text><text x="650" y="300" class="sans section">PRUEBA TRANSVERSAL</text><text x="1194" y="300" class="sans section">REGISTRO Y TRATAMIENTO</text>
  <g aria-label="Cuatro usos de entregable">
    <g><rect x="84" y="338" width="486" height="94" class="outline"/><text x="112" y="374" class="sans number">PROCESO</text><text x="112" y="407" class="sans body">inspección + asignación + acceso</text></g>
    <g><rect x="84" y="450" width="486" height="94" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="112" y="486" class="sans number">ESTADOS</text><text x="112" y="519" class="sans body">preparada para inventario</text></g>
    <g><rect x="84" y="562" width="486" height="94" class="outline"/><text x="112" y="598" class="sans number">EXPERIENCIA</text><text x="112" y="631" class="sans body">confirmación recibida por el huésped</text></g>
    <g><rect x="84" y="674" width="486" height="94" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="112" y="710" class="sans number">TABLERO</text><text x="112" y="743" class="sans body">limpieza terminada</text></g>
    <path d="M570 385 H620" class="route"/><path d="M570 497 H620" class="route"/><path d="M570 609 H620" class="route"/><path d="M570 721 H620" class="route"/>
  </g>

  <g aria-label="Recorrido del mismo caso">
    <path d="M638 338 H1098 L1130 370 V768 H638 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><path d="M1098 338 V370 H1130" fill="none" stroke="#777A76" stroke-width="2.2"/>
    <path d="M638 338 H834 L818 360 H622 Z" fill="#CFFF00"/><text x="676" y="397" class="sans number">R73 · MISMO EPISODIO</text>
    <text x="676" y="450" class="serif" style="font-size:31px">¿Las vistas pueden explicar</text><text x="676" y="488" class="serif" style="font-size:31px">juntas una llegada accesible?</text>
    <line x1="676" y1="520" x2="1092" y2="520" class="rule"/>
    <text x="676" y="558" class="sans number">01 · PROPÓSITO + NIVEL</text><text x="676" y="588" class="sans small">qué afirma cada vista y hasta dónde</text>
    <text x="676" y="632" class="sans number">02 · TIEMPO + IDENTIDAD</text><text x="676" y="662" class="sans small">qué versión rige y qué caso conserva</text>
    <text x="676" y="706" class="sans number">03 · EVIDENCIA + AUTORIDAD</text><text x="676" y="736" class="sans small">quién puede sostener, decidir y reparar</text>
    <circle cx="1130" cy="554" r="10" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
  </g>
  <path d="M1150 554 H1204" class="route"/>

  <g aria-label="Registro de contradicción">
    <path d="M1220 338 H1708 L1732 362 V768 H1220 Z" class="outline"/><text x="1252" y="388" class="sans number">CLASIFICACIÓN</text>
    <g><circle cx="1254" cy="438" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1280" y="445" class="sans label">Diferencia legítima</text></g>
    <g><circle cx="1254" cy="494" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1280" y="501" class="sans label">Error verificable</text></g>
    <g><circle cx="1254" cy="550" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="1280" y="557" class="sans label">Brecha temporal</text></g>
    <g><circle cx="1254" cy="606" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1280" y="613" class="sans label">Tensión abierta</text></g>
    <line x1="1252" y1="648" x2="1698" y2="648" class="rule"/>
    <text x="1252" y="687" class="sans number">TRATAMIENTO</text><text x="1252" y="720" class="sans body">corregir · decidir · investigar · aceptar riesgo</text><text x="1252" y="751" class="sans small">efecto, responsable, plazo y condición de cierre</text>
  </g>

  <line x1="72" y1="830" x2="1728" y2="830" class="rule"/><text x="84" y="878" class="sans section">CICLO DE VIDA GOBERNADO</text>
  <g aria-label="Ciclo de vida de los modelos">
    <path d="M112 934 H1668" class="route"/><circle cx="194" cy="934" r="14" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="502" cy="934" r="14" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="810" cy="934" r="14" fill="#CFFF00" stroke="#202020" stroke-width="2"/><circle cx="1118" cy="934" r="14" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="1426" cy="934" r="14" fill="#FFFFFF" stroke="#202020" stroke-width="2"/>
    <text x="194" y="908" class="sans number" text-anchor="middle">PROPONER</text><text x="502" y="908" class="sans number" text-anchor="middle">VALIDAR</text><text x="810" y="908" class="sans number" text-anchor="middle">USAR</text><text x="1118" y="908" class="sans number" text-anchor="middle">REVISAR</text><text x="1426" y="908" class="sans number" text-anchor="middle">RETIRAR</text>
    <text x="810" y="982" class="sans small" text-anchor="middle">baseline suficiente para decisiones explícitas, nunca verdad eterna</text>
  </g>
  <text x="84" y="1032" class="sans small">LA COHERENCIA NO BORRA DIFERENCIAS: LAS HACE EXPLICABLES, TRAZABLES Y REVISABLES.</text><text x="1710" y="1032" class="sans small" text-anchor="end">N16 · METSI</text>
</svg>
