<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Un efecto puede volver como causa</title><desc id="desc">La sobreventa puede reforzar el mismo problema que intenta resolver. Incluí en el análisis reglas de canales, proveedores y otras condiciones externas, aunque no las controles.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Un efecto puede volver como causa">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N03">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N03 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Un efecto puede volver como causa</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La sobreventa puede reforzar el mismo problema que intenta resolver.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Presión por ocupación" data-row-bottom="489.6">
<circle cx="82" cy="344.0" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="354.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="345.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Presión por ocupación</text>
<text x="145" y="389.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Se busca vender más habitaciones.</text>
<text x="145" y="434.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Aumenta el margen de sobreventa.</text>
</g>
<path id="e-item-0-item-1" d="M82 374.0 V504.6" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Sobreventa" data-row-bottom="685.2">
<circle cx="82" cy="539.6" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="549.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="540.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Sobreventa</text>
<text x="145" y="584.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Aumenta la exposición a reservas incompatibles.</text>
<text x="145" y="630.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Aparecen más excepciones que resolver.</text>
</g>
<path id="e-item-1-item-2" d="M82 569.6 V700.2" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Reparación manual" data-row-bottom="880.8000000000001">
<circle cx="82" cy="735.2" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="745.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="736.2" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Reparación manual</text>
<text x="145" y="780.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El equipo dedica tiempo a reubicar y corregir.</text>
<text x="145" y="826.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Queda menos atención para actualizar los estados.</text>
</g>
<path id="e-item-2-item-3" d="M82 765.2 V895.8000000000001" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Datos menos oportunos" data-row-bottom="1076.3999999999999">
<circle cx="82" cy="930.8" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="940.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="931.8" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Datos menos oportunos</text>
<text x="145" y="975.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La información llega tarde o queda incompleta.</text>
<text x="145" y="1021.5999999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La coordinación pierde una base confiable.</text>
</g>
<path id="e-item-3-item-4" d="M82 960.8 V1091.3999999999999" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-4" aria-label="Más incertidumbre" data-row-bottom="1272.0">
<circle cx="82" cy="1126.4" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1136.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">05</text>
<text x="145" y="1127.4" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Más incertidumbre</text>
<text x="145" y="1171.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Comercial percibe más incertidumbre sobre la ocupación.</text>
<text x="145" y="1217.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Esa incertidumbre puede impulsar más sobreventa.</text>
</g>
<path id="e-item-4-item-0" d="M1144 1235 H1170 V310 H1134" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="El ciclo vuelve al inicio">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">El ciclo vuelve al inicio</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Incluí en el análisis reglas de canales, proveedores y otras condiciones</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">externas, aunque no las controles.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>