<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">La reserva está confirmada. La familia todavía no puede entrar.</title><desc id="desc">A la izquierda están las capacidades del hotel; a la derecha, canal de reservas, identidad y cerraduras. Tres intercambios cruzan una frontera de confianza. Debajo, la contingencia pasa por verificación presencial, llave limitada autorizada, doble registro y revisión posterior. Cuatro personas conservan responsabilidades distintas y se fija una condición de revisión.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect x="0" y="0" width="1200" height="1620" fill="#F7F6F2"/>
<g id="encabezado" aria-label="encabezado">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">METSI · N26 · MAPA DE DECISIÓN</text>
<text x="52" y="118" font-family="Georgia,serif" font-size="48" font-weight="400" text-anchor="start" fill="#202020">La reserva está confirmada.</text>
<text x="52" y="182" font-family="Georgia,serif" font-size="48" font-weight="400" text-anchor="start" fill="#202020">La familia todavía no puede entrar.</text>
<text x="52" y="226" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Hotel Horizonte · Una llegada a las 22.15 y tres dependencias externas.</text>
<path d="M52 250 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
</g>
<text x="52" y="295" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">01   El servicio depende de varias partes</text>
<path d="M645 335 V795" fill="none" stroke="#92958F" stroke-width="2" stroke-dasharray="6 8"/>
<path id="e-canal" d="M760 480 H539" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-identidad" d="M760 597 H539" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-cerraduras" d="M760 714 H539" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="hotel" aria-label="CAPACIDADES DEL HOTEL">
<rect x="52" y="335" width="485" height="460" fill="#E5E6E0" stroke="#A5A79F" stroke-width="1.5"/>
<text x="80" y="381" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">CAPACIDADES DEL HOTEL</text>
<text x="80" y="438" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Inventario y reserva</text>
<text x="80" y="476" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Qué habitación se ofrece.</text>
<text x="80" y="520" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Housekeeping</text>
<text x="80" y="558" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Si está limpia y disponible.</text>
<text x="80" y="602" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Recepción</text>
<text x="80" y="640" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Asignación y excepciones.</text>
<text x="80" y="684" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Pagos y registro</text>
<text x="80" y="722" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Pago, trazas y reparación.</text>
<text x="80" y="768" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#202020">Resultado: completar el ingreso.</text>
</g>
<rect x="760" y="335" width="388" height="460" fill="#F7F6F2" stroke="#A5A79F" stroke-width="1.5"/>
<text x="788" y="381" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">SERVICIOS EXTERNOS</text>
<g id="canal" aria-label="Canal de reservas">
<text x="788" y="438" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Canal de reservas</text>
<text x="788" y="476" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Confirma la venta.</text>
</g>
<g id="identidad" aria-label="Servicio de identidad">
<text x="788" y="555" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Servicio de identidad</text>
<text x="788" y="593" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Valida a la persona.</text>
</g>
<g id="cerraduras" aria-label="Cerraduras">
<text x="788" y="672" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Cerraduras</text>
<text x="788" y="710" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Habilitan la llave.</text>
</g>
<g id="frontera" aria-label="En cada intercambio se acuerda qué dato aceptar, quién puede corregirlo y qué hacer si no alcanza.">
<text x="52" y="844" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Frontera de confianza: no aceptar un dato sin condiciones.</text>
<text x="52" y="888" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">En cada intercambio se acuerda qué dato aceptar,</text>
<text x="52" y="925" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">quién puede corregirlo y qué hacer si no alcanza.</text>
</g>
<path d="M52 951 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="52" y="999" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">02   Si la identidad no se puede confirmar</text>
<path id="e-verificar" d="M196 1060 H414" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-llave" d="M481 1060 H699" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-registro" d="M766 1060 H984" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="verificar" aria-label="Verificación presencial">
<circle cx="165" cy="1060" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="165" y="1069" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">1</text>
<text x="165" y="1124" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Verificación</text>
<text x="165" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202020">presencial</text>
</g>
<g id="llave" aria-label="Llave limitada con autorización">
<circle cx="450" cy="1060" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="450" y="1069" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">2</text>
<text x="450" y="1124" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Llave limitada</text>
<text x="450" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202020">con autorización</text>
</g>
<g id="registro" aria-label="Doble registro del episodio">
<circle cx="735" cy="1060" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="735" y="1069" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">3</text>
<text x="735" y="1124" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Doble registro</text>
<text x="735" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202020">del episodio</text>
</g>
<g id="posterior" aria-label="Revisión posterior y aviso al canal">
<circle cx="1020" cy="1060" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="1020" y="1069" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">4</text>
<text x="1020" y="1124" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Revisión posterior</text>
<text x="1020" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202020">y aviso al canal</text>
</g>
<text x="52" y="1216" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">La contingencia tiene límites: no permite omitir controles.</text>
<path d="M52 1243 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="52" y="1291" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">03   El hotel conserva la responsabilidad</text>
<g id="ricardo" aria-label="Ricardo · Autoriza la respuesta operativa.">
<text x="52" y="1344" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Ricardo</text>
<text x="52" y="1382" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Autoriza la respuesta operativa.</text>
</g>
<g id="lucia" aria-label="Lucía · Registra lo ocurrido en Recepción.">
<text x="635" y="1344" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Lucía</text>
<text x="635" y="1382" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Registra lo ocurrido en Recepción.</text>
</g>
<g id="federico" aria-label="Federico · Conserva la traza técnica.">
<text x="52" y="1440" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Federico</text>
<text x="52" y="1478" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Conserva la traza técnica.</text>
</g>
<g id="camila" aria-label="Camila · Ajusta lo que promete el canal.">
<text x="635" y="1440" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Camila</text>
<text x="635" y="1478" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Ajusta lo que promete el canal.</text>
</g>
<g id="revision" aria-label="Revisar tras 20 ingresos o ante una identidad discutida.">
<text x="52" y="1533" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Revisar tras 20 ingresos o ante una identidad discutida.</text>
</g>
<path d="M52 1560 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="52" y="1596" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202020">Que cada servicio responda no garantiza que la familia pueda entrar.</text>
</svg>
