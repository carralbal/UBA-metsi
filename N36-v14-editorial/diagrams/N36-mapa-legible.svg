<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Salir bien no siempre significa aprender</title><desc id="desc">Una mejora puede depender de trabajo invisible que la explicación inicial no contempló. El nuevo episodio puede confirmar o cuestionar el cambio. Aprender incluye conservar esa posibilidad abierta.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Salir bien no siempre significa aprender">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N36">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N36 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Salir bien no siempre significa aprender</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una mejora puede depender de trabajo invisible que la explicación inicial</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">no contempló.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Resultado esperado" data-row-bottom="504.48">
<circle cx="82" cy="362.6" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="372.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="363.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Resultado esperado</text>
<text x="145" y="407.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La integración debería reducir el trabajo manual.</text>
<text x="145" y="453.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Ese es el mecanismo que se quiere poner a prueba.</text>
</g>
<path id="e-item-0-item-1" d="M82 392.6 V519.48" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Sorpresa" data-row-bottom="696.36">
<circle cx="82" cy="554.48" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="564.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="555.48" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Sorpresa</text>
<text x="145" y="599.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Baja la espera, pero Recepción anticipa excepciones en silencio.</text>
<text x="145" y="645.28" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El buen resultado no demuestra que la integración lo explique</text>
<text x="145" y="683.0799999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">sola.</text>
</g>
<path id="e-item-1-item-2" d="M82 584.48 V711.36" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Revisar la práctica" data-row-bottom="888.24">
<circle cx="82" cy="746.36" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="756.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="747.36" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Revisar la práctica</text>
<text x="145" y="791.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Un bucle: ajustar la acción.</text>
<text x="145" y="837.16" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Dos bucles: revisar también objetivo, reglas y autoridad.</text>
</g>
<path id="e-item-2-item-3" d="M82 776.36 V903.24" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Cambiar algo comprobable" data-row-bottom="1080.12">
<circle cx="82" cy="938.24" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="948.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="939.24" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Cambiar algo comprobable</text>
<text x="145" y="983.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Acción, responsable y próximo episodio que puede refutarla.</text>
<text x="145" y="1029.04" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La IA puede proponer preguntas; las personas verifican y deciden.</text>
</g>
<path id="e-item-3-item-4" d="M82 968.24 V1095.12" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-4" aria-label="Comprobar transferencia" data-row-bottom="1272.0">
<circle cx="82" cy="1130.12" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1140.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">05</text>
<text x="145" y="1131.12" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Comprobar transferencia</text>
<text x="145" y="1175.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Otra persona puede sostener el criterio en una situación nueva.</text>
<text x="145" y="1220.9199999999998" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El aprendizaje debe aparecer en la práctica, no sólo en el relato.</text>
</g>
<path id="e-item-4-item-0" d="M1144 1235 H1170 V310 H1134" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Volver a poner a prueba">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Volver a poner a prueba</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El nuevo episodio puede confirmar o cuestionar el cambio. Aprender</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">incluye conservar esa posibilidad abierta.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>