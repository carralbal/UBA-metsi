<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N22, una hipótesis gobierna qué evidencia puede cambiar la apuesta</title>
  <desc id="desc">El expediente de HH-22 formula una relación condicional entre población, intervención, mecanismo y resultado. Dos explicaciones rivales se comparan contra una misma línea de base. La puerta de decisión exige una reducción sostenida de reasignaciones, mientras una sola pérdida crítica de accesibilidad activa revisión inmediata. El cierre conserva separados el resultado observado, la interpretación y la decisión de alcance.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:45px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.rule{stroke:#A8AAA6;stroke-width:2}.edge{fill:none;stroke:#737673;stroke-width:3}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N22 · EXPEDIENTE DE HIPÓTESIS</text>
  <text x="68" y="155" class="serif title">Una hipótesis debe poder perder apoyo</text>
  <text x="70" y="196" class="sans subtitle">La prueba vale cuando una observación puede cambiar una decisión ya preparada.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Hipótesis principal">
    <text x="72" y="270" class="sans section">HIPÓTESIS PRINCIPAL · HH-22</text>
    <path d="M72 300 H1128 V484 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><path d="M72 300 H246 L232 322 H58 Z" fill="#CFFF00"/>
    <text x="104" y="350" class="sans number">SI SE CONFIRMA SÓLO CON TRES ESTADOS VERIFICADOS</text>
    <g aria-label="Población"><rect x="104" y="378" width="210" height="72" rx="8" class="outline"/><text x="209" y="407" class="sans label" text-anchor="middle">Población</text><text x="209" y="433" class="sans body" text-anchor="middle">llegadas anticipadas</text></g>
    <g aria-label="Intervención"><rect x="354" y="378" width="210" height="72" rx="8" class="outline"/><text x="459" y="407" class="sans label" text-anchor="middle">Intervención</text><text x="459" y="433" class="sans body" text-anchor="middle">confirmación asistida</text></g>
    <g aria-label="Mecanismo"><rect x="604" y="378" width="210" height="72" rx="8" class="outline"/><text x="709" y="407" class="sans label" text-anchor="middle">Mecanismo</text><text x="709" y="433" class="sans body" text-anchor="middle">decidir antes de prometer</text></g>
    <g aria-label="Resultado"><rect x="854" y="378" width="242" height="72" rx="8" class="outline"/><text x="975" y="407" class="sans label" text-anchor="middle">Resultado</text><text x="975" y="433" class="sans body" text-anchor="middle">menos reasignaciones</text></g>
    <path d="M314 414 H346 M564 414 H596 M814 414 H846" class="edge" marker-end="url(#arrow)"/>
  </g>

  <g aria-label="Explicaciones rivales">
    <text x="72" y="542" class="sans section">DOS EXPLICACIONES, UNA MISMA OBSERVACIÓN</text>
    <path d="M72 574 H558 L574 590 V826 H72 Z" class="outline"/><path d="M626 574 H1112 L1128 590 V826 H626 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/>
    <circle cx="112" cy="618" r="18" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="112" y="624" class="sans number" text-anchor="middle">A</text>
    <text x="148" y="624" class="sans label">Mecanismo principal</text><text x="104" y="670" class="serif" style="font-size:27px">Estados consistentes llegan</text><text x="104" y="703" class="serif" style="font-size:27px">antes de la promesa.</text>
    <path d="M104 730 H526" class="rule"/><text x="104" y="766" class="sans body">Predice mejora sólo cuando reserva,</text><text x="104" y="793" class="sans body">cerradura y accesibilidad coinciden.</text>
    <circle cx="666" cy="618" r="18" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="666" y="624" class="sans number" text-anchor="middle">B</text>
    <text x="702" y="624" class="sans label">Hipótesis rival</text><text x="658" y="670" class="serif" style="font-size:27px">El mensaje más claro explica</text><text x="658" y="703" class="serif" style="font-size:27px">la mejora observada.</text>
    <path d="M658 730 H1080" class="rule"/><text x="658" y="766" class="sans body">Predice mejora aun cuando la asignación</text><text x="658" y="793" class="sans body">y sus estados no cambian.</text>
    <g aria-label="Línea de base común"><path d="M266 826 V864 H934 V826" class="edge"/><circle cx="600" cy="864" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/><rect x="206" y="884" width="788" height="88" rx="8" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><text x="600" y="920" class="sans label" text-anchor="middle">Misma línea de base segmentada</text><text x="600" y="949" class="sans body" text-anchor="middle">turno · canal · tipo de habitación · accesibilidad</text></g>
  </g>

  <g aria-label="Puerta de decisión">
    <text x="72" y="1034" class="sans section">PUERTA PREVIA DE DECISIÓN</text>
    <path d="M72 1066 H1128 V1252 H72 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/>
    <g aria-label="Umbral de continuación"><circle cx="126" cy="1121" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><path d="M115 1121 L123 1129 L139 1111" fill="none" stroke="#202020" stroke-width="4"/><text x="174" y="1116" class="sans label">Continuar requiere evidencia acumulada</text><text x="174" y="1147" class="sans body">reducción sostenida de reasignaciones</text></g>
    <path d="M600 1088 V1228" class="rule"/>
    <g aria-label="Salvaguarda de detención"><circle cx="654" cy="1121" r="22" fill="#CFFF00" stroke="#202020" stroke-width="2"/><path d="M642 1109 L666 1133 M666 1109 L642 1133" fill="none" stroke="#202020" stroke-width="4"/><text x="702" y="1116" class="sans label">Detener admite una sola señal crítica</text><text x="702" y="1147" class="sans body">reasignación indebida de una habitación accesible</text></g>
    <text x="174" y="1200" class="sans small">Autoridad: Elena amplía sólo si ambas condiciones se sostienen.</text><text x="702" y="1200" class="sans small">Autoridad: Recepción revierte y activa revisión inmediata.</text>
  </g>

  <g aria-label="Cierre del expediente">
    <text x="72" y="1310" class="sans section">EL CIERRE NO COLAPSA TRES REGISTROS</text>
    <g aria-label="Resultado observado"><path d="M72 1342 H392 V1464 H72 Z" class="outline"/><text x="96" y="1380" class="sans number">01 · RESULTADO</text><text x="96" y="1414" class="sans body">Mejora en reservas directas.</text><text x="96" y="1442" class="sans body">Falla crítica en accesibilidad.</text></g>
    <g aria-label="Interpretación"><path d="M440 1342 H760 V1464 H440 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="464" y="1380" class="sans number">02 · INTERPRETACIÓN</text><text x="464" y="1414" class="sans body">El mecanismo gana apoyo</text><text x="464" y="1442" class="sans body">para una población y lo pierde en otra.</text></g>
    <g aria-label="Decisión"><path d="M808 1342 H1128 V1464 H808 Z" fill="#FFFFFF" stroke="#202020" stroke-width="2.4"/><path d="M808 1342 H934 L922 1363 H796 Z" fill="#CFFF00"/><text x="832" y="1380" class="sans number">03 · DECISIÓN</text><text x="832" y="1414" class="sans body">Mantener asistencia directa.</text><text x="832" y="1442" class="sans body">No autorizar expansión general.</text></g>
    <path d="M392 1403 H432 M760 1403 H800" class="edge" marker-end="url(#arrow)"/>
  </g>
  <path d="M72 1502 H1128" class="rule"/><text x="72" y="1538" class="sans small">UNA MÉTRICA FAVORABLE NO BORRA UNA SALVAGUARDA VULNERADA.</text><text x="1128" y="1538" class="sans small" text-anchor="end">N22 · METSI</text>
</svg>
