<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Participar no es tener el mismo poder</title><desc id="desc">Un mapa de actores muestra quién puede actuar y quién carga con las consecuencias. Participación, decisiones reconstruibles y vías de objeción y reparación. Cambiar una regla también redistribuye poder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Participar no es tener el mismo poder">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N05">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N05 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Participar no es tener el mismo poder</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Un mapa de actores muestra quién puede actuar y quién carga con las</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">consecuencias.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Definir" data-row-bottom="472.5">
<path d="M52 320.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="364.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Definir</text>
<text x="530" y="362.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién logra instalar un problema.</text>
<text x="530" y="401.64000000000004" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Su versión puede excluir otras</text>
<text x="530" y="434.68000000000006" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">experiencias.</text>
</g>
<g id="item-1" aria-label="Conocer" data-row-bottom="632.4">
<path d="M52 480.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="524.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Conocer</text>
<text x="530" y="522.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién tiene información y experiencia sobre</text>
<text x="530" y="555.54" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">lo que ocurre.</text>
<text x="530" y="594.58" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Saber no siempre da autoridad para decidir.</text>
</g>
<g id="item-2" aria-label="Autorizar" data-row-bottom="792.3000000000001">
<path d="M52 640.4000000000001 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="684.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Autorizar</text>
<text x="530" y="682.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién habilita recursos o excepciones.</text>
<text x="530" y="721.44" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cada decisión necesita un responsable.</text>
</g>
<g id="item-3" aria-label="Ejecutar" data-row-bottom="952.2">
<path d="M52 800.3000000000001 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="844.3000000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Ejecutar</text>
<text x="530" y="842.3000000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién hace el trabajo y resuelve</text>
<text x="530" y="875.34" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">dificultades.</text>
<text x="530" y="914.3800000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Puede advertir lo que el plan no contempló.</text>
</g>
<g id="item-4" aria-label="Recibir las consecuencias" data-row-bottom="1112.1000000000001">
<path d="M52 960.2 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1004.2" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Recibir las</text>
<text x="78" y="1050.1000000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">consecuencias</text>
<text x="530" y="1002.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién recibe beneficios, costos o daños.</text>
<text x="530" y="1041.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Puede ser alguien que no fue escuchado.</text>
</g>
<g id="item-5" aria-label="Objetar y reparar" data-row-bottom="1272.0">
<path d="M52 1120.1 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1164.1" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Objetar y reparar</text>
<text x="530" y="1162.1" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién puede cuestionar y pedir respuestas.</text>
<text x="530" y="1201.1399999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Escuchar exige poder corregir lo que falla.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 400.55 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 560.45 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 720.35 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 880.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-4-decision" d="M1148 1040.15 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-5-decision" d="M1148 1200.0500000000002 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Contrapesos necesarios">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Contrapesos necesarios</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Participación, decisiones reconstruibles y vías de objeción y</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">reparación. Cambiar una regla también redistribuye poder.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>