<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">Cadena de evidencia desde la fuente hasta la decisión</title><desc id="desc">Una secuencia conecta fuente, registro, dato, interpretación, hipótesis y decisión. Un control transversal conserva procedencia, definición, incertidumbre, autoridad y condición de revisión.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker></defs><rect width="1800" height="660" fill="#FAFAF8"/><path d="M55 94 H1745" stroke="#202020" stroke-width="3"/><text x="55" y="60" text-anchor="start" font-family="Avenir" font-size="23" font-weight="700" fill="#202020"><tspan x="55" y="60">N04 · CADENA DE EVIDENCIA</tspan></text><text x="55" y="137" text-anchor="start" font-family="Avenir" font-size="37" font-weight="500" fill="#202020"><tspan x="55" y="137">Una afirmación conserva su fuerza sólo si conserva su historia</tspan></text><g id="connectors" fill="none" stroke="#444" stroke-width="3" marker-end="url(#arrow)"><path d="M525 260 H665"/><path d="M1135 260 H1275"/><path d="M1745 335 V370 Q1745 410 1705 410 H1510 V410"/><path d="M1275 485 H1135"/><path d="M665 485 H525"/></g><text x="595" y="247" text-anchor="middle" font-family="Avenir" font-size="15" font-weight="600" fill="#202020"><tspan x="595" y="247">captura</tspan></text><text x="1205" y="247" text-anchor="middle" font-family="Avenir" font-size="15" font-weight="600" fill="#202020"><tspan x="1205" y="247">codifica</tspan></text><text x="1710" y="378" text-anchor="end" font-family="Avenir" font-size="15" font-weight="600" fill="#202020"><tspan x="1710" y="378">interpreta</tspan></text><text x="1205" y="472" text-anchor="middle" font-family="Avenir" font-size="15" font-weight="600" fill="#202020"><tspan x="1205" y="472">contrasta</tspan></text><text x="595" y="472" text-anchor="middle" font-family="Avenir" font-size="15" font-weight="600" fill="#202020"><tspan x="595" y="472">compromete</tspan></text><rect x="55" y="592" width="1690" height="42" fill="#E4E6E5"/><path d="M55 592 H420" stroke="#CFFF00" stroke-width="8"/><text x="80" y="620" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="80" y="620">CONTROL TRANSVERSAL  ·  procedencia  ·  definición  ·  incertidumbre  ·  autoridad  ·  revisión</tspan></text><g id="source"><path d="M55 185 H485 L525 225 V335 H55 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="79" y="219" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="79" y="219">01</tspan></text><text x="79" y="266" text-anchor="start" font-family="Avenir" font-size="25" font-weight="700" fill="#202020"><tspan x="79" y="266">FUENTE</tspan></text><text x="79" y="303" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="79" y="303">Persona · sensor · documento</tspan></text><circle cx="498" cy="209" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="record"><path d="M665 185 H1095 L1135 225 V335 H665 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="689" y="219" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="689" y="219">02</tspan></text><text x="689" y="266" text-anchor="start" font-family="Avenir" font-size="25" font-weight="700" fill="#202020"><tspan x="689" y="266">REGISTRO</tspan></text><text x="689" y="303" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="689" y="303">Captura situada y parcial</tspan></text><circle cx="1108" cy="209" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="data"><path d="M1275 185 H1705 L1745 225 V335 H1275 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="1299" y="219" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="1299" y="219">03</tspan></text><text x="1299" y="266" text-anchor="start" font-family="Avenir" font-size="25" font-weight="700" fill="#202020"><tspan x="1299" y="266">DATO</tspan></text><text x="1299" y="303" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="1299" y="303">Codificación según una definición</tspan></text><circle cx="1718" cy="209" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="interpretation"><path d="M1275 410 H1705 L1745 450 V560 H1275 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="1299" y="444" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="1299" y="444">04</tspan></text><text x="1299" y="491" text-anchor="start" font-family="Avenir" font-size="25" font-weight="700" fill="#202020"><tspan x="1299" y="491">INTERPRETACIÓN</tspan></text><text x="1299" y="528" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="1299" y="528">Significado atribuido</tspan></text><circle cx="1718" cy="434" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="hypothesis"><path d="M665 410 H1095 L1135 450 V560 H665 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="689" y="444" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="689" y="444">05</tspan></text><text x="689" y="491" text-anchor="start" font-family="Avenir" font-size="25" font-weight="700" fill="#202020"><tspan x="689" y="491">HIPÓTESIS</tspan></text><text x="689" y="528" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="689" y="528">Mecanismo que puede contrastarse</tspan></text><circle cx="1108" cy="434" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="decision"><path d="M55 410 H485 L525 450 V560 H55 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="79" y="444" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="79" y="444">06</tspan></text><text x="79" y="491" text-anchor="start" font-family="Avenir" font-size="25" font-weight="700" fill="#202020"><tspan x="79" y="491">DECISIÓN</tspan></text><text x="79" y="528" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="79" y="528">Acción con condición de revisión</tspan></text><circle cx="498" cy="434" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g></svg>