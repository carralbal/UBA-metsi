<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc">
<title id="title">N25 · Dónde espera un cambio</title><desc id="desc">Mapa en cuatro franjas. Primero sigue la misma modificación desde la demanda hasta el uso, con dos relojes: necesidad y compromiso. Después separa 46 días en 8 de trabajo y 38 de espera, desglosados en cuatro causas. Compara cuatro decisiones antes y después. Cierra con un circuito de señal, autoridad, decisión, cambio y efecto observado.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs><rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="encabezado"><path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">METSI · N25 · MAPA DE DECISIÓN</text>
<text x="52" y="118" font-family="Georgia,serif" font-size="52" font-weight="400" text-anchor="start" fill="#202020">46 días para un cambio.</text>
<text x="52" y="182" font-family="Georgia,serif" font-size="52" font-weight="400" text-anchor="start" fill="#202020">Sólo 8 fueron de trabajo.</text>
<text x="52" y="226" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Hotel Horizonte: una modificación del registro de reasignaciones.</text>
<path d="M52 250 H1148" fill="none" stroke="#777A76" stroke-width="2"/>
</g>
