<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Antes de aprobar una intervención</title><desc id="desc">Nueve campos se controlan entre sí. No son casilleros para completar sin discutir. ¿La evidencia alcanza para esta acción? Aprobar, devolver, dividir o reformular antes de asumir un costo irreversible.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Antes de aprobar una intervención">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N10">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N10 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Antes de aprobar una intervención</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Nueve campos se controlan entre sí. No son casilleros para completar sin</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">discutir.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Situar el cambio" data-row-bottom="632.4000000000001">
<path d="M52 320.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="364.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Situar el cambio</text>
<text x="530" y="362.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Situación observada · personas</text>
<text x="530" y="402.72" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">afectadas · resultado esperado.</text>
<text x="530" y="448.84000000000003" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Qué pasa, para quién y qué debería</text>
<text x="530" y="488.96000000000004" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">cambiar en una ventana definida.</text>
</g>
<g id="item-1" aria-label="Sostener el argumento" data-row-bottom="952.2">
<path d="M52 640.4000000000001 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="684.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Sostener el argumento</text>
<text x="530" y="682.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Explicaciones rivales · evidencia y</text>
<text x="530" y="722.5200000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">vacíos · frontera.</text>
<text x="530" y="768.6400000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Qué podría explicar lo observado,</text>
<text x="530" y="808.7600000000001" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">qué lo apoya y qué quedó afuera.</text>
</g>
<g id="item-2" aria-label="Limitar el compromiso" data-row-bottom="1272.0">
<path d="M52 960.2 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1004.2" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Limitar el compromiso</text>
<text x="530" y="1002.2" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Restricciones y preferencias ·</text>
<text x="530" y="1042.32" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">protección y reparación · revisión.</text>
<text x="530" y="1088.44" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Qué no debe degradarse y qué</text>
<text x="530" y="1128.56" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">hallazgo obliga a volver al</text>
<text x="530" y="1168.68" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">encuadre.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 480.5 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 800.3000000000001 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 1120.1 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Puerta de decisión">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Puerta de decisión</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿La evidencia alcanza para esta acción? Aprobar, devolver, dividir o</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">reformular antes de asumir un costo irreversible.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>