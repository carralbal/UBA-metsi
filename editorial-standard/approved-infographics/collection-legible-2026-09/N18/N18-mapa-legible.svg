<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Cambiar la pieza sin perder la protección</title><desc id="desc">Una práctica heredada puede conservar algo valioso aunque su implementación sea reemplazable. Relacioná fuente, interpretación, diseño y ensayo. Retirá la práctica anterior cuando se haya probado que la protección continúa.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Cambiar la pieza sin perder la protección">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N18">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N18 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Cambiar la pieza sin perder la</text>
<text x="52" y="185.5" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">protección</text>
<text x="52" y="263.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una práctica heredada puede conservar algo valioso aunque su implementación</text>
<text x="52" y="300.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">sea reemplazable.</text>
</g>
<path d="M52 346.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Llamada antes de reasignar" data-row-bottom="595.95">
<path d="M52 378.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="422.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Llamada antes de</text>
<text x="78" y="468.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">reasignar</text>
<text x="530" y="420.6" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Conservar la protección del compromiso</text>
<text x="530" y="456.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">con el huésped.</text>
<text x="530" y="497.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Reemplazar la llamada sólo si otra</text>
<text x="530" y="532.8000000000001" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">solución protege lo mismo.</text>
</g>
<g id="item-1" aria-label="Posible obligación" data-row-bottom="821.3000000000001">
<path d="M52 603.95 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="647.95" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Posible obligación</text>
<text x="530" y="645.95" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Verificar su fuente y alcance.</text>
<text x="530" y="687.35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">No tratar una interpretación pendiente</text>
<text x="530" y="722.75" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">como un requisito confirmado.</text>
</g>
<g id="item-2" aria-label="Autoridad concentrada" data-row-bottom="1046.6499999999999">
<path d="M52 829.3 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="873.3" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Autoridad concentrada</text>
<text x="530" y="871.3" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Hacer explícito quién puede autorizar.</text>
<text x="530" y="912.6999999999999" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Distribuir permisos sin dejar decisiones</text>
<text x="530" y="948.0999999999999" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">sin responsable.</text>
</g>
<g id="item-3" aria-label="Historial y versiones" data-row-bottom="1272.0">
<path d="M52 1054.65 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1098.65" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Historial y versiones</text>
<text x="530" y="1096.65" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Preservar los hechos y su significado.</text>
<text x="530" y="1138.0500000000002" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Migrar sin borrar la posibilidad de</text>
<text x="530" y="1173.4500000000003" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">reconstruir lo ocurrido.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 491.27500000000003 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 716.625 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 941.975 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 1167.325 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Prueba de modernización">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Prueba de modernización</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Relacioná fuente, interpretación, diseño y ensayo. Retirá la práctica</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">anterior cuando se haya probado que la protección continúa.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>