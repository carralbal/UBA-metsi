<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">La pregunta elige la vista</title><desc id="desc">Una cartera mínima selecciona representaciones por pregunta, decisión, audiencia, evidencia, costo y vigencia, y prueba su utilidad sin depender de la explicación del autor. La composición utiliza la topología lens para relacionar seis elementos del argumento.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4D4D4D"/></marker></defs><rect width="1800" height="1100" fill="#F6F4EE"/><rect x="42" y="34" width="1716" height="1024" rx="18" fill="none" stroke="#CCCCCC" stroke-width="2"/><g id="header"><path d="M 82 55 H 222 L 207 76 H 67 Z" fill="#CFFF00"/><text x="250.0" y="74.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#272525" text-anchor="start"><tspan x="250.0" dy="0.0">N15 · MAPA CONCEPTUAL</tspan></text><text x="90.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#272525" text-anchor="start"><tspan x="90.0" dy="0.0">La pregunta elige la vista</tspan></text><text x="90.0" y="208.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">Una cartera mínima selecciona representaciones por pregunta, decisión, audiencia, evidencia, costo y vigencia, y</tspan><tspan x="90.0" dy="26.8">prueba su utilidad sin depender de la explicación del autor.</tspan></text><path d="M 90 253.0 H 1710" stroke="#CCCCCC" stroke-width="2"/></g><g id="connectors"><path d="M 470 560 H 680" fill="none" stroke="#CFFF00" stroke-width="6" marker-end="url(#arrow)"/><path d="M 890 560 H 1090" fill="none" stroke="#CFFF00" stroke-width="6" marker-end="url(#arrow)"/><path d="M 790 520 L 790 335" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 790 520 L 1130 335" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 790 520 L 790 775" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 790 520 L 1130 775" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 1280 335 C 1120 335, 1110 560, 1260 560" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 1280 775 C 1120 775, 1110 560, 1260 560" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/></g><g id="objects"><g id="n1"><polygon points="100.0,450.0 448.0,450.0 470.0,472.0 470.0,660.0 100.0,660.0" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="118.0" y="476.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="118.0" dy="0.0">01</tspan></text><text x="122.0" y="505.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="122.0" dy="0.0">Pregunta sobre</tspan><tspan x="122.0" dy="28.1">validación previa sin</tspan><tspan x="122.0" dy="28.1">exclusión ni</tspan><tspan x="122.0" dy="28.1">sobrepromesa</tspan></text><circle cx="460.0" cy="460.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n2"><rect x="640.0" y="260.0" width="300.0" height="150.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="658.0" y="286.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="658.0" dy="0.0">02</tspan></text><text x="662.0" y="315.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="662.0" dy="0.0">Proceso: dónde espera</tspan><tspan x="662.0" dy="28.1">el huésped</tspan></text><circle cx="930.0" cy="270.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n3"><rect x="980.0" y="260.0" width="300.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="998.0" y="286.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="998.0" dy="0.0">03</tspan></text><text x="1002.0" y="315.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1002.0" dy="0.0">Estados: cuándo puede</tspan><tspan x="1002.0" dy="28.1">confirmarse</tspan></text><circle cx="1270.0" cy="270.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n4"><rect x="640.0" y="700.0" width="300.0" height="150.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="658.0" y="726.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="658.0" dy="0.0">04</tspan></text><text x="662.0" y="755.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="662.0" dy="0.0">Autoridad: quién</tspan><tspan x="662.0" dy="28.1">decide la excepción</tspan></text><circle cx="930.0" cy="710.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n5"><rect x="980.0" y="700.0" width="300.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="998.0" y="726.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="998.0" dy="0.0">05</tspan></text><text x="1002.0" y="755.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1002.0" dy="0.0">Experiencia: quién</tspan><tspan x="1002.0" dy="28.1">encuentra una barrera</tspan></text><circle cx="1270.0" cy="710.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n6"><polygon points="1480.0,450.0 1700.0,560.0 1480.0,670.0 1260.0,560.0" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1480.0" y="480.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="middle"><tspan x="1480.0" dy="0.0">06</tspan></text><text x="1480.0" y="552.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="middle"><tspan x="1480.0" dy="0.0">Prueba sin autor: la</tspan><tspan x="1480.0" dy="28.1">audiencia puede decidir</tspan></text><circle cx="1690.0" cy="460.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><circle cx="790" cy="560" r="105" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="3"/><text x="790.0" y="548.0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#272525" text-anchor="middle"><tspan x="790.0" dy="0.0">LENTE</tspan></text><text x="790.0" y="590.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#272525" text-anchor="middle"><tspan x="790.0" dy="0.0">DE ANÁLISIS</tspan></text></g><g id="footer"><path d="M 90 1000 H 1710" stroke="#CCCCCC" stroke-width="2"/><text x="90.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">METSI · LA FORMA VISUAL RESPONDE AL ARGUMENTO</tspan></text><text x="1710.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="end"><tspan x="1710.0" dy="0.0">LENS</tspan></text></g></svg>
