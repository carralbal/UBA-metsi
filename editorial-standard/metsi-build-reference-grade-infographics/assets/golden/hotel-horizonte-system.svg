<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Hotel Horizonte · arquitectura socio-técnica de una promesa de servicio</title>
  <desc id="desc">Mapa axonométrico que conecta canales, personas, tecnología, gobierno y tareas para mostrar cómo se sostiene la promesa de una habitación adecuada.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #292826; }
      .kicker { font-size: 17px; font-weight: 700; letter-spacing: 3px; }
      .title { font-size: 45px; font-weight: 760; letter-spacing: -1.2px; }
      .subtitle { font-size: 20px; fill: #65635e; }
      .section { font-size: 24px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; fill: #5d5b56; }
      .micro { font-size: 13px; fill: #66645f; }
      .route { fill: none; stroke: #67655f; stroke-width: 2.2; stroke-dasharray: 2 8; stroke-linecap: round; stroke-linejoin: round; }
      .route-blue { fill: none; stroke: #7997a4; stroke-width: 2.8; stroke-dasharray: 2 8; stroke-linecap: round; stroke-linejoin: round; }
      .route-sand { fill: none; stroke: #b59b64; stroke-width: 2.8; stroke-dasharray: 2 8; stroke-linecap: round; stroke-linejoin: round; }
      .solid { fill: none; stroke: #4f4e4a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: #77746d; stroke-width: 1.4; }
      .panel { fill: #fbfaf6; stroke: #6a6862; stroke-width: 1.7; }
      .panel-blue { fill: #dce7ea; stroke: #5d6669; stroke-width: 1.7; }
      .panel-sand { fill: #eee5d6; stroke: #68635a; stroke-width: 1.7; }
      .panel-green { fill: #dce7da; stroke: #626a5f; stroke-width: 1.7; }
      .port-blue { fill: #a9c2cc; stroke: #50636a; stroke-width: 1.3; }
      .port-sand { fill: #cbb477; stroke: #6b5f42; stroke-width: 1.3; }
      .port-green { fill: #aec8a8; stroke: #596a54; stroke-width: 1.3; }
      .port-dark { fill: #3b3a37; stroke: #3b3a37; }
    </style>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="7" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
      <feComponentTransfer in="gray" result="fade"><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="multiply" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e5c57"/>
    </marker>
    <symbol id="cube" viewBox="0 0 92 86">
      <path d="M46 2 90 24 46 46 2 24Z" fill="#f9f8f4" stroke="#55534e" stroke-width="2"/>
      <path d="M2 24 46 46 46 84 2 62Z" fill="#eee5d6" stroke="#55534e" stroke-width="2"/>
      <path d="M90 24 46 46 46 84 90 62Z" fill="#dce7ea" stroke="#55534e" stroke-width="2"/>
    </symbol>
    <symbol id="router" viewBox="0 0 62 58">
      <path d="M31 2 60 16 31 31 2 16Z" fill="#fbfaf6" stroke="#55534e" stroke-width="2"/>
      <path d="M2 16 31 31 31 56 2 41Z" fill="#eee5d6" stroke="#55534e" stroke-width="2"/>
      <path d="M60 16 31 31 31 56 60 41Z" fill="#dce7ea" stroke="#55534e" stroke-width="2"/>
    </symbol>
    <symbol id="person-disc" viewBox="0 0 110 90">
      <ellipse cx="55" cy="56" rx="50" ry="27" fill="#eee5d6" stroke="#55534e" stroke-width="2"/>
      <ellipse cx="55" cy="47" rx="32" ry="16" fill="#f8f7f2" stroke="#55534e" stroke-width="2"/>
      <circle cx="55" cy="32" r="11" fill="#dce7ea" stroke="#55534e" stroke-width="2"/>
      <path d="M42 58c4-10 22-10 26 0" fill="none" stroke="#55534e" stroke-width="2"/>
    </symbol>
    <symbol id="doc" viewBox="0 0 60 72">
      <path d="M9 2h29l13 13v55H9Z" fill="#fbfaf6" stroke="#55534e" stroke-width="2"/>
      <path d="M38 2v15h13M17 30h26M17 41h26M17 52h19" fill="none" stroke="#55534e" stroke-width="2"/>
    </symbol>
  </defs>

  <rect width="1800" height="1100" fill="#f7f5ef" filter="url(#paper)"/>
  <rect x="42" y="42" width="1716" height="1016" rx="22" fill="none" stroke="#b9b6ae" stroke-width="1.4"/>

  <text x="86" y="88" class="kicker">N01 · ARQUITECTURA DEL CASO</text>
  <text x="86" y="143" class="title">Hotel Horizonte · una promesa sostenida por todo el sistema</text>
  <text x="86" y="180" class="subtitle">La habitación adecuada no emerge de una pantalla: depende de canales, personas, tecnología, reglas, tareas y capacidad de reparación.</text>
  <line x1="86" y1="210" x2="1714" y2="210" stroke="#8e8b84" stroke-width="1.3"/>

  <!-- Rutas generales: detrás de los objetos -->
  <path class="route-blue" d="M285 435 C390 435 410 450 504 450 L650 450"/>
  <path class="route-blue" d="M285 505 C390 505 410 482 504 482 L650 482"/>
  <path class="route-blue" d="M285 575 C400 575 430 517 520 517 L650 517"/>
  <path class="route-blue" d="M285 645 C390 645 444 553 530 553 L650 553"/>
  <path class="route" d="M562 355 C562 386 590 410 650 438"/>
  <path class="route" d="M562 625 C580 606 610 590 650 566"/>
  <path class="route-blue" d="M1090 422 C1160 370 1254 342 1360 342"/>
  <path class="route-blue" d="M1090 475 C1165 455 1264 448 1360 448"/>
  <path class="route-sand" d="M1090 528 C1175 536 1260 553 1360 562"/>
  <path class="route-sand" d="M1090 580 C1170 624 1255 657 1360 668"/>
  <path class="route" d="M865 674 L865 742"/>
  <path class="route" d="M685 827 C590 827 520 786 448 786"/>
  <path class="route" d="M1045 827 C1130 827 1200 786 1272 786"/>
  <path class="route-sand" d="M1512 710 C1512 785 1422 824 1302 824"/>
  <path class="route-sand" d="M1302 856 C1425 856 1512 892 1512 952 L1178 952" marker-end="url(#arrow)"/>

  <!-- CANALES -->
  <text x="90" y="260" class="section">Canales y promesas</text>
  <text x="90" y="286" class="small">Dónde se vende, confirma y modifica la estadía</text>
  <rect x="82" y="312" width="222" height="376" rx="16" fill="#fbfaf6" stroke="#a8a59d"/>
  <g transform="translate(108 332)">
    <g transform="translate(0 0)"><use href="#cube" width="62" height="58"/><text x="76" y="28" class="label">Booking</text><text x="76" y="50" class="micro">precio · categoría</text></g>
    <g transform="translate(0 70)"><use href="#cube" width="62" height="58"/><text x="76" y="28" class="label">Despegar</text><text x="76" y="50" class="micro">stock · condiciones</text></g>
    <g transform="translate(0 140)"><use href="#cube" width="62" height="58"/><text x="76" y="28" class="label">Expedia</text><text x="76" y="50" class="micro">estado · garantía</text></g>
    <g transform="translate(0 210)"><use href="#cube" width="62" height="58"/><text x="76" y="28" class="label">Sitio directo</text><text x="76" y="50" class="micro">promesa propia</text></g>
    <g transform="translate(0 280)"><use href="#cube" width="62" height="58"/><text x="76" y="28" class="label">Recepción</text><text x="76" y="50" class="micro">venta situada</text></g>
  </g>
  <circle cx="304" cy="435" r="7" class="port-blue"/><circle cx="304" cy="505" r="7" class="port-blue"/><circle cx="304" cy="575" r="7" class="port-blue"/><circle cx="304" cy="645" r="7" class="port-blue"/>

  <!-- PERSONAS -->
  <text x="365" y="260" class="section">Personas</text>
  <text x="365" y="286" class="small">Quién sabe, decide, promete y repara</text>
  <g transform="translate(365 320)"><use href="#person-disc" width="110" height="90"/><text x="55" y="105" text-anchor="middle" class="label">Huésped</text></g>
  <g transform="translate(505 305)"><use href="#person-disc" width="110" height="90"/><text x="55" y="105" text-anchor="middle" class="label">Recepción</text></g>
  <g transform="translate(365 575)"><use href="#person-disc" width="110" height="90"/><text x="55" y="105" text-anchor="middle" class="label">Housekeeping</text></g>
  <g transform="translate(505 575)"><use href="#person-disc" width="110" height="90"/><text x="55" y="105" text-anchor="middle" class="label">Gerencia</text></g>
  <path class="route" d="M422 408 C460 442 518 442 560 405" marker-end="url(#arrow)"/>
  <path class="route" d="M558 405 C600 482 566 555 422 608" marker-end="url(#arrow)"/>
  <path class="route" d="M422 608 C458 578 520 578 558 608" marker-end="url(#arrow)"/>
  <text x="490" y="485" text-anchor="middle" class="small">conversación</text>
  <text x="490" y="507" text-anchor="middle" class="small">excepciones</text>
  <text x="490" y="529" text-anchor="middle" class="small">criterio local</text>

  <!-- NÚCLEO HOTEL -->
  <text x="650" y="260" class="section">Núcleo de la promesa</text>
  <text x="650" y="286" class="small">La unidad mínima que el sistema debe conservar</text>
  <g transform="translate(650 332)">
    <path d="M215 0 430 106 215 212 0 106Z" fill="#f9f8f4" stroke="#4f4e4a" stroke-width="2.5"/>
    <path d="M0 106 215 212 215 332 0 226Z" fill="#eee5d6" stroke="#4f4e4a" stroke-width="2.5"/>
    <path d="M430 106 215 212 215 332 430 226Z" fill="#dce7ea" stroke="#4f4e4a" stroke-width="2.5"/>
    <path d="M102 106 215 50 328 106 215 162Z" fill="#f7f5ef" stroke="#6a6862" stroke-width="2"/>
    <path d="M102 106v54l113 56 113-56v-54" fill="none" stroke="#6a6862" stroke-width="2"/>
    <rect x="55" y="225" width="320" height="42" rx="5" class="panel"/><text x="215" y="252" text-anchor="middle" class="label">Inventario único y categorías equivalentes</text>
    <rect x="55" y="276" width="320" height="42" rx="5" class="panel"/><text x="215" y="303" text-anchor="middle" class="label">Reglas de asignación y gestión de excepciones</text>
    <text x="215" y="92" text-anchor="middle" class="section">PROMESA</text>
    <text x="215" y="118" text-anchor="middle" class="small">habitación adecuada</text>
    <text x="215" y="141" text-anchor="middle" class="small">en tiempo y condiciones acordadas</text>
  </g>
  <circle cx="650" cy="450" r="8" class="port-blue"/><circle cx="650" cy="482" r="8" class="port-blue"/><circle cx="650" cy="517" r="8" class="port-blue"/><circle cx="650" cy="553" r="8" class="port-blue"/>
  <circle cx="1090" cy="422" r="8" class="port-blue"/><circle cx="1090" cy="475" r="8" class="port-blue"/><circle cx="1090" cy="528" r="8" class="port-sand"/><circle cx="1090" cy="580" r="8" class="port-sand"/>

  <!-- TECNOLOGÍA -->
  <text x="1135" y="260" class="section">Tecnología</text>
  <text x="1135" y="286" class="small">Estados compartidos, integraciones y automatización</text>
  <g transform="translate(1138 310)">
    <use href="#router" x="0" y="96" width="62" height="58"/>
    <g transform="translate(76 0)">
      <path d="M105 0 210 52 105 104 0 52Z" fill="#f9f8f4" stroke="#55534e" stroke-width="2"/>
      <path d="M0 52 105 104 105 145 0 93Z" fill="#eee5d6" stroke="#55534e" stroke-width="2"/>
      <path d="M210 52 105 104 105 145 210 93Z" fill="#dce7ea" stroke="#55534e" stroke-width="2"/>
      <path d="M0 91 105 143 210 91M0 112 105 164 210 112M0 133 105 185 210 133" fill="none" stroke="#55534e" stroke-width="2"/>
    </g>
    <text x="305" y="30" class="label">PMS</text><text x="305" y="52" class="micro">reserva · habitación · cuenta</text>
    <text x="305" y="82" class="label">Channel manager</text><text x="305" y="104" class="micro">sincronización de stock</text>
    <text x="305" y="134" class="label">App / pre check-in</text><text x="305" y="156" class="micro">identidad · pago · preferencias</text>
    <text x="305" y="186" class="label">Integración</text><text x="305" y="208" class="micro">eventos · estados · alertas</text>
    <circle cx="288" cy="25" r="6" class="port-blue"/><circle cx="288" cy="77" r="6" class="port-blue"/><circle cx="288" cy="129" r="6" class="port-blue"/><circle cx="288" cy="181" r="6" class="port-blue"/>
  </g>

  <!-- GOBIERNO -->
  <text x="1430" y="260" class="section">Estructura y gobierno</text>
  <text x="1430" y="286" class="small">Qué regla prevalece y quién puede corregirla</text>
  <g transform="translate(1360 315)">
    <g><path d="M22 0h240l25 17v69H47L22 69Z" class="panel-sand"/><text x="52" y="30" class="label">Política de sobreventa</text><text x="52" y="55" class="micro">margen, temporada, autoridad</text></g>
    <g transform="translate(0 106)"><path d="M22 0h240l25 17v69H47L22 69Z" class="panel"/><text x="52" y="30" class="label">Definición de categorías</text><text x="52" y="55" class="micro">canal, PMS, habitación real</text></g>
    <g transform="translate(0 212)"><path d="M22 0h240l25 17v69H47L22 69Z" class="panel-green"/><text x="52" y="30" class="label">Prioridad operativa</text><text x="52" y="55" class="micro">limpieza, mantenimiento, llegada</text></g>
    <g transform="translate(0 318)"><path d="M22 0h240l25 17v69H47L22 69Z" class="panel-blue"/><text x="52" y="30" class="label">Escalamiento y reparación</text><text x="52" y="55" class="micro">quién detecta, decide e informa</text></g>
  </g>
  <circle cx="1360" cy="342" r="7" class="port-sand"/><circle cx="1360" cy="448" r="7" class="port-blue"/><circle cx="1360" cy="562" r="7" class="port-green"/><circle cx="1360" cy="668" r="7" class="port-blue"/>

  <!-- FLUJO DE TAREAS -->
  <line x1="86" y1="728" x2="1714" y2="728" stroke="#aaa79f" stroke-width="1.2"/>
  <text x="86" y="775" class="section">Flujo observable de la estadía</text>
  <text x="86" y="802" class="small">Los estados deben poder reconstruirse sin convertir el trabajo manual en una caja negra</text>
  <g transform="translate(84 832)">
    <g transform="translate(0 0)"><use href="#cube" width="82" height="76"/><text x="41" y="103" text-anchor="middle" class="label">Reserva</text><text x="41" y="124" text-anchor="middle" class="micro">creada</text></g>
    <path class="solid" d="M90 39h66" marker-end="url(#arrow)"/>
    <g transform="translate(170 0)"><use href="#cube" width="82" height="76"/><text x="41" y="103" text-anchor="middle" class="label">Confirmación</text><text x="41" y="124" text-anchor="middle" class="micro">garantizada</text></g>
    <path class="solid" d="M260 39h66" marker-end="url(#arrow)"/>
    <g transform="translate(340 0)"><use href="#cube" width="82" height="76"/><text x="41" y="103" text-anchor="middle" class="label">Preparación</text><text x="41" y="124" text-anchor="middle" class="micro">habitación</text></g>
    <path class="solid" d="M430 39h66" marker-end="url(#arrow)"/>
    <g transform="translate(510 0)"><use href="#cube" width="82" height="76"/><text x="41" y="103" text-anchor="middle" class="label">Llegada</text><text x="41" y="124" text-anchor="middle" class="micro">huésped</text></g>
    <path class="solid" d="M600 39h66" marker-end="url(#arrow)"/>
    <g transform="translate(680 0)"><use href="#cube" width="82" height="76"/><text x="41" y="103" text-anchor="middle" class="label">Check-in</text><text x="41" y="124" text-anchor="middle" class="micro">validado</text></g>
    <path class="solid" d="M770 39h66" marker-end="url(#arrow)"/>
    <g transform="translate(850 0)"><use href="#cube" width="82" height="76"/><text x="41" y="103" text-anchor="middle" class="label">Habitación</text><text x="41" y="124" text-anchor="middle" class="micro">adecuada</text></g>
  </g>

  <!-- Excepción y resultados -->
  <g transform="translate(1115 770)">
    <rect width="250" height="150" rx="12" fill="#292826"/>
    <text x="24" y="34" class="kicker" fill="#fff" style="fill:#fff">EXCEPCIÓN</text>
    <text x="24" y="70" class="label" style="fill:#fff">Inventario contradictorio</text>
    <text x="24" y="96" class="small" style="fill:#ddd">reubicación · espera · llamada</text>
    <text x="24" y="121" class="small" style="fill:#ddd">trabajo manual · compensación</text>
    <circle cx="225" cy="32" r="8" fill="#cbb477"/>
  </g>
  <g transform="translate(1405 770)">
    <rect width="305" height="150" rx="12" class="panel-green"/>
    <text x="24" y="34" class="kicker">RESULTADO</text>
    <text x="24" y="70" class="label">Promesa conservada</text>
    <text x="24" y="96" class="small">huésped informado · equipo coordinado</text>
    <text x="24" y="121" class="small">evidencia para revisar la regla</text>
    <circle cx="280" cy="32" r="8" class="port-green"/>
  </g>

  <!-- Leyenda y tesis -->
  <line x1="86" y1="1000" x2="1714" y2="1000" stroke="#8e8b84" stroke-width="1.2"/>
  <g transform="translate(88 1028)">
    <circle cx="8" cy="0" r="7" class="port-blue"/><text x="24" y="6" class="micro">dato o estado</text>
    <circle cx="165" cy="0" r="7" class="port-sand"/><text x="181" y="6" class="micro">regla o decisión</text>
    <circle cx="339" cy="0" r="7" class="port-green"/><text x="355" y="6" class="micro">resultado de servicio</text>
    <circle cx="553" cy="0" r="7" class="port-dark"/><text x="569" y="6" class="micro">excepción o alerta</text>
  </g>
  <text x="1712" y="1034" text-anchor="end" class="label">La interfaz es una parte de la promesa, no el sistema completo.</text>
</svg>
