<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Comparar soluciones completas</title><desc id="desc">No comparar sólo precio o tecnología: todas deben pasar la misma prueba. Exportar reglas y eventos y reconstruirlos en otra solución. Medir pérdida de significado, tiempo y costo antes de aceptar la dependencia.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Comparar soluciones completas">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N19">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N19 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Comparar soluciones completas</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No comparar sólo precio o tecnología: todas deben pasar la misma prueba.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Opciones de realización" data-row-bottom="620.0">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Opciones de</text>
<text x="78" y="391.9" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">realización</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Configurar · integrar · construir ·</text>
<text x="530" y="384.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">contratar.</text>
<text x="530" y="430.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">También considerar una respuesta</text>
<text x="530" y="470.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">manual o no automatizar.</text>
</g>
<g id="item-1" aria-label="Una misma capacidad" data-row-bottom="946.0">
<path d="M52 628.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="672.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Una misma capacidad</text>
<text x="530" y="670.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Confirmar ingreso accesible con</text>
<text x="530" y="710.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">estados compatibles.</text>
<text x="530" y="756.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Una persona debe poder corregir y</text>
<text x="530" y="796.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Recepción debe poder detener.</text>
</g>
<g id="item-2" aria-label="Una misma prueba adversa" data-row-bottom="1272.0">
<path d="M52 954.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="998.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Una misma prueba</text>
<text x="78" y="1043.9" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">adversa</text>
<text x="530" y="996.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Qué ocurre cuando falla, cómo se</text>
<text x="530" y="1036.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">repara y cómo se sale.</text>
<text x="530" y="1082.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">La alternativa más atractiva puede</text>
<text x="530" y="1122.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">ocultar una dependencia costosa.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 465.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 791.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 1117.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Probar la salida">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Probar la salida</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Exportar reglas y eventos y reconstruirlos en otra solución. Medir</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">pérdida de significado, tiempo y costo antes de aceptar la dependencia.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>