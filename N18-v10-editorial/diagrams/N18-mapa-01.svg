<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">N18, no se conserva la pieza, se conserva la capacidad que protege</title>
  <desc id="desc">Una práctica heredada de Hotel Horizonte, llamar antes de reasignar una habitación accesible, se abre como expediente. La puerta distingue compromiso verificado, fuente normativa pendiente, implementación contingente, dependencia concentrada y registros históricos. Las salidas son conservar la protección, validar la obligación, reemplazar la llamada, distribuir autoridad y preservar originales con correspondencias. Una cadena final conecta fuente, interpretación, decisión de diseño, prueba de operación y condición de retiro.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#747672"/></marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}
      .eyebrow{font-size:25px;font-weight:700;letter-spacing:7px}.title{font-size:54px;letter-spacing:-1.2px}.subtitle{font-size:26px;fill:#5F615E}
      .section{font-size:22px;font-weight:700;letter-spacing:4px}.label{font-size:23px;font-weight:700}.body{font-size:20px;fill:#4F514E}.small{font-size:18px;fill:#666864}.number{font-size:18px;font-weight:700;letter-spacing:3px}
      .rule{stroke:#A9ABA7;stroke-width:2}.route{fill:none;stroke:#747672;stroke-width:3;marker-end:url(#arrow)}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#F7F7F4"/><rect x="36" y="36" width="1728" height="1028" rx="20" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M72 74 H210 L196 94 H58 Z" fill="#CFFF00"/><text x="238" y="94" class="sans eyebrow">N18 · EXPEDIENTE DE LEGADO</text>
  <text x="72" y="168" class="serif title">No se conserva la pieza: se conserva la capacidad</text><text x="74" y="212" class="sans subtitle">La antigüedad no decide. Deciden la protección, la evidencia, el impacto y la autoridad.</text><path d="M72 246 H1728" class="rule"/>

  <text x="84" y="300" class="sans section">PRÁCTICA HEREDADA</text><text x="596" y="300" class="sans section">QUÉ CONTIENE</text><text x="1210" y="300" class="sans section">DECISIÓN DE TRANSICIÓN</text>
  <g aria-label="Práctica heredada">
    <path d="M84 338 H492 L524 370 V758 H84 Z" class="outline"/><path d="M84 338 H280 L264 360 H68 Z" fill="#CFFF00"/><text x="118" y="398" class="sans number">HH-18 · REASIGNACIÓN</text>
    <text x="118" y="458" class="serif" style="font-size:33px">Llamar antes de cambiar</text><text x="118" y="500" class="serif" style="font-size:33px">una habitación accesible</text>
    <line x1="118" y1="538" x2="484" y2="538" class="rule"/><text x="118" y="580" class="sans body">La llamada es contingente.</text><text x="118" y="614" class="sans body">La protección puede no serlo.</text>
    <text x="118" y="676" class="sans number">EPISODIOS · REGLA · PERMISOS</text><text x="118" y="710" class="sans small">reclamo, registros y operación</text><circle cx="524" cy="548" r="10" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
  </g>
  <path d="M544 548 H588" class="route"/>

  <g aria-label="Clasificación del legado">
    <g><rect x="604" y="338" width="504" height="76" class="outline"/><text x="634" y="371" class="sans number">01 · COMPROMISO VERIFICADO</text><text x="634" y="399" class="sans small">no reasignar una accesible ya prometida</text></g>
    <g><rect x="604" y="428" width="504" height="76" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="634" y="461" class="sans number">02 · FUENTE NORMATIVA PENDIENTE</text><text x="634" y="489" class="sans small">requiere validación competente</text></g>
    <g><rect x="604" y="518" width="504" height="76" class="outline"/><text x="634" y="551" class="sans number">03 · IMPLEMENTACIÓN CONTINGENTE</text><text x="634" y="579" class="sans small">la llamada puede reemplazarse</text></g>
    <g><rect x="604" y="608" width="504" height="76" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="634" y="641" class="sans number">04 · DEPENDENCIA CONCENTRADA</text><text x="634" y="669" class="sans small">una supervisora sostiene el control</text></g>
    <g><rect x="604" y="698" width="504" height="76" class="outline"/><text x="634" y="731" class="sans number">05 · REGISTROS HISTÓRICOS</text><text x="634" y="759" class="sans small">versiones sin traducción segura</text></g>
  </g>
  <path d="M1124 556 H1198" class="route"/>

  <g aria-label="Decisiones de transición">
    <path d="M1214 338 H1706 L1730 362 V774 H1214 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/>
    <text x="1246" y="388" class="sans number">SALIDAS DIFERENCIADAS</text>
    <g><circle cx="1250" cy="438" r="9" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="1278" y="445" class="sans label">Conservar la protección</text></g>
    <g><circle cx="1250" cy="500" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1278" y="507" class="sans label">Validar la obligación</text></g>
    <g><circle cx="1250" cy="562" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1278" y="569" class="sans label">Reemplazar la llamada</text></g>
    <g><circle cx="1250" cy="624" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1278" y="631" class="sans label">Distribuir autoridad</text></g>
    <g><circle cx="1250" cy="686" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1278" y="693" class="sans label">Preservar originales</text></g>
    <line x1="1246" y1="720" x2="1698" y2="720" class="rule"/><text x="1246" y="754" class="sans small">piloto acotado · circuito manual · interrupción</text>
  </g>

  <path d="M72 834 H1728" class="rule"/><text x="84" y="882" class="sans section">CADENA DE TRAZABILIDAD PARA CAMBIAR O RETIRAR</text>
  <g aria-label="Cadena de trazabilidad">
    <rect x="84" y="918" width="264" height="76" class="outline"/><text x="216" y="950" class="sans number" text-anchor="middle">FUENTE</text><text x="216" y="978" class="sans small" text-anchor="middle">vigencia y ámbito</text>
    <path d="M348 956 H390" class="route"/><rect x="402" y="918" width="264" height="76" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="534" y="950" class="sans number" text-anchor="middle">INTERPRETACIÓN</text><text x="534" y="978" class="sans small" text-anchor="middle">autoridad competente</text>
    <path d="M666 956 H708" class="route"/><rect x="720" y="918" width="264" height="76" class="outline"/><text x="852" y="950" class="sans number" text-anchor="middle">DISEÑO</text><text x="852" y="978" class="sans small" text-anchor="middle">mecanismo y responsable</text>
    <path d="M984 956 H1026" class="route"/><rect x="1038" y="918" width="264" height="76" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="1170" y="950" class="sans number" text-anchor="middle">PRUEBA</text><text x="1170" y="978" class="sans small" text-anchor="middle">operación y reparación</text>
    <path d="M1302 956 H1344" class="route"/><rect x="1356" y="918" width="368" height="76" class="outline"/><text x="1540" y="950" class="sans number" text-anchor="middle">CONDICIÓN DE RETIRO</text><text x="1540" y="978" class="sans small" text-anchor="middle">memoria suficiente y salida segura</text>
  </g>
  <text x="84" y="1036" class="sans small">MODERNIZAR ES SEPARAR LA FUNCIÓN QUE DEBE CONTINUAR DE LA FORMA HISTÓRICA QUE PUEDE CAMBIAR.</text><text x="1710" y="1036" class="sans small" text-anchor="end">N18 · METSI</text>
</svg>
