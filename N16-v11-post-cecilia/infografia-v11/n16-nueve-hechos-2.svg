  <g id="heading">
    <text x="78" y="187" fill="#20221f" font-family="Didot,Georgia,serif" font-size="77">La firma no basta</text>
    <text x="78" y="261" fill="#20221f" font-family="Didot,Georgia,serif" font-size="77">para cerrar.</text>
    <text x="80" y="317" fill="#5d605a" font-family="Baskerville,Georgia,serif" font-size="30">Una comunicación válida exige destino y entrega comprobada.</text>
