<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Lo que vas aprendiendo a hacer: N00, Comprender e Investigar</title>
  <desc id="map-desc">Un recorrido de izquierda a derecha. N00 prepara la experiencia. N01 a N04 ayudan a comprender el sistema; N05 a N10 ayudan a investigar hasta definir un problema y una señal de mejora. La línea no representa una receta rígida.</desc>
  <style>
    .paper{fill:#f1f0ea}.panel{fill:#e5e5de}.ink{fill:#171817}.muted{fill:#62655f}.volt{fill:#cfff00}
    .line{stroke:#b9bcb4;stroke-width:2;fill:none}.main{stroke:#171817;stroke-width:3;fill:none}
    .serif{font-family:Georgia,'Times New Roman',serif;font-weight:400}.sans{font-family:Arial,Helvetica,sans-serif}
    .caps{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:4px}
  </style>
  <g id="canvas"><rect class="paper" width="1600" height="650"/><path class="line" d="M 38 38 H 1562 V 612 H 38 Z"/></g>
  <g id="heading">
    <path d="M 76 79 H 158 L 151 89 H 69 Z" class="volt"/>
    <text x="184" y="89" class="caps ink" font-size="18">METSI · N00 · MAPA DE APRENDIZAJE</text>
    <text x="70" y="172" class="serif ink" font-size="70">Antes de elegir una solución.</text>
    <text x="74" y="214" class="serif muted" font-size="29">Preparar, comprender e investigar: la primera etapa.</text>
    <path class="line" d="M 74 246 H 1528"/>
  </g>
  <g id="groups">
    <text x="70" y="300" class="caps muted" font-size="18">GUÍA</text>
    <text x="334" y="295" class="serif ink" font-size="46">A</text>
    <text x="382" y="293" class="caps ink" font-size="24">COMPRENDER</text>
    <text x="383" y="324" class="sans muted" font-size="20">N01–N04 · Mirar el sistema antes de resolver</text>
    <text x="862" y="295" class="serif ink" font-size="46">B</text>
    <text x="912" y="293" class="caps ink" font-size="24">INVESTIGAR</text>
    <text x="913" y="324" class="sans muted" font-size="20">N05–N10 · Construir un problema investigable</text>
    <path class="line" d="M 791 270 V 508"/>
  </g>
  <g id="connectors">
    <path class="main" d="M 120 385 H 1484"/>
    <path d="M 1474 376 L 1493 385 L 1474 394" stroke="#171817" stroke-width="3" fill="none"/>
  </g>
  <g id="n00">
    <circle cx="120" cy="385" r="52" fill="#cfff00" stroke="#171817" stroke-width="2"/>
    <text x="120" y="397" text-anchor="middle" class="serif ink" font-size="39">00</text>
    <text x="120" y="463" text-anchor="middle" class="caps ink" font-size="18">PREPARAR</text>
    <text x="120" y="491" text-anchor="middle" class="sans muted" font-size="18">la experiencia</text>
  </g>
  <g id="n01"><circle cx="347" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="347" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">01</text><text x="347" y="458" text-anchor="middle" class="sans ink" font-size="18">Primer paso</text></g>
  <g id="n02"><circle cx="464" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="464" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">02</text><text x="464" y="458" text-anchor="middle" class="sans ink" font-size="18">Sistema</text></g>
  <g id="n03"><circle cx="581" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="581" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">03</text><text x="581" y="458" text-anchor="middle" class="sans ink" font-size="18">Efectos</text></g>
  <g id="n04"><circle cx="698" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="698" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">04</text><text x="698" y="458" text-anchor="middle" class="sans ink" font-size="18">Pruebas</text></g>
  <g id="n05"><circle cx="859" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="859" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">05</text><text x="859" y="458" text-anchor="middle" class="sans ink" font-size="18">Voces</text></g>
  <g id="n06"><circle cx="980" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="980" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">06</text><text x="980" y="458" text-anchor="middle" class="sans ink" font-size="18">Averiguar</text></g>
  <g id="n07"><circle cx="1101" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="1101" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">07</text><text x="1101" y="458" text-anchor="middle" class="sans ink" font-size="18">Entrevistar</text></g>
  <g id="n08"><circle cx="1222" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="1222" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">08</text><text x="1222" y="458" text-anchor="middle" class="sans ink" font-size="18">Observar</text></g>
  <g id="n09"><circle cx="1343" cy="385" r="28" fill="#f1f0ea" stroke="#171817" stroke-width="2"/><text x="1343" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">09</text><text x="1343" y="458" text-anchor="middle" class="sans ink" font-size="18">Usar</text></g>
  <g id="n10"><circle cx="1464" cy="385" r="28" fill="#cfff00" stroke="#171817" stroke-width="2"/><text x="1464" y="392" text-anchor="middle" class="sans ink" font-size="21" font-weight="700">10</text><text x="1464" y="458" text-anchor="middle" class="sans ink" font-size="18">Definir</text></g>
  <g id="outcome">
    <path class="line" d="M 74 519 H 1528"/>
    <text x="74" y="565" class="caps muted" font-size="17">AL COMENZAR</text>
    <text x="74" y="594" class="serif ink" font-size="28">Un pedido que ya parece una solución</text>
    <text x="877" y="565" class="caps muted" font-size="17">DESPUÉS DE N10</text>
    <text x="877" y="594" class="serif ink" font-size="28">Un problema que podemos investigar</text>
  </g>
</svg>
