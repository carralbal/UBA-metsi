<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Arquitectura de estrategia</title><desc id="d">Arquitectura de estrategia sitúa comprender, elegir, preparar, ampliar, transferir alrededor de una relación común y vuelve visibles sus dependencias.</desc><style>.l{font:400 28px Didot,Georgia,serif;fill:#171917}.n{font:700 18px Avenir,Arial,sans-serif;letter-spacing:2px;fill:#535753}.center{text-anchor:middle}.edge{fill:none;stroke:#232523;stroke-width:3;marker-end:url(#a)}.faint{opacity:.55}.hub{font:400 28px Didot,Georgia,serif;fill:#F8F7F3}.hub-small{font:700 16px Avenir,Arial,sans-serif;letter-spacing:3px;fill:#CFFF00}</style><rect width="1600" height="900" fill="#F8F7F3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#232523"/></marker></defs><path d="M60 96H1540" stroke="#232523" stroke-width="3"/><path d="M60 57h170l-22 25H38z" fill="#CFFF00"/><text x="60" y="165" font-family="Didot,Georgia,serif" font-size="54">Arquitectura de estrategia</text><path d="M800 500 L310 310" class="edge faint"/><rect x="155" y="252" width="310" height="116" rx="58" fill="#F8F7F3" stroke="#232523" stroke-width="2"/><text x="310" y="292" class="n center">01</text><text class="l center"><tspan x="310.0" y="336.0">Comprender</tspan></text><path d="M800 500 L1290 310" class="edge faint"/><rect x="1135" y="252" width="310" height="116" rx="58" fill="#E3E6E4" stroke="#232523" stroke-width="2"/><text x="1290" y="292" class="n center">02</text><text class="l center"><tspan x="1290.0" y="336.0">Elegir</tspan></text><path d="M800 500 L1370 650" class="edge faint"/><rect x="1215" y="592" width="310" height="116" rx="58" fill="#F8F7F3" stroke="#232523" stroke-width="2"/><text x="1370" y="632" class="n center">03</text><text class="l center"><tspan x="1370.0" y="676.0">Preparar</tspan></text><path d="M800 500 L800 735" class="edge faint"/><rect x="645" y="677" width="310" height="116" rx="58" fill="#E3E6E4" stroke="#232523" stroke-width="2"/><text x="800" y="717" class="n center">04</text><text class="l center"><tspan x="800.0" y="761.0">Ampliar</tspan></text><path d="M800 500 L230 650" class="edge faint"/><rect x="75" y="592" width="310" height="116" rx="58" fill="#F8F7F3" stroke="#232523" stroke-width="2"/><text x="230" y="632" class="n center">05</text><text class="l center"><tspan x="230.0" y="676.0">Transferir</tspan></text><circle cx="800" cy="500" r="122" fill="#171917"/><path d="M724 500h152" stroke="#CFFF00" stroke-width="8"/><text x="800" y="465" class="hub center">SISTEMA</text><text x="800" y="545" class="hub-small center">RELACIONES</text><path d="M60 832H1540" stroke="#8F948F" stroke-width="2"/><text x="60" y="873" font-family="Avenir,Arial,sans-serif" font-size="20" fill="#555">METSI · N20 · HUB · MAPA 01</text></svg>