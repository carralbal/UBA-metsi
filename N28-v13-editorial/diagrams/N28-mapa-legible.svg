<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">El promedio puede esconder el problema</title><desc id="desc">Un buen resultado general no autoriza todas las situaciones de uso. Contrato, eventos, cerradura y observación física se complementan. Ninguno reemplaza a los demás. Elena asume el riesgo residual explícito.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="El promedio puede esconder el problema">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N28">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N28 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">El promedio puede esconder el problema</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Un buen resultado general no autoriza todas las situaciones de uso.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Llegada ordinaria" data-row-bottom="620.0">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Llegada ordinaria</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">194 de 200 ingresos demoran menos de</text>
<text x="530" y="384.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">diez minutos: 97%.</text>
<text x="530" y="430.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Permite evaluar ese canal y esa</text>
<text x="530" y="470.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">carga, no cualquier población.</text>
</g>
<g id="item-1" aria-label="Llegada accesible" data-row-bottom="946.0">
<path d="M52 628.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="672.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Llegada accesible</text>
<text x="530" y="670.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Verificar cada condición prometida</text>
<text x="530" y="710.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">antes de ofrecer.</text>
<text x="530" y="756.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Si falta una condición crítica,</text>
<text x="530" y="796.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">detener y dar una alternativa.</text>
</g>
<g id="item-2" aria-label="Falla de identidad" data-row-bottom="1272.0">
<path d="M52 954.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="998.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Falla de identidad</text>
<text x="530" y="996.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Respuesta limitada y autorizada.</text>
<text x="530" y="1042.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Llave restringida, doble registro y</text>
<text x="530" y="1082.2399999999998" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">conciliación sin duplicados.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 465.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 791.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 1117.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Evidencia y autorización">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Evidencia y autorización</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Contrato, eventos, cerradura y observación física se complementan.</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Ninguno reemplaza a los demás. Elena asume el riesgo residual explícito.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>