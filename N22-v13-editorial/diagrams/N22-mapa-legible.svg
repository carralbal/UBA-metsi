<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Una prueba debe poder decirnos que no</title><desc id="desc">Aprender requiere admitir un resultado que debilite la idea inicial. Mantener el ingreso directo asistido sin expandir. Elena decide la ampliación; Recepción puede revertir. El alcance sigue a la evidencia.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Una prueba debe poder decirnos que no">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N22">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N22 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Una prueba debe poder decirnos que no</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Aprender requiere admitir un resultado que debilite la idea inicial.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Hipótesis principal" data-row-bottom="538.5">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Hipótesis principal</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Verificar tres estados antes de prometer</text>
<text x="530" y="379.4" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">el ingreso.</text>
<text x="530" y="420.8" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Se espera reducir las reasignaciones.</text>
</g>
<g id="item-1" aria-label="Explicación rival" data-row-bottom="783.0">
<path d="M52 546.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="590.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Explicación rival</text>
<text x="530" y="588.5" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Quizá la mejora provenga de un mensaje</text>
<text x="530" y="623.9" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">más claro.</text>
<text x="530" y="665.3" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">El cambio de estados podría no ser la</text>
<text x="530" y="700.6999999999999" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">causa.</text>
</g>
<g id="item-2" aria-label="Comparación" data-row-bottom="1027.5">
<path d="M52 791.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="835.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Comparación</text>
<text x="530" y="833.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Misma base y resultados separados por</text>
<text x="530" y="868.4" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">turno, canal y habitación.</text>
<text x="530" y="909.8" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">No mezclar poblaciones con condiciones</text>
<text x="530" y="945.1999999999999" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">diferentes.</text>
</g>
<g id="item-3" aria-label="Protección" data-row-bottom="1272.0">
<path d="M52 1035.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1079.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Protección</text>
<text x="530" y="1077.5" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Una reasignación accesible crítica puede</text>
<text x="530" y="1112.9" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">detener la prueba.</text>
<text x="530" y="1154.3" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Una mejora promedio no compensa ese</text>
<text x="530" y="1189.7" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">daño.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 424.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 668.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 913.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 1157.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Decisión del caso">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Decisión del caso</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Mantener el ingreso directo asistido sin expandir. Elena decide la</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">ampliación; Recepción puede revertir. El alcance sigue a la evidencia.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>