<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Cuatro minutos no cuentan toda la espera</title><desc id="desc">El mostrador ve una parte. La familia vive el recorrido completo. Cuatro minutos en el mostrador pueden formar parte de una llegada que demora 27 minutos. Mejorar una tarea no asegura mejorar el conjunto.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Cuatro minutos no cuentan toda la espera">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N14">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N14 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Cuatro minutos no cuentan toda la espera</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El mostrador ve una parte. La familia vive el recorrido completo.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Llegada" data-row-bottom="538.5">
<circle cx="82" cy="344.0" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="354.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="345.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Llegada</text>
<text x="145" y="389.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El reloj empieza cuando comienza la necesidad de ingreso.</text>
<text x="145" y="434.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No cuando un sector decide iniciar su medición.</text>
</g>
<path id="e-item-0-item-1" d="M82 374.0 V553.5" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Esperas y traspasos" data-row-bottom="783.0">
<circle cx="82" cy="588.5" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="598.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="589.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Esperas y traspasos</text>
<text x="145" y="633.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Inspección, identidad, cerradura y autorizaciones.</text>
<text x="145" y="679.3" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Hacer visible quién recibe el caso y quién debe responder.</text>
</g>
<path id="e-item-1-item-2" d="M82 618.5 V798.0" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Asignación y acceso" data-row-bottom="1027.5">
<circle cx="82" cy="833.0" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="843.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="834.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Asignación y acceso</text>
<text x="145" y="878.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Confirmar una habitación y habilitar la llave.</text>
<text x="145" y="923.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Seguir la misma llegada a través de todas las áreas.</text>
</g>
<path id="e-item-2-item-3" d="M82 863.0 V1042.5" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Excepción o reparación" data-row-bottom="1272.0">
<circle cx="82" cy="1077.5" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1087.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="1078.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Excepción o reparación</text>
<text x="145" y="1122.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una identidad discutida necesita autoridad y una respuesta.</text>
<text x="145" y="1168.3" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El recorrido termina con ingreso efectivo o reparación.</text>
</g>
<g id="decision" aria-label="Dos mediciones distintas">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Dos mediciones distintas</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cuatro minutos en el mostrador pueden formar parte de una llegada que</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">demora 27 minutos. Mejorar una tarea no asegura mejorar el conjunto.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>