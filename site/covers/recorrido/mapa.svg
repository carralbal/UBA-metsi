<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2210" role="img" aria-labelledby="journey-title journey-desc">
<title id="journey-title">METSI: recorrido vertical de N00 a N36</title>
<desc id="journey-desc">La guía N00 prepara un recorrido de ocho estaciones. A y B permiten comprender e investigar; C modela; D decide; E construye; F opera; G gobierna inteligencia artificial; H integra y devuelve el aprendizaje a una nueva pregunta.</desc>
<style>
  .paper{fill:#f1f0ea}.ink{fill:#171817}.volt{fill:#cfff00}.muted{fill:#62655f}
  .serif{font-family:Georgia,'Times New Roman',serif}.sans,.caps,.small{font-family:Arial,Helvetica,sans-serif}
  .caps{font-size:18px;font-weight:700;letter-spacing:2px}.big{font-size:66px;fill:#171817}.name{font-size:47px;fill:#171817}.change{font-size:24px;fill:#62655f}.small{font-size:18px;fill:#171817}
  .divider{stroke:#b9bcb4;stroke-width:2;fill:none}.rail{stroke:#171817;stroke-width:3;fill:none}.rail-branch{stroke:#171817;stroke-width:2;fill:none}
  .diagram text{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#171817}.diagram .muted{fill:#62655f;font-weight:400}
  .diagram .line{stroke:#171817;stroke-width:1.5;fill:none}.diagram .soft{stroke:#b9bcb4;stroke-width:1.5;fill:none}.diagram .dash{stroke:#171817;stroke-width:1.5;stroke-dasharray:3 5;fill:none}
  .diagram .volt{fill:#cfff00}.diagram .paper{fill:#f1f0ea}.diagram .shade{fill:#e5e5de}
</style>
<rect class="paper" width="1100" height="2210"/>
<path d="M 45 50 H 111 L 105 60 H 39 Z" class="volt"/>
<text x="136" y="60" class="caps ink">METSI · MAPA DE APRENDIZAJE</text>
<text x="45" y="135" class="serif ink" font-size="69">Un viaje de <tspan class="sans" font-size="61" font-weight="700">N00</tspan> a <tspan class="sans" font-size="61" font-weight="700">N36</tspan>.</text>
<text x="48" y="174" class="serif muted" font-size="27">Entender · representar · cambiar · sostener · aprender.</text>
<rect x="45" y="208" width="1010" height="93" class="ink"/>
<text x="73" y="268" class="sans paper" font-size="45" font-weight="700">N00</text>
<text x="238" y="251" class="serif" fill="#f1f0ea" font-size="31">Preparar el viaje.</text>
<text x="239" y="279" class="sans" fill="#d0d1cb" font-size="18">Cómo aprenderemos y qué hotel acompañará el recorrido.</text>
<path class="rail" d="M 89 301 V 2126"/>
<g id="station-a">
    <path class="divider" d="M 144 317 H 1053"/>
    <path class="rail-branch" d="M 89 378 H 143"/>
    <text x="151" y="401" class="serif big">A</text>
    <text x="224" y="344" class="caps ink">N01–N04 · ESTACIÓN A</text>
    <text x="224" y="397" class="serif name">Comprender</text>
    <text x="224" y="435" class="serif change">Del pedido a una pregunta sobre el</text>
    <text x="224" y="466" class="serif change">sistema.</text>
    <text x="224" y="508" class="small">N01   ·   N02   ·   N03   ·   N04</text>
    <g class="diagram" transform="translate(748 362)"><path class="line" d="M20 64H70M70 64L107 25M70 64H107M70 64L107 103M211 25L247 64M211 64H247M211 103L247 64M247 64H282"/><rect class="shade" x="6" y="48" width="55" height="31"/><text x="11" y="68">PEDIDO</text><text x="112" y="30">personas</text><text x="112" y="69">tareas</text><text x="112" y="108">herramientas</text><rect class="volt" x="250" y="47" width="41" height="35"/><text x="255" y="68">¿?</text></g>
  </g>
<g id="station-b">
    <path class="divider" d="M 144 543 H 1053"/>
    <path class="rail-branch" d="M 89 604 H 143"/>
    <text x="151" y="627" class="serif big">B</text>
    <text x="224" y="570" class="caps ink">N05–N10 · ESTACIÓN B</text>
    <text x="224" y="623" class="serif name">Investigar</text>
    <text x="224" y="661" class="serif change">De voces dispersas a un problema</text>
    <text x="224" y="692" class="serif change">investigable.</text>
    <text x="224" y="734" class="small">N05   ·   N06   ·   N07   ·   N08   ·   N09   ·   N10</text>
    <g class="diagram" transform="translate(748 588)"><text x="9" y="28">voces</text><text x="9" y="66">trabajo</text><text x="9" y="104">uso</text><path class="dash" d="M85 24L156 65M85 63H156M85 101L156 65"/><path class="line" d="M156 40L205 56V74L156 89Z"/><path class="line" d="M205 65H220"/><rect class="volt" x="220" y="46" width="79" height="38"/><text x="225" y="69">problema</text></g>
  </g>
<g id="station-c">
    <path class="divider" d="M 144 769 H 1053"/>
    <path class="rail-branch" d="M 89 830 H 143"/>
    <text x="151" y="853" class="serif big">C</text>
    <text x="224" y="796" class="caps ink">N11–N16 · ESTACIÓN C</text>
    <text x="224" y="849" class="serif name">Modelar</text>
    <text x="224" y="887" class="serif change">De relatos y datos a modelos que se</text>
    <text x="224" y="918" class="serif change">pueden discutir.</text>
    <text x="224" y="960" class="small">N11   ·   N12   ·   N13   ·   N14   ·   N15   ·   N16</text>
    <g class="diagram" transform="translate(748 814)"><path class="line" d="M15 54H285"/><path class="line" d="M115 46L126 54L115 62M209 46L220 54L209 62"/><text x="12" y="37">solicitud</text><text x="116" y="37">hecho</text><text x="222" y="37">estado</text><rect class="volt" x="16" y="50" width="11" height="11"/><rect class="shade" x="121" y="49" width="11" height="11"/><rect class="shade" x="224" y="49" width="11" height="11"/><path class="dash" d="M233 68V101H117V75"/><text class="muted" x="153" y="119">excepción · revisar</text></g>
  </g>
<g id="station-d">
    <path class="divider" d="M 144 995 H 1053"/>
    <path class="rail-branch" d="M 89 1056 H 143"/>
    <text x="151" y="1079" class="serif big">D</text>
    <text x="224" y="1022" class="caps ink">N17–N20 · ESTACIÓN D</text>
    <text x="224" y="1075" class="serif name">Decidir</text>
    <text x="224" y="1113" class="serif change">De opciones posibles a una secuencia de</text>
    <text x="224" y="1144" class="serif change">cambio.</text>
    <text x="224" y="1186" class="small">N17   ·   N18   ·   N19   ·   N20</text>
    <g class="diagram" transform="translate(748 1040)"><text x="6" y="68">opciones</text><path class="line" d="M72 64H105M105 64L151 18M105 64L151 41M105 64H151M105 64L151 87M105 64L151 110"/><text x="160" y="21">comprar</text><text x="160" y="44">adaptar</text><text x="160" y="67">conectar</text><text x="160" y="90">construir</text><text x="160" y="113">manual</text><path class="line" d="M264 15V116"/><rect class="volt" x="256" y="54" width="18" height="18"/><text x="246" y="12">decidir</text></g>
  </g>
<g id="station-e">
    <path class="divider" d="M 144 1221 H 1053"/>
    <path class="rail-branch" d="M 89 1282 H 143"/>
    <text x="151" y="1305" class="serif big">E</text>
    <text x="224" y="1248" class="caps ink">N21–N25 · ESTACIÓN E</text>
    <text x="224" y="1301" class="serif name">Construir</text>
    <text x="224" y="1339" class="serif change">De tareas abiertas a una capacidad útil</text>
    <text x="224" y="1370" class="serif change">y terminada.</text>
    <text x="224" y="1412" class="small">N21   ·   N22   ·   N23   ·   N24   ·   N25</text>
    <g class="diagram" transform="translate(748 1266)"><text x="9" y="22">datos</text><text x="9" y="49">reglas</text><text x="9" y="76">tecnología</text><text x="9" y="103">personas</text><path class="soft" d="M118 15H269M118 42H269M118 69H269M118 96H269"/><path class="line" d="M186 6V109"/><path class="line" d="M180 101L186 109L192 101"/><rect class="volt" x="161" y="48" width="51" height="17"/><text x="209" y="126">en uso</text></g>
  </g>
<g id="station-f">
    <path class="divider" d="M 144 1447 H 1053"/>
    <path class="rail-branch" d="M 89 1508 H 143"/>
    <text x="151" y="1531" class="serif big">F</text>
    <text x="224" y="1474" class="caps ink">N26–N30 · ESTACIÓN F</text>
    <text x="224" y="1527" class="serif name">Operar</text>
    <text x="224" y="1565" class="serif change">De la entrega al servicio que resiste</text>
    <text x="224" y="1596" class="serif change">fallas.</text>
    <text x="224" y="1638" class="small">N26   ·   N27   ·   N28   ·   N29   ·   N30</text>
    <g class="diagram" transform="translate(748 1492)"><path class="line" d="M9 60H286"/><path class="line" d="M70 46L80 60L70 74M178 46L188 60L178 74"/><path class="soft" d="M93 14V111M200 14V111"/><text x="13" y="34">equipo</text><text x="107" y="34">tercero</text><text x="211" y="34">servicio</text><path class="dash" d="M256 75V105H54V79"/><rect class="volt" x="247" y="53" width="18" height="16"/><text class="muted" x="101" y="123">detectar · recuperar</text></g>
  </g>
<g id="station-g">
    <path class="divider" d="M 144 1673 H 1053"/>
    <path class="rail-branch" d="M 89 1734 H 143"/>
    <text x="151" y="1757" class="serif big">G</text>
    <text x="224" y="1700" class="caps ink">N31–N33 · ESTACIÓN G</text>
    <text x="224" y="1753" class="serif name">Gobernar IA</text>
    <text x="224" y="1791" class="serif change">De una promesa de IA a un uso limitado</text>
    <text x="224" y="1822" class="serif change">y vigilado.</text>
    <text x="224" y="1864" class="small">N31   ·   N32   ·   N33</text>
    <g class="diagram" transform="translate(748 1718)"><text x="9" y="59">tarea</text><path class="line" d="M49 55H82M138 55H181M240 55H284"/><rect class="shade" x="82" y="34" width="56" height="40"/><text x="95" y="60">IA</text><path class="line" d="M181 29V80M176 29H186M176 80H186"/><text x="188" y="21">control</text><rect class="volt" x="181" y="38" width="59" height="35"/><text x="186" y="60">humano</text><path class="dash" d="M253 72V105H108V81"/><text class="muted" x="137" y="123">vigilar · corregir · retirar</text></g>
  </g>
<g id="station-h">
    <path class="divider" d="M 144 1899 H 1053"/>
    <path class="rail-branch" d="M 89 1960 H 143"/>
    <text x="151" y="1983" class="serif big">H</text>
    <text x="224" y="1926" class="caps ink">N34–N36 · ESTACIÓN H</text>
    <text x="224" y="1979" class="serif name">Integrar</text>
    <text x="224" y="2017" class="serif change">De decisiones aisladas a aprendizaje</text>
    <text x="224" y="2048" class="serif change">compartido.</text>
    <text x="224" y="2090" class="small">N34   ·   N35   ·   N36</text>
    <g class="diagram" transform="translate(748 1944)"><path class="line" d="M46 38H132M170 38H254M265 54V100H43V54"/><path class="line" d="M245 32L254 38L245 44M43 63L43 54L52 63"/><text x="16" y="27">decidir</text><text x="112" y="27">compartir</text><text x="226" y="27">usar</text><rect class="volt" x="113" y="82" width="80" height="34"/><text x="121" y="104">aprender</text><text class="muted" x="7" y="121">próxima pregunta</text></g>
  </g>
<path d="M 45 2144 H 1055" class="divider"/>
<text x="48" y="2181" class="caps ink">DESPUÉS DE N36</text>
<text x="313" y="2181" class="serif ink" font-size="28">Lo aprendido mejora la próxima pregunta.</text>
</svg>
