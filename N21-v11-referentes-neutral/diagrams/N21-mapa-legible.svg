<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Cuatro responsabilidades, una promesa</title><desc id="desc">Proyecto, producto, servicio y plataforma no terminan al mismo tiempo. Una entrega técnica puede estar terminada y la promesa seguir fallando: si el turno nocturno no puede reparar, la capacidad aún tiene un límite.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Cuatro responsabilidades, una promesa">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N21">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N21 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Cuatro responsabilidades, una promesa</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Proyecto, producto, servicio y plataforma no terminan al mismo tiempo.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Proyecto" data-row-bottom="538.5">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Proyecto</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Organiza una transición temporal.</text>
<text x="530" y="385.4" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Cierra cuando entrega y transfiere lo</text>
<text x="530" y="420.79999999999995" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">comprometido.</text>
</g>
<g id="item-1" aria-label="Producto" data-row-bottom="783.0">
<path d="M52 546.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="590.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Producto</text>
<text x="530" y="588.5" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Sostiene valor para una población.</text>
<text x="530" y="629.9" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Decide qué mejorar y dónde seguir</text>
<text x="530" y="665.3" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">invirtiendo.</text>
</g>
<g id="item-2" aria-label="Servicio" data-row-bottom="1027.5">
<path d="M52 791.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="835.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Servicio</text>
<text x="530" y="833.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Responde por el uso en cada turno.</text>
<text x="530" y="874.4" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Incluye soporte, continuidad y</text>
<text x="530" y="909.8" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">reparación después del proyecto.</text>
</g>
<g id="item-3" aria-label="Plataforma" data-row-bottom="1272.0">
<path d="M52 1035.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1079.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Plataforma</text>
<text x="530" y="1077.5" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Ofrece capacidades compartidas.</text>
<text x="530" y="1118.9" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Gobierna contratos, acceso, evolución y</text>
<text x="530" y="1154.3000000000002" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">posibilidades de salida.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 424.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 668.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 913.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 1157.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Prueba conjunta">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Prueba conjunta</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una entrega técnica puede estar terminada y la promesa seguir fallando:</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">si el turno nocturno no puede reparar, la capacidad aún tiene un límite.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>