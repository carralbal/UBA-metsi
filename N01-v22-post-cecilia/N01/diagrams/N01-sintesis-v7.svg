<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" role="img" aria-labelledby="N01-summary-title N01-summary-desc"><title id="N01-summary-title">N01: del concepto al producto</title><desc id="N01-summary-desc">Separar: Conservá el pedido y formulá el resultado que debería cambiar; una solución preferida todavía no explica la causa. → Investigar: Nombrá una duda concreta y elegí evidencia capaz de distinguir explicaciones. → Autorizar: Escribí qué acción puede comenzar y qué decisión mayor sigue pendiente. → Revisar: Declarar una señal de revisión permite actuar sin fingir certeza ni dejar un daño urgente sin atención.</desc><rect x="0" y="0" width="640" height="860" fill="#fafaf8"/><text x="20" y="27" fill="#171917" font-family="Avenir" font-size="13" font-weight="600">RECORRIDO DE SÍNTESIS · N01</text><rect x="20" y="55" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="55" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="83" r="13" fill="#171917"/><text x="43" y="88" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">1</text><text x="73" y="87" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Separar</text><text x="39" y="111" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Conservá el pedido y formulá el resultado que debería cambiar; una</text><text x="39" y="130" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">solución preferida todavía no explica la causa.</text><text x="310" y="213.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="218.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="218.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="246.0" r="13" fill="#171917"/><text x="43" y="251.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">2</text><text x="73" y="250.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Investigar</text><text x="39" y="274.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Nombrá una duda concreta y elegí evidencia capaz de distinguir</text><text x="39" y="293.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">explicaciones.</text><text x="310" y="376.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="381.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="381.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="409.0" r="13" fill="#171917"/><text x="43" y="414.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">3</text><text x="73" y="413.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Autorizar</text><text x="39" y="437.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Escribí qué acción puede comenzar y qué decisión mayor sigue</text><text x="39" y="456.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">pendiente.</text><text x="310" y="539.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="544.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="544.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="572.0" r="13" fill="#171917"/><text x="43" y="577.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">4</text><text x="73" y="576.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Revisar</text><text x="39" y="600.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Declarar una señal de revisión permite actuar sin fingir certeza ni</text><text x="39" y="619.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">dejar un daño urgente sin atención.</text><rect x="20" y="727" width="600" height="110" fill="#171917"/><text x="39" y="750" fill="#cfff00" font-family="Avenir" font-size="13" font-weight="600">PRODUCTO PARA EL ENCUENTRO</text><text x="39" y="778" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">HH-01: nota de siete campos que separa pedido, propósito, dudas,</text><text x="39" y="800" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">evidencia, próxima acción autorizada, decisión pendiente y</text><text x="39" y="822" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">condición de revisión; más dos respuestas de preparación.</text></svg>