    <text class="title" x="960" y="448" fill="#242522">A</text>
    <text class="meta" x="1045" y="410" fill="#666762">N01—N04 · ESTACIÓN 01</text>
    <text class="title" x="1045" y="462" fill="#242522">Sistema</text>
    <text class="body" x="1045" y="500" fill="#666762">Del pedido formulado al sistema que hace</text>
    <text class="body" x="1045" y="530" fill="#666762">posible el resultado.</text>
    <path d="M940 570 H1620" class="line" fill="none"/>
