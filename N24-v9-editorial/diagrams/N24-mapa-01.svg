<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N24, priorizar hace visible la renuncia</title>
  <desc id="desc">Cuatro opciones de Hotel Horizonte atraviesan primero un límite de obligación y protección. Luego compiten por dos lugares de capacidad activa sin reducirse a un puntaje común. Cobertura accesible e instrumentación avanzan; canales externos esperan y automatización de sobreventa se retira. Cada decisión conserva consecuencia, población afectada y fecha de revisión.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:46px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.rule{stroke:#A8AAA6;stroke-width:2}.edge{fill:none;stroke:#737673;stroke-width:3}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N24 · EXPEDIENTE DE RENUNCIA</text>
  <text x="68" y="155" class="serif title">Priorizar hace visible la renuncia</text><text x="70" y="196" class="sans subtitle">El orden vale cuando muestra qué se protege, quién espera y cuándo se revisa.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Opciones de cartera">
    <text x="72" y="270" class="sans section">CUATRO OPCIONES, CUATRO FORMAS DE VALOR</text>
    <g><path d="M72 302 H1128 V416 H72 Z" class="outline"/><circle cx="114" cy="359" r="22" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="114" y="365" class="sans number" text-anchor="middle">01</text><text x="160" y="342" class="sans label">Cobertura accesible</text><text x="160" y="372" class="sans body">protege una condición vigente y reduce episodios sin alternativa</text><text x="1092" y="352" class="sans number" text-anchor="end">PROTECCIÓN</text><text x="1092" y="380" class="sans small" text-anchor="end">demora = exclusión</text></g>
    <g><path d="M72 432 H1128 V546 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><circle cx="114" cy="489" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="114" y="495" class="sans number" text-anchor="middle">02</text><text x="160" y="472" class="sans label">Instrumentación de eventos</text><text x="160" y="502" class="sans body">habilita aprendizaje y reduce reconstrucción manual</text><text x="1092" y="482" class="sans number" text-anchor="end">HABILITACIÓN</text><text x="1092" y="510" class="sans small" text-anchor="end">demora = evidencia perdida</text></g>
    <g><path d="M72 562 H1128 V676 H72 Z" class="outline"/><circle cx="114" cy="619" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="114" y="625" class="sans number" text-anchor="middle">03</text><text x="160" y="602" class="sans label">Canales externos</text><text x="160" y="632" class="sans body">ofrecen ingreso y amplían una semántica todavía inestable</text><text x="1092" y="612" class="sans number" text-anchor="end">OPORTUNIDAD</text><text x="1092" y="640" class="sans small" text-anchor="end">demora = ventana comercial</text></g>
    <g><path d="M72 692 H1128 V806 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><circle cx="114" cy="749" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="114" y="755" class="sans number" text-anchor="middle">04</text><text x="160" y="732" class="sans label">Automatización de sobreventa</text><text x="160" y="762" class="sans body">promete ocupación sin episodios suficientes ni daño delimitado</text><text x="1092" y="742" class="sans number" text-anchor="end">APUESTA</text><text x="1092" y="770" class="sans small" text-anchor="end">demora = opción preservada</text></g>
  </g>

  <g aria-label="Límite previo">
    <text x="72" y="866" class="sans section">PRIMERO SE DELIMITA EL ESPACIO LEGÍTIMO</text>
    <path d="M72 898 H1128 V1006 H72 Z" fill="#FFFFFF" stroke="#202020" stroke-width="2.4"/><path d="M72 898 H244 L232 920 H60 Z" fill="#CFFF00"/>
    <text x="108" y="944" class="sans label">Obligación y protección no entran como preferencias puntuables.</text>
    <text x="108" y="976" class="sans body">La fuente, la población, la reparación y la autoridad permanecen visibles antes de comparar beneficios.</text>
  </g>

  <g aria-label="Capacidad activa">
    <text x="72" y="1066" class="sans section">CAPACIDAD REAL: DOS APUESTAS ACTIVAS</text>
    <path d="M72 1098 H1128 V1274 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/>
    <g aria-label="Avanza cobertura"><circle cx="128" cy="1154" r="24" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="128" y="1160" class="sans number" text-anchor="middle">A</text><text x="174" y="1150" class="sans label">Avanza</text><text x="174" y="1181" class="sans body">cobertura accesible</text></g>
    <g aria-label="Avanza evidencia"><circle cx="438" cy="1154" r="24" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="438" y="1160" class="sans number" text-anchor="middle">B</text><text x="484" y="1150" class="sans label">Avanza</text><text x="484" y="1181" class="sans body">instrumentación</text></g>
    <path d="M650 1120 V1248" class="rule"/>
    <g aria-label="Espera canales"><circle cx="706" cy="1154" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="706" y="1160" class="sans number" text-anchor="middle">C</text><text x="752" y="1150" class="sans label">Espera</text><text x="752" y="1181" class="sans body">canales externos</text></g>
    <g aria-label="Retira sobreventa"><circle cx="946" cy="1154" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><path d="M935 1143 L957 1165 M957 1143 L935 1165" fill="none" stroke="#202020" stroke-width="3"/><text x="992" y="1150" class="sans label">Retira</text><text x="992" y="1181" class="sans body">sobreventa</text></g>
    <text x="108" y="1238" class="sans small">La reserva de capacidad operacional impide llenar la cartera con el escenario optimista.</text>
  </g>

  <g aria-label="Registro de renuncias">
    <text x="72" y="1334" class="sans section">LA DECISIÓN CONSERVA SU COSTO</text>
    <path d="M72 1366 H1128 V1468 H72 Z" class="outline"/>
    <text x="104" y="1408" class="sans label">Quién espera</text><text x="104" y="1440" class="sans body">agencia y automatización general</text>
    <path d="M414 1386 V1448" class="rule"/><text x="448" y="1408" class="sans label">Consecuencia aceptada</text><text x="448" y="1440" class="sans body">ingreso diferido, opción no probada</text>
    <path d="M812 1386 V1448" class="rule"/><text x="846" y="1408" class="sans label">Revisión</text><text x="846" y="1440" class="sans body">ocho semanas o cambio de capacidad</text>
  </g>
  <path d="M72 1504 H1128" class="rule"/><text x="72" y="1540" class="sans small">ORDENAR SIN RETIRAR COMPROMISOS NO ES PRIORIZAR.</text><text x="1128" y="1540" class="sans small" text-anchor="end">N24 · METSI</text>
</svg>
