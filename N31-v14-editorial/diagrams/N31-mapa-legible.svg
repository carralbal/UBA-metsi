<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Primero la tarea. Después la IA.</title><desc id="desc">Una capacidad se justifica frente a una alternativa práctica, no por novedad. El asistente prepara; Recepción y Comercial confirman. Comparar valor, supervisión y reparación con reglas, búsqueda y trabajo humano.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Primero la tarea. Después la IA.">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N31">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N31 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Primero la tarea. Después la IA.</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una capacidad se justifica frente a una alternativa práctica, no por</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">novedad.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Validar" data-row-bottom="504.48">
<path d="M52 320.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="364.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Validar</text>
<text x="530" y="362.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Reglas explícitas y comprobaciones</text>
<text x="530" y="395.64000000000004" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">deterministas.</text>
<text x="530" y="434.68" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Útil cuando la condición puede definirse</text>
<text x="530" y="467.72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">con precisión.</text>
</g>
<g id="item-1" aria-label="Buscar" data-row-bottom="696.36">
<path d="M52 512.48 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="556.48" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Buscar</text>
<text x="530" y="554.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Recuperar una política y su fuente.</text>
<text x="530" y="593.52" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La respuesta debe permitir comprobar</text>
<text x="530" y="626.56" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">procedencia y vigencia.</text>
</g>
<g id="item-2" aria-label="Predecir" data-row-bottom="888.24">
<path d="M52 704.36 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="748.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Predecir</text>
<text x="530" y="746.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Estimar un resultado con incertidumbre.</text>
<text x="530" y="785.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Evaluar calibración y costo de equivocarse.</text>
</g>
<g id="item-3" aria-label="Generar" data-row-bottom="1080.12">
<path d="M52 896.24 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="940.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Generar</text>
<text x="530" y="938.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Preparar un borrador.</text>
<text x="530" y="977.28" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Verificar, corregir o abstenerse antes de</text>
<text x="530" y="1010.3199999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">usarlo.</text>
</g>
<g id="item-4" aria-label="Actuar" data-row-bottom="1272.0">
<path d="M52 1088.12 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1132.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Actuar</text>
<text x="530" y="1130.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Modificar una reserva u otra condición</text>
<text x="530" y="1163.1599999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">real.</text>
<text x="530" y="1202.1999999999998" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Requiere permisos, límites y capacidad de</text>
<text x="530" y="1235.2399999999998" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">reparación.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 416.54 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 608.4200000000001 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 800.3 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 992.18 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-4-decision" d="M1148 1184.06 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Límite del caso">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Límite del caso</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El asistente prepara; Recepción y Comercial confirman. Comparar valor,</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">supervisión y reparación con reglas, búsqueda y trabajo humano.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>