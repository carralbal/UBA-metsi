<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">El permiso depende de la tarea</title><desc id="desc">Un 91% promedio puede ocultar errores graves en un grupo pequeño. Modelo, población, tarea o supervisión nuevos requieren otra prueba. Importa si el equipo puede detectar el error y reparar antes del efecto.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="El permiso depende de la tarea">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N32">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N32 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">El permiso depende de la tarea</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Un 91% promedio puede ocultar errores graves en un grupo pequeño.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Consulta general" data-row-bottom="620.0">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Consulta general</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">96% de desempeño observado y tiempo</text>
<text x="530" y="384.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">para revisar.</text>
<text x="530" y="430.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Se admite preparar un borrador con</text>
<text x="530" y="470.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">confirmación humana.</text>
</g>
<g id="item-1" aria-label="Solicitud accesible" data-row-bottom="946.0">
<path d="M52 628.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="672.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Solicitud accesible</text>
<text x="530" y="670.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Fallan cinco de doce casos; dos</text>
<text x="530" y="710.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">respuestas son impropias.</text>
<text x="530" y="756.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">No autorizar acción autónoma.</text>
<text x="530" y="796.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Escalar con la fuente visible.</text>
</g>
<g id="item-2" aria-label="Compensación nocturna" data-row-bottom="1272.0">
<path d="M52 954.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="998.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Compensación nocturna</text>
<text x="530" y="996.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Falta autoridad disponible para</text>
<text x="530" y="1036.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">confirmar.</text>
<text x="530" y="1082.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Permitir preparación, no ejecución.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 465.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 791.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 1117.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Reevaluar al cambiar el contexto">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Reevaluar al cambiar el contexto</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Modelo, población, tarea o supervisión nuevos requieren otra prueba.</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Importa si el equipo puede detectar el error y reparar antes del efecto.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>