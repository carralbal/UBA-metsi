or="start"><tspan x="144.0" dy="0.0">08</tspan></text><text x="144.0" y="1790.4" fill="#272525" font-family="Avenir, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">De la aplicación al ecosistema</tspan></text><rect x="120.0" y="1915.4" width="1104.0" height="176.0" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="1949.4" fill="#4D4D4D" font-family="Avenir, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">09</tspan></text><text x="144.0" y="1990.4" fill="#272525" font-family="Avenir, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">De la demostración de IA a la autonomía gobernada</tspan></text><rect x="120.0" y="2115.4" width="1104.0" height="176.0" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="2149.4" fill="#4D4D4D" font-family="Avenir, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">10</tspan></text><text x="144.0" y="2190.4" fill="#272525" font-family="Avenir, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Del portfolio a la práctica reflexiva</tspan></text></svg>
