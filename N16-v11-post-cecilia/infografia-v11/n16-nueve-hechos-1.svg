  <g id="contrast">
    <path d="M80 1200H599V1458H80Z" fill="#e9e6df" stroke="#babbb4" stroke-width="2"/>
    <path d="M108 1231H176V1241H108Z" fill="#cefa00"/>
    <text x="108" y="1295" fill="#282b27" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">EL RIESGO</text>
    <text x="108" y="1343" fill="#4e514b" font-family="Arial,Helvetica,sans-serif" font-size="25">Un estado actual resume.</text>
    <text x="108" y="1381" fill="#4e514b" font-family="Arial,Helvetica,sans-serif" font-size="25">No demuestra qué pasó</text>
    <text x="108" y="1419" fill="#4e514b" font-family="Arial,Helvetica,sans-serif" font-size="25">ni quién lo cambió.</text>
  </g>
