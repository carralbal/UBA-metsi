<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N29, volver el código no devuelve la promesa</title>
  <desc id="desc">El expediente identifica la liberación HH-29 y reúne seis ámbitos: código, configuración, infraestructura, datos, terceros y operación. El código admite rollback, pero la configuración debe reconciliarse, la infraestructura puede requerir aislamiento, los datos transformados exigen rollforward y los efectos externos necesitan reparación. Una puerta final distingue reversión, corrección hacia adelante y reparación según qué efectos ya ocurrieron.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:45px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.metric{font-size:34px}.rule{stroke:#A8AAA6;stroke-width:2}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}.pale{fill:#E4E6E3;stroke:#777A76;stroke-width:2}.arrow{fill:none;stroke:#737673;stroke-width:3}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N29 · EXPEDIENTE DE LIBERACIÓN</text>
  <text x="68" y="155" class="serif title">Volver el código no devuelve la promesa</text><text x="70" y="196" class="sans subtitle">La reversibilidad se prueba sobre los efectos, no sobre un botón.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Identidad de la liberación">
    <text x="72" y="270" class="sans section">UNA LIBERACIÓN IDENTIFICABLE</text>
    <rect x="72" y="302" width="1056" height="142" class="pale"/>
    <text x="108" y="344" class="sans number">HH-29 · SEDE PILOTO</text><text x="108" y="389" class="serif metric">artefacto A29 · misma huella</text>
    <path d="M640 326 V420" class="rule"/><text x="676" y="350" class="sans number">EXPOSICIÓN</text><text x="676" y="383" class="sans label">franja de habitaciones</text><text x="676" y="413" class="sans small">50 transiciones o primera discrepancia</text>
    <circle cx="1072" cy="373" r="25" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="1072" y="379" class="sans number" text-anchor="middle">01</text>
  </g>

  <g aria-label="Unidad de liberación">
    <text x="72" y="506" class="sans section">LA UNIDAD DE LIBERACIÓN SIGUE LA PROMESA COMPLETA</text>
    <g aria-label="Código"><rect x="72" y="540" width="506" height="118" class="outline"/><text x="104" y="578" class="sans number">01 · CÓDIGO</text><text x="104" y="611" class="sans label">restaurar versión</text><text x="104" y="639" class="sans body">rollback posible si nada persistió</text><circle cx="544" cy="574" r="8" fill="#CFFF00" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Configuración"><rect x="622" y="540" width="506" height="118" class="pale"/><text x="654" y="578" class="sans number">02 · CONFIGURACIÓN</text><text x="654" y="611" class="sans label">reconciliar regla y bandera</text><text x="654" y="639" class="sans body">la fuente gobernada debe volver a coincidir</text><circle cx="1094" cy="574" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Infraestructura"><rect x="72" y="682" width="506" height="118" class="pale"/><text x="104" y="720" class="sans number">03 · INFRAESTRUCTURA</text><text x="104" y="753" class="sans label">recrear o aislar</text><text x="104" y="781" class="sans body">red, permisos y capacidad también cambian</text><circle cx="544" cy="716" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Datos"><rect x="622" y="682" width="506" height="118" class="outline"/><text x="654" y="720" class="sans number">04 · DATOS</text><text x="654" y="753" class="sans label">corregir hacia adelante</text><text x="654" y="781" class="sans body">los estados transformados no retroceden solos</text><circle cx="1094" cy="716" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Terceros"><rect x="72" y="824" width="506" height="118" class="outline"/><text x="104" y="862" class="sans number">05 · TERCEROS</text><text x="104" y="895" class="sans label">coordinar compatibilidad</text><text x="104" y="923" class="sans body">cerraduras y canal conservan efectos propios</text><circle cx="544" cy="858" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Operación"><rect x="622" y="824" width="506" height="118" class="pale"/><text x="654" y="862" class="sans number">06 · OPERACIÓN</text><text x="654" y="895" class="sans label">comunicar y reparar</text><text x="654" y="923" class="sans body">la habitación debe volver a una condición explicable</text><circle cx="1094" cy="858" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
  </g>
  <path d="M600 446 V484" class="arrow" marker-end="url(#arrow)"/><path d="M600 944 V984" class="arrow" marker-end="url(#arrow)"/><path d="M600 1168 V1208" class="arrow" marker-end="url(#arrow)"/>

  <g aria-label="Puerta de exposición">
    <text x="72" y="1006" class="sans section">LA PUERTA APRUEBA EXPOSICIÓN, NO ACTIVIDAD TÉCNICA</text>
    <rect x="72" y="1038" width="1056" height="128" class="outline"/>
    <text x="108" y="1080" class="sans number">ENTRADAS</text><text x="108" y="1113" class="sans label">procedencia · escenarios HH-28 · recuperación ensayada</text>
    <path d="M728 1060 V1144" class="rule"/><text x="764" y="1080" class="sans number">AUTORIDAD</text><text x="764" y="1113" class="sans label">Ricardo detiene</text><text x="764" y="1141" class="sans small">Lucía confirma antes de ampliar</text>
  </g>

  <g aria-label="Árbol de recuperación">
    <text x="72" y="1230" class="sans section">¿QUÉ EFECTOS YA OCURRIERON?</text>
    <circle cx="122" cy="1284" r="24" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="122" y="1290" class="sans number" text-anchor="middle">?</text>
    <path d="M146 1284 H246 M246 1284 V1384 M246 1314 H350 M246 1384 H350 M246 1454 H350" class="arrow" marker-end="url(#arrow)"/>
    <g aria-label="Reversión"><rect x="350" y="1252" width="778" height="88" class="outline"/><text x="382" y="1284" class="sans number">SIN ESTADO PERSISTIDO</text><text x="382" y="1316" class="sans label">rollback y verificación del servicio</text></g>
    <g aria-label="Corrección hacia adelante"><rect x="350" y="1352" width="778" height="88" class="pale"/><text x="382" y="1384" class="sans number">DATOS O CONFIGURACIÓN TRANSFORMADOS</text><text x="382" y="1416" class="sans label">rollforward, reconciliación y nueva verificación</text></g>
    <g aria-label="Reparación"><rect x="350" y="1452" width="778" height="88" class="outline"/><text x="382" y="1484" class="sans number">PROMESA EXTERNA YA PRODUCIDA</text><text x="382" y="1516" class="sans label">aislar, comunicar, reparar y compensar</text></g>
  </g>
</svg>
