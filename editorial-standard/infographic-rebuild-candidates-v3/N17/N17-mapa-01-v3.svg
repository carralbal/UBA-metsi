<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">Una estrategia combina lógicas, no etiquetas</title><desc id="desc">Una intervención situada asigna lógicas predictiva, iterativa, incremental, adaptativa o experimental según conocimiento, costo del error, reversibilidad y evidencia, y aumenta compromiso mediante una puerta explícita. La composición utiliza la topología braid para relacionar seis elementos del argumento.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4D4D4D"/></marker></defs><rect width="1800" height="1100" fill="#F6F4EE"/><rect x="42" y="34" width="1716" height="1024" rx="18" fill="none" stroke="#CCCCCC" stroke-width="2"/><g id="header"><path d="M 82 55 H 222 L 207 76 H 67 Z" fill="#CFFF00"/><text x="250.0" y="74.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#272525" text-anchor="start"><tspan x="250.0" dy="0.0">N17 · MAPA CONCEPTUAL</tspan></text><text x="90.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#272525" text-anchor="start"><tspan x="90.0" dy="0.0">Una estrategia combina lógicas, no etiquetas</tspan></text><text x="90.0" y="208.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">Una intervención situada asigna lógicas predictiva, iterativa, incremental, adaptativa o experimental según</tspan><tspan x="90.0" dy="26.8">conocimiento, costo del error, reversibilidad y evidencia, y aumenta compromiso mediante una puerta explícita.</tspan></text><path d="M 90 253.0 H 1710" stroke="#CCCCCC" stroke-width="2"/></g><g id="connectors"><path d="M 390 355 C 600 355, 470 520, 900 570" fill="none" stroke="#CCCCCC" stroke-width="4" marker-end="url(#arrow)"/><path d="M 390 495 C 600 495, 560 520, 900 570" fill="none" stroke="#CCCCCC" stroke-width="4" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 390 635 C 600 635, 470 520, 900 570" fill="none" stroke="#CCCCCC" stroke-width="4" marker-end="url(#arrow)"/><path d="M 390 775 C 600 775, 560 520, 900 570" fill="none" stroke="#CCCCCC" stroke-width="4" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 1120 570 H 1370" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1580 650 C 1330 900, 820 900, 900 680" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/></g><g id="objects"><g id="n1"><rect x="80.0" y="300.0" width="310.0" height="110.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="326.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="98.0" dy="0.0">01</tspan></text><text x="102.0" y="355.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="102.0" dy="0.0">Conocimiento, costo</tspan><tspan x="102.0" dy="28.1">del error,</tspan><tspan x="102.0" dy="28.1">reversibilidad y</tspan><tspan x="102.0" dy="28.1">evidencia</tspan></text><circle cx="380.0" cy="310.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n2"><rect x="80.0" y="440.0" width="310.0" height="110.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="466.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="98.0" dy="0.0">02</tspan></text><text x="102.0" y="495.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="102.0" dy="0.0">Predictiva: contratos,</tspan><tspan x="102.0" dy="28.1">migración y ventana</tspan></text><circle cx="380.0" cy="450.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n3"><rect x="80.0" y="580.0" width="310.0" height="110.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="606.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="98.0" dy="0.0">03</tspan></text><text x="102.0" y="635.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="102.0" dy="0.0">Incremental: capacidad</tspan><tspan x="102.0" dy="28.1">completa en dos pisos</tspan></text><circle cx="380.0" cy="590.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n4"><rect x="80.0" y="720.0" width="310.0" height="110.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="98.0" y="746.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="98.0" dy="0.0">04</tspan></text><text x="102.0" y="775.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="102.0" dy="0.0">Adaptativa: secuencia</tspan><tspan x="102.0" dy="28.1">según señales críticas</tspan></text><circle cx="380.0" cy="730.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n5"><polygon points="1010.0,450.0 1120.0,570.0 1010.0,690.0 900.0,570.0" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1010.0" y="480.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="middle"><tspan x="1010.0" dy="0.0">05</tspan></text><text x="1010.0" y="562.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="middle"><tspan x="1010.0" dy="0.0">Semántica estable,</tspan><tspan x="1010.0" dy="28.1">reparación</tspan><tspan x="1010.0" dy="28.1">suficiente y</tspan><tspan x="1010.0" dy="28.1">autoridad operable</tspan></text><circle cx="1110.0" cy="460.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n6"><polygon points="1370.0,455.0 1698.0,455.0 1720.0,477.0 1720.0,665.0 1370.0,665.0" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="1388.0" y="481.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1388.0" dy="0.0">06</tspan></text><text x="1392.0" y="510.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1392.0" dy="0.0">Propósito, evidencia,</tspan><tspan x="1392.0" dy="28.1">autoridad y salida</tspan></text><circle cx="1710.0" cy="465.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><text x="650.0" y="280.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="650.0" dy="0.0">CUATRO LÓGICAS</tspan></text><text x="1420.0" y="750.0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#272525" text-anchor="start"><tspan x="1420.0" dy="0.0">CONDICIÓN DE SALIDA</tspan></text></g><g id="footer"><path d="M 90 1000 H 1710" stroke="#CCCCCC" stroke-width="2"/><text x="90.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">METSI · LA FORMA VISUAL RESPONDE AL ARGUMENTO</tspan></text><text x="1710.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="end"><tspan x="1710.0" dy="0.0">BRAID</tspan></text></g></svg>
