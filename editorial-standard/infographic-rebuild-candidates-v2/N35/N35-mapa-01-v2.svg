<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1086" viewBox="0 0 1344 1086" role="img" aria-label="Una comunicación profesional adapta el recorrido a la decisión de cada audiencia sin alterar la afirmación, la evidencia, la garantía, el límite, la objeción ni la condición de revisión."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#CCCCCC"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4D4D4D"/></marker></defs><path d="M121 32 H211 L200 47 H110 Z" fill="#CFFF00"/><rect width="100%" height="100%" fill="#FFFFFF"/><text x="120.0" y="78.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start"><tspan x="120.0" dy="0.0">La tesis permanece; el recorrido cambia</tspan><tspan x="120.0" dy="56.6">con la decisión</tspan></text><rect x="120.0" y="210.6" width="1104.0" height="118" rx="9" fill="#E6E6E6" stroke="#CCCCCC" stroke-width="2"/><text x="148.0" y="258.6" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="148.0" dy="0.0">Decisión acotada</tspan></text><rect x="162.0" y="346.6" width="1020.0" height="118" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="190.0" y="394.6" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="190.0" dy="0.0">Dirección</tspan></text><rect x="204.0" y="482.6" width="936.0" height="118" rx="9" fill="#E6E6E6" stroke="#CCCCCC" stroke-width="2"/><text x="232.0" y="530.6" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="232.0" dy="0.0">Operaciones</tspan></text><rect x="246.0" y="618.6" width="852.0" height="118" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="274.0" y="666.6" fill="#272525"