<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc"><title id="title">Mapa Actor, Decisión, Consecuencia</title><desc id="desc">Seis posiciones actorales se relacionan con una decisión y sus consecuencias: definir, conocer, autorizar, ejecutar, experimentar, objetar y reparar. Los contrapesos incluyen trazabilidad, participación, canal de objeción y capacidad de reparación.</desc><rect width="1800" height="760" fill="#FAFAF8"/><path d="M55 94 H1745" stroke="#202020" stroke-width="3"/><text x="55" y="60" text-anchor="start" font-family="Avenir" font-size="23" font-weight="700" fill="#202020"><tspan x="55" y="60">N05 · MAPA ACTOR, DECISIÓN, CONSECUENCIA</tspan></text><text x="55" y="137" text-anchor="start" font-family="Avenir" font-size="37" font-weight="500" fill="#202020"><tspan x="55" y="137">Una decisión redistribuye capacidad, voz y exposición</tspan></text><g fill="none" stroke="#666" stroke-width="2.5" stroke-dasharray="7 7"><path d="M490 300 C620 330 680 350 760 375"/><path d="M1010 300 C970 335 930 355 900 380"/><path d="M1310 330 C1190 355 1085 370 990 390"/><path d="M490 515 C620 485 690 455 770 430"/><path d="M1010 515 C970 480 930 455 900 430"/><path d="M1310 480 C1190 455 1085 435 990 415"/></g><circle cx="885" cy="405" r="108" fill="#202020"/><text x="885" y="392" text-anchor="middle" font-family="Avenir" font-size="26" font-weight="700" fill="#FFFFFF"><tspan x="885" y="392">DECISIÓN</tspan><tspan x="885" y="423">Y CONSECUENCIA</tspan></text><text x="885" y="455" text-anchor="middle" font-family="Avenir" font-size="17" font-weight="500" fill="#CFFF00"><tspan x="885" y="455">¿quién gana capacidad?</tspan></text><rect x="55" y="680" width="1690" height="48" fill="#E4E6E5"/><path d="M55 680 H430" stroke="#CFFF00" stroke-width="8"/><text x="80" y="711" text-anchor="start" font-family="Avenir" font-size="18" font-weight="700" fill="#202020"><tspan x="80" y="711">CONTRAPESOS  ·  trazabilidad  ·  participación  ·  canal de objeción  ·  capacidad de reparación</tspan></text><g id="define"><path d="M70 180 H475 L515 220 V330 H70 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="93" y="214" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="93" y="214">01</tspan></text><text x="93" y="260" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="93" y="260">DEFINIR</tspan></text><text x="93" y="296" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="93" y="296">Enmarca el problema y vuelve visibles</tspan><tspan x="93" y="317">unas relaciones</tspan></text><circle cx="489" cy="203" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="know"><path d="M590 180 H995 L1035 220 V330 H590 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="613" y="214" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="613" y="214">02</tspan></text><text x="613" y="260" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="613" y="260">CONOCER</tspan></text><text x="613" y="296" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="613" y="296">Aporta experiencia situada, datos o</tspan><tspan x="613" y="317">saber experto</tspan></text><circle cx="1009" cy="203" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="authorize"><path d="M1110 180 H1515 L1555 220 V330 H1110 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="1133" y="214" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="1133" y="214">03</tspan></text><text x="1133" y="260" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="1133" y="260">AUTORIZAR</tspan></text><text x="1133" y="296" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="1133" y="296">Aprueba recursos, reglas y límites de</tspan><tspan x="1133" y="317">acción</tspan></text><circle cx="1529" cy="203" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="execute"><path d="M70 430 H475 L515 470 V580 H70 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="93" y="464" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="93" y="464">04</tspan></text><text x="93" y="510" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="93" y="510">EJECUTAR</tspan></text><text x="93" y="546" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="93" y="546">Configura, opera y sostiene la</tspan><tspan x="93" y="567">intervención</tspan></text><circle cx="489" cy="453" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="experience"><path d="M590 430 H995 L1035 470 V580 H590 Z" fill="#FFFFFF" stroke="#444" stroke-width="2"/><text x="613" y="464" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="613" y="464">05</tspan></text><text x="613" y="510" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="613" y="510">EXPERIMENTAR</tspan></text><text x="613" y="546" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="613" y="546">Recibe beneficios, cargas, errores y</tspan><tspan x="613" y="567">daños</tspan></text><circle cx="1009" cy="453" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g><g id="contest"><path d="M1110 430 H1515 L1555 470 V580 H1110 Z" fill="#E4E6E5" stroke="#444" stroke-width="2"/><text x="1133" y="464" text-anchor="start" font-family="Avenir" font-size="17" font-weight="700" fill="#202020"><tspan x="1133" y="464">06</tspan></text><text x="1133" y="510" text-anchor="start" font-family="Avenir" font-size="24" font-weight="700" fill="#202020"><tspan x="1133" y="510">OBJETAR Y REPARAR</tspan></text><text x="1133" y="546" text-anchor="start" font-family="Avenir" font-size="17" font-weight="500" fill="#202020"><tspan x="1133" y="546">Puede cuestionar, detener, corregir o</tspan><tspan x="1133" y="567">reclamar</tspan></text><circle cx="1529" cy="453" r="8" fill="#CFFF00" stroke="#333" stroke-width="1.5"/></g></svg>