<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N31, la tarea elige una capacidad antes que una herramienta</title>
  <desc id="desc">El expediente descompone la atención de una reserva en cinco pasos: validar condiciones con una regla, recuperar una política mediante búsqueda, estimar aceptación con predicción, redactar una opción mediante generación y modificar la reserva mediante agencia. Cada paso se compara con una alternativa sin inteligencia artificial y con su consecuencia. Una puerta final evalúa valor incremental, costo de supervisión, exposición y condición de no uso para autorizar, restringir o descartar la capacidad.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:45px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.metric{font-size:30px}.rule{stroke:#A8AAA6;stroke-width:2}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}.pale{fill:#E4E6E3;stroke:#777A76;stroke-width:2}.arrow{fill:none;stroke:#737673;stroke-width:3}.volt{fill:#CFFF00;stroke:#202020;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N31 · EXPEDIENTE DE PERTINENCIA</text>
  <text x="68" y="155" class="serif title">La tarea elige una capacidad antes que una herramienta</text><text x="70" y="196" class="sans subtitle">La pertinencia se prueba frente a una alternativa más simple.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Episodio que activa la decisión">
    <text x="72" y="270" class="sans section">HH-31 · UNA RESPUESTA FLUIDA PRODUJO UNA PROMESA NO AUTORIZADA</text>
    <rect x="72" y="302" width="1056" height="132" class="pale"/><text x="106" y="342" class="sans number">CONSULTA NOCTURNA</text><text x="106" y="385" class="serif metric">la habitación existe</text><path d="M482 326 V410" class="rule"/>
    <text x="518" y="342" class="sans number">SALIDA PERSUASIVA</text><text x="518" y="385" class="serif metric">ofrece una mejora</text><path d="M850 326 V410" class="rule"/>
    <text x="886" y="342" class="sans number">CONSECUENCIA</text><text x="886" y="378" class="sans label">tarifa y categoría</text><text x="886" y="406" class="sans small">sin autoridad</text><circle cx="1090" cy="365" r="20" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1090" y="371" class="sans number" text-anchor="middle">!</text>
  </g>
  <path d="M600 436 V474" class="arrow" marker-end="url(#arrow)"/>

  <g aria-label="Descomposición del recorrido por capacidades">
    <text x="72" y="506" class="sans section">EL RECORRIDO SE CLASIFICA PASO POR PASO</text>
    <g aria-label="Validar condiciones"><rect x="72" y="540" width="506" height="126" class="outline"/><text x="104" y="578" class="sans number">01 · VALIDAR CONDICIONES</text><text x="104" y="615" class="sans label">regla determinista</text><text x="104" y="644" class="sans body">tabla vigente, ramas y excepción</text><circle cx="544" cy="576" r="8" class="volt"/></g>
    <g aria-label="Recuperar política"><rect x="622" y="540" width="506" height="126" class="pale"/><text x="654" y="578" class="sans number">02 · RECUPERAR POLÍTICA</text><text x="654" y="615" class="sans label">búsqueda</text><text x="654" y="644" class="sans body">fuente correcta, vigente y autorizada</text><circle cx="1094" cy="576" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Estimar aceptación"><rect x="72" y="690" width="506" height="126" class="pale"/><text x="104" y="728" class="sans number">03 · ESTIMAR ACEPTACIÓN</text><text x="104" y="765" class="sans label">predicción</text><text x="104" y="794" class="sans body">calibración, umbral y costo de error</text><circle cx="544" cy="726" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Redactar opción"><rect x="622" y="690" width="506" height="126" class="outline"/><text x="654" y="728" class="sans number">04 · REDACTAR OPCIÓN</text><text x="654" y="765" class="sans label">generación</text><text x="654" y="794" class="sans body">fuente visible, verificación y abstención</text><circle cx="1094" cy="726" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
    <g aria-label="Modificar reserva"><rect x="72" y="840" width="1056" height="126" class="outline"/><text x="104" y="878" class="sans number">05 · MODIFICAR LA RESERVA</text><text x="104" y="915" class="sans label">agencia: herramientas, permisos y efectos</text><path d="M710 864 V942" class="rule"/><text x="746" y="884" class="sans number">LÍMITE HH-31</text><text x="746" y="917" class="sans label">preparar, no conceder</text><text x="746" y="945" class="sans small">Recepción o Comercial confirman</text><circle cx="1090" cy="891" r="22" class="volt"/><text x="1090" y="897" class="sans number" text-anchor="middle">05</text></g>
  </g>
  <path d="M600 968 V1006" class="arrow" marker-end="url(#arrow)"/>

  <g aria-label="Comparación con alternativa sin inteligencia artificial">
    <text x="72" y="1038" class="sans section">LA LÍNEA DE BASE TAMBIÉN COMPITE</text>
    <rect x="72" y="1070" width="1056" height="138" class="pale"/>
    <text x="104" y="1108" class="sans number">ALTERNATIVA PRACTICABLE</text><text x="104" y="1144" class="sans label">regla explícita · búsqueda · escalamiento humano</text><text x="104" y="1177" class="sans body">misma población · misma consecuencia · trabajo total visible</text>
    <path d="M760 1092 V1184" class="rule"/><text x="796" y="1112" class="sans number">VALOR INCREMENTAL</text><text x="796" y="1148" class="sans label">mejora atribuible</text><text x="796" y="1177" class="sans small">incluye supervisión y reparación</text>
  </g>
  <path d="M600 1210 V1248" class="arrow" marker-end="url(#arrow)"/>

  <g aria-label="Puerta de pertinencia">
    <text x="72" y="1280" class="sans section">PUERTA DE PERTINENCIA</text>
    <g aria-label="Criterios de entrada"><rect x="72" y="1312" width="696" height="174" class="outline"/><text x="104" y="1350" class="sans number">CUATRO PRUEBAS</text><text x="104" y="1384" class="sans label">valor mayor que la línea de base</text><text x="104" y="1414" class="sans label">supervisión real y proporcional</text><text x="104" y="1444" class="sans label">efecto limitado y reparable</text><text x="104" y="1474" class="sans label">condición de no uso ejecutable</text></g>
    <path d="M770 1398 H816" class="arrow" marker-end="url(#arrow)"/>
    <g aria-label="Decisiones posibles"><rect x="836" y="1312" width="292" height="174" class="pale"/><text x="868" y="1350" class="sans number">DECISIÓN</text><text x="868" y="1388" class="sans label">autorizar un paso</text><text x="868" y="1420" class="sans label">restringir capacidad</text><text x="868" y="1452" class="sans label">no usar IA</text><circle cx="1090" cy="1398" r="24" class="volt"/><text x="1090" y="1404" class="sans number" text-anchor="middle">?</text></g>
    <text x="600" y="1532" class="sans small" text-anchor="middle">cien conversaciones, primera acción no autorizada o supervisión más costosa que la ruta base</text>
  </g>
</svg>
