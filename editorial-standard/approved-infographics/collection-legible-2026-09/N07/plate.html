<!doctype html><html lang="es-AR"><meta charset="utf-8"><title>METSI N7 · Mapa de decisión</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;background:#fff}.plate{position:absolute;left:18.5mm;top:18mm;width:173mm;height:233.55mm}.plate img{display:block;width:100%;height:100%}footer{position:absolute;top:280mm;left:18.5mm;right:18.5mm;border-top:.2mm solid #b5b7b0;padding-top:3mm;font:8pt Arial;color:#575a55;display:flex;justify-content:space-between}</style><main class="plate"><img src="N07-mapa-legible.svg" alt="La evidencia sirve cuando cambia lo que podemos afirmar y hacer. Definir la pregunta ¿Qué decisión necesita evidencia? Una pregunta concreta permite elegir qué observar. Reunir rastros Episodios, registros, contexto y fuentes independientes. Buscá también un caso que contradiga la explicación. Comparar ¿Qué coincide y qué no? Un desacuerdo puede revelar una diferencia importante. Calibrar ¿Hasta dónde llega lo encontrado? Una pista no es todavía un patrón ni una causa demostrada. Sostener una afirmación Explicar qué la apoya y qué la debilita. Conservar dudas y explicaciones rivales. Decidir y volver a mirar Actuar en proporción a lo que sabemos. Definir qué comprobar después y cuándo revisar la decisión. La próxima observación debe poder cambiar la interpretación o la acción. Si nada puede cambiar, no estamos investigando.
