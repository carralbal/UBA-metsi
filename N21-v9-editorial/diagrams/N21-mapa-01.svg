<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N21, una capacidad convive con cuatro gobiernos</title>
  <desc id="desc">La capacidad de ingreso de Hotel Horizonte se ubica en el centro. A su alrededor conviven proyecto, producto, servicio y plataforma. El proyecto coordina una transición temporal; el producto aprende sobre un problema y una población; el servicio sostiene una promesa en cada turno; la plataforma gobierna capacidades y contratos compartidos. Cada objeto tiene horizonte, evidencia y condición de cierre diferentes. Un campo final muestra que la decisión compartida debe mantener separados el cumplimiento local y el resultado común.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:47px;letter-spacing:-1px}.subtitle{font-size:21px;fill:#5E605D}.section{font-size:19px;font-weight:700;letter-spacing:4px}.label{font-size:20px;font-weight:700}.body{font-size:16px;fill:#50524F}.small{font-size:14px;fill:#676966}.number{font-size:15px;font-weight:700;letter-spacing:3px}.rule{stroke:#A8AAA6;stroke-width:2}.link{fill:none;stroke:#777A76;stroke-width:3}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N21 · MAPA DE OBJETOS</text>
  <text x="68" y="157" class="serif title">Una capacidad convive con cuatro gobiernos</text><text x="70" y="198" class="sans subtitle">Cambiar el nombre no alcanza: cambian horizonte, valor, evidencia, financiación y cierre.</text><path d="M68 230 H1132" class="rule"/>

  <text x="72" y="278" class="sans section">CAPACIDAD COMPARTIDA</text>
  <g aria-label="Capacidad de ingreso de Hotel Horizonte">
    <path d="M268 310 H932 L952 330 V502 H248 V330 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><path d="M248 310 H424 L410 332 H234 Z" fill="#CFFF00"/>
    <text x="300" y="362" class="sans number">HH-21 · INGRESO</text><text x="300" y="412" class="serif" style="font-size:29px">Entregar una habitación</text><text x="300" y="451" class="serif" style="font-size:29px">utilizable o una reparación definida.</text>
    <line x1="700" y1="346" x2="700" y2="468" class="rule"/><text x="738" y="376" class="sans label">Resultado común</text><text x="738" y="411" class="sans body">uso, operación</text><text x="738" y="439" class="sans body">y aprendizaje</text><text x="738" y="472" class="sans small">ninguna capa lo prueba sola</text>
  </g>

  <text x="72" y="558" class="sans section">CUATRO OBJETOS, CUATRO OBLIGACIONES</text>
  <g aria-label="Enlaces entre capacidad y objetos"><path d="M600 502 V586 M600 586 H320 V620 M600 586 H880 V620" class="link"/><circle cx="600" cy="586" r="7" fill="#CFFF00" stroke="#202020" stroke-width="2"/><circle cx="320" cy="620" r="6" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="880" cy="620" r="6" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="320" cy="914" r="6" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><circle cx="880" cy="914" r="6" fill="#FFFFFF" stroke="#202020" stroke-width="2"/></g>
  <g aria-label="Proyecto">
    <path d="M72 620 H546 L562 636 V868 H72 Z" class="outline"/><text x="102" y="663" class="sans number">01 · PROYECTO</text><text x="102" y="708" class="serif" style="font-size:30px">Coordina la transición</text><line x1="102" y1="733" x2="526" y2="733" class="rule"/>
    <text x="102" y="770" class="sans label">Duración</text><text x="250" y="770" class="sans body">temporal</text><text x="102" y="805" class="sans label">Prueba de cierre</text><text x="250" y="805" class="sans body">transferencia verificable</text><text x="102" y="840" class="sans label">Cierra</text><text x="250" y="840" class="sans body">cuando entrega capacidad</text>
  </g>
  <g aria-label="Producto">
    <path d="M638 620 H1112 L1128 636 V868 H638 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="668" y="663" class="sans number">02 · PRODUCTO</text><text x="668" y="708" class="serif" style="font-size:30px">Aprende sobre valor</text><line x1="668" y1="733" x2="1092" y2="733" class="rule"/>
    <text x="668" y="770" class="sans label">Continuidad</text><text x="816" y="770" class="sans body">mientras justifique inversión</text><text x="668" y="805" class="sans label">Prueba de valor</text><text x="816" y="805" class="sans body">outcome por población</text><text x="668" y="840" class="sans label">Revisa</text><text x="816" y="840" class="sans body">prioridad, cambio o retiro</text>
  </g>
  <path d="M320 868 V914 M880 868 V914" class="link"/>
  <g aria-label="Servicio">
    <path d="M72 914 H546 L562 930 V1162 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="102" y="957" class="sans number">03 · SERVICIO</text><text x="102" y="1002" class="serif" style="font-size:30px">Sostiene la promesa</text><line x1="102" y1="1027" x2="526" y2="1027" class="rule"/>
    <text x="102" y="1064" class="sans label">Régimen</text><text x="250" y="1064" class="sans body">cada turno y excepción</text><text x="102" y="1099" class="sans label">Prueba operacional</text><text x="250" y="1099" class="sans body">uso, soporte y reparación</text><text x="102" y="1134" class="sans label">Responde</text><text x="250" y="1134" class="sans body">aunque el proyecto termine</text>
  </g>
  <g aria-label="Plataforma">
    <path d="M638 914 H1112 L1128 930 V1162 H638 Z" class="outline"/><text x="668" y="957" class="sans number">04 · PLATAFORMA</text><text x="668" y="1002" class="serif" style="font-size:30px">Habilita a otros</text><line x1="668" y1="1027" x2="1092" y2="1027" class="rule"/>
    <text x="668" y="1064" class="sans label">Persistencia</text><text x="816" y="1064" class="sans body">capacidades compartidas</text><text x="668" y="1099" class="sans label">Prueba compartida</text><text x="816" y="1099" class="sans body">contratos y autonomía</text><text x="668" y="1134" class="sans label">Gobierna</text><text x="816" y="1134" class="sans body">acceso, evolución y salida</text>
  </g>

  <text x="72" y="1222" class="sans section">UNA DECISIÓN COMPARTIDA, RESPONSABILIDADES DISTINTAS</text>
  <g aria-label="Conflicto de clasificación">
    <rect x="72" y="1258" width="1056" height="176" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/>
    <text x="106" y="1300" class="sans number">CANAL EXTERNO ANTES DE TEMPORADA</text>
    <text x="106" y="1342" class="sans label">Proyecto</text><text x="246" y="1342" class="sans body">puede entregar</text><text x="426" y="1342" class="sans label">Producto</text><text x="558" y="1342" class="sans body">aún no prueba valor</text>
    <text x="106" y="1385" class="sans label">Servicio</text><text x="246" y="1385" class="sans body">no repara de noche</text><text x="426" y="1385" class="sans label">Plataforma</text><text x="558" y="1385" class="sans body">detecta estado incompatible</text>
    <g aria-label="Decisión de alcance"><rect x="846" y="1289" width="244" height="112" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="968" y="1330" class="sans number" text-anchor="middle">DECISIÓN</text><text x="968" y="1362" class="sans body" text-anchor="middle">limitar población</text><text x="968" y="1388" class="sans body" text-anchor="middle">y conservar salida</text></g>
  </g>
  <path d="M72 1480 H1128" class="rule"/><text x="72" y="1520" class="sans small">EL CUMPLIMIENTO DE UNA CAPA NO DEMUESTRA EL RESULTADO DE OTRA.</text><text x="1128" y="1520" class="sans small" text-anchor="end">N21 · METSI</text>
</svg>
