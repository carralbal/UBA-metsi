  <g id="station-g"><path d="M249 544.3 A250 250 0 0 1 384.3 409" class="sector"/><circle cx="257" cy="417" r="39" fill="#f6f4ee" stroke="#242522" stroke-width="2"/><text class="node" x="244" y="428" fill="#242522">G</text></g>
