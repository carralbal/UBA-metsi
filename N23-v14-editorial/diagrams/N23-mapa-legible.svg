<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Un corte pequeño debe funcionar completo</title><desc id="desc">Terminar componentes aislados no demuestra que el huésped pueda ingresar. Canal directo, un turno y dos pisos, con revisión humana y retorno seguro. Ampliar una dimensión por vez y volver a validar.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Un corte pequeño debe funcionar completo">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N23">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N23 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Un corte pequeño debe funcionar completo</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Terminar componentes aislados no demuestra que el huésped pueda ingresar.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Promesa e información" data-row-bottom="538.5">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="345.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Promesa e información</text>
<text x="78" y="389.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Qué se ofrece y con qué estados vigentes.</text>
<text x="78" y="434.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una pantalla nueva con información vieja no alcanza.</text>
</g>
<g id="item-1" aria-label="Decisión y autoridad" data-row-bottom="783.0">
<path d="M52 546.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="589.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Decisión y autoridad</text>
<text x="78" y="633.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién confirma y quién puede detener.</text>
<text x="78" y="679.3" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La excepción debe tener una respuesta autorizada.</text>
</g>
<g id="item-2" aria-label="Acción y reparación" data-row-bottom="1027.5">
<path d="M52 791.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="834.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Acción y reparación</text>
<text x="78" y="878.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Ingreso efectivo, soporte y retorno seguro.</text>
<text x="78" y="923.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La operación no se agrega después de “terminar”.</text>
</g>
<g id="item-3" aria-label="Aprendizaje" data-row-bottom="1272.0">
<path d="M52 1035.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1078.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Aprendizaje</text>
<text x="78" y="1122.5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Observar capacidad, evidencia y riesgo.</text>
<text x="78" y="1168.3" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Contar tareas terminadas no prueba un resultado útil.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 424.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 668.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 913.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 1157.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Corte de HH-23">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Corte de HH-23</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Canal directo, un turno y dos pisos, con revisión humana y retorno</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">seguro. Ampliar una dimensión por vez y volver a validar.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>