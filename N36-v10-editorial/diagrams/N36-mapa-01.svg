<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N36, el resultado no cierra el aprendizaje</title>
  <desc id="desc">Un episodio de Hotel Horizonte muestra un resultado favorable sostenido por coordinación manual invisible. La sorpresa separa la teoría declarada de la teoría en uso y abre tres niveles de aprendizaje: corregir una acción, revisar una regla y su autoridad, o modificar el sistema de aprendizaje. Cada hallazgo debe convertirse en un cambio practicable con responsable, evidencia y un próximo episodio donde pueda fallar. La inteligencia artificial sólo propone comparaciones u objeciones; las personas verifican fuentes y asumen la decisión.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:43px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.statement{font-size:25px}.rule{stroke:#A8AAA6;stroke-width:2}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}.pale{fill:#E4E6E3;stroke:#777A76;stroke-width:2}.soft{fill:#F1F2EF;stroke:#A8AAA6;stroke-width:2}.arrow{fill:none;stroke:#737673;stroke-width:3}.volt{fill:#CFFF00;stroke:#202020;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N36 · SISTEMA DE PRÁCTICA REFLEXIVA</text>
  <text x="68" y="156" class="serif title">El resultado no cierra el aprendizaje</text>
  <text x="70" y="198" class="sans subtitle">Una mejora puede contradecir la explicación que pretendía justificarla.</text><path d="M68 228 H1132" class="rule"/>

  <g aria-label="Episodio y sorpresa">
    <text x="72" y="274" class="sans section">HH-36 · EL EPISODIO SE CONSERVA SIN REESCRIBIR EL PASADO</text>
    <rect x="72" y="306" width="300" height="138" class="soft"/><text x="98" y="340" class="sans number">EXPECTATIVA</text><text x="98" y="378" class="serif statement">el estado integrado</text><text x="98" y="407" class="serif statement">reduce coordinación</text><text x="98" y="432" class="sans small">evidencia disponible entonces</text><circle cx="340" cy="330" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/>
    <path d="M372 375 H430" class="arrow" marker-end="url(#arrow)"/>
    <rect x="442" y="306" width="300" height="138" class="pale"/><text x="468" y="340" class="sans number">RESULTADO OBSERVADO</text><text x="468" y="378" class="serif statement">baja la espera y no</text><text x="468" y="407" class="serif statement">hay incidentes graves</text><text x="468" y="432" class="sans small">resultado favorable</text><circle cx="710" cy="330" r="8" class="volt"/>
    <path d="M742 375 H800" class="arrow" marker-end="url(#arrow)"/>
    <rect x="812" y="306" width="316" height="138" class="outline"/><text x="838" y="340" class="sans number">TRABAJO INVISIBLE</text><text x="838" y="378" class="serif statement">una recepcionista</text><text x="838" y="407" class="serif statement">anticipa excepciones</text><text x="838" y="432" class="sans small">mecanismo no registrado</text><circle cx="1096" cy="330" r="8" fill="#FFFFFF" stroke="#202020" stroke-width="2"/>
    <path d="M970 444 V490" class="arrow" marker-end="url(#arrow)"/>
    <rect x="72" y="504" width="1056" height="82" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="104" y="538" class="sans number">SORPRESA PRODUCTIVA</text><text x="368" y="545" class="serif statement">el buen resultado deja de confirmar la explicación inicial</text><circle cx="1090" cy="530" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/>
  </g>

  <g aria-label="Teoría declarada y teoría en uso">
    <text x="72" y="646" class="sans section">DOS TEORÍAS QUE DEBEN CONTRASTARSE</text>
    <rect x="72" y="678" width="506" height="118" class="outline"/><text x="102" y="712" class="sans number">TEORÍA DECLARADA</text><text x="102" y="750" class="sans label">la integración reduce trabajo manual</text><text x="102" y="777" class="sans body">regla que la organización dice seguir</text>
    <rect x="622" y="678" width="506" height="118" class="pale"/><text x="652" y="712" class="sans number">TEORÍA EN USO</text><text x="652" y="750" class="sans label">proteger al huésped exige coordinar por fuera</text><text x="652" y="777" class="sans body">regla inferida de decisiones observables</text>
  </g>

  <g aria-label="Tres niveles de aprendizaje">
    <text x="72" y="860" class="sans section">LA SORPRESA ABRE EL NIVEL DE CAMBIO NECESARIO</text>
    <path d="M300 888 V1180" class="rule"/><path d="M742 888 V1180" class="rule"/>
    <g><text x="88" y="930" class="sans number">01 · BUCLE SIMPLE</text><text x="326" y="930" class="sans label">Corregir una acción</text><text x="768" y="924" class="sans body">ajustar umbral o procedimiento</text><text x="768" y="950" class="sans body">sin cambiar el objetivo</text><path d="M88 978 H1112" class="rule"/></g>
    <g><text x="88" y="1030" class="sans number">02 · DOBLE BUCLE</text><text x="326" y="1030" class="sans label">Revisar regla, objetivo y autoridad</text><text x="768" y="1024" class="sans body">incorporar reparación y accesibilidad</text><text x="768" y="1050" class="sans body">a la definición de éxito</text><path d="M88 1078 H1112" class="rule"/></g>
    <g><text x="88" y="1118" class="sans number">03 · SISTEMA</text><text x="88" y="1140" class="sans number">DE APRENDIZAJE</text><text x="350" y="1130" class="sans label">Cambiar cómo la organización aprende</text><text x="768" y="1124" class="sans body">registro, conversación, práctica</text><text x="768" y="1150" class="sans body">devolución y revisión continua</text></g>
  </g>

  <g aria-label="Responsabilidad humana y asistencia de IA">
    <rect x="72" y="1224" width="1056" height="108" class="soft"/>
    <text x="102" y="1259" class="sans number">ASISTENCIA DE IA ACOTADA</text><text x="102" y="1295" class="sans body">propone explicaciones rivales · simula objeciones · compara versiones</text>
    <path d="M680 1276 H744" class="arrow" marker-end="url(#arrow)"/>
    <text x="772" y="1259" class="sans number">RESPONSABILIDAD HUMANA</text><text x="772" y="1295" class="sans body">verifica fuentes · pondera daño · firma la decisión</text><circle cx="1090" cy="1252" r="9" class="volt"/>
  </g>

  <g aria-label="Prueba futura">
    <text x="72" y="1390" class="sans section">APRENDER EXIGE VOLVER A LA PRÁCTICA</text>
    <rect x="72" y="1422" width="252" height="90" class="outline"/><text x="96" y="1456" class="sans number">CAMBIO PRACTICABLE</text><text x="96" y="1490" class="sans body">regla, ensayo o artefacto</text>
    <path d="M324 1467 H374" class="arrow" marker-end="url(#arrow)"/>
    <rect x="386" y="1422" width="190" height="90" class="pale"/><text x="410" y="1456" class="sans number">RESPONSABLE</text><text x="410" y="1490" class="sans body">autoridad y plazo</text>
    <path d="M576 1467 H626" class="arrow" marker-end="url(#arrow)"/>
    <rect x="638" y="1422" width="224" height="90" class="outline"/><text x="662" y="1456" class="sans number">PRÓXIMO EPISODIO</text><text x="662" y="1490" class="sans body">puede refutar la teoría</text>
    <path d="M862 1467 H912" class="arrow" marker-end="url(#arrow)"/>
    <rect x="924" y="1422" width="204" height="90" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="948" y="1456" class="sans number">CAPACIDAD</text><text x="948" y="1490" class="sans body">observable en otros</text>
    <text x="600" y="1560" class="sans small" text-anchor="middle">si nada cambia en una práctica, una autoridad o una prueba futura, la reflexión todavía es sólo un relato</text>
  </g>
</svg>
