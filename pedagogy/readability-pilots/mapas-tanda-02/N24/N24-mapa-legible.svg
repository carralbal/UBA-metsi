<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Todo parece urgente. ¿Qué hacemos primero?</title><desc id="desc">De arriba abajo: se protege la accesibilidad; de cuatro opciones avanzan cobertura accesible e instrumentación de eventos, esperan los canales externos y no avanza por ahora la automatización de sobreventa. Se reserva capacidad para incidentes. Toda postergación registra personas afectadas, consecuencia y revisión.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect x="0" y="0" width="1200" height="1620" fill="#F7F6F2"/>
<g id="encabezado" aria-label="encabezado">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">METSI · N24 · MAPA DE DECISIÓN</text>
<text x="52" y="118" font-family="Georgia,serif" font-size="52" font-weight="400" text-anchor="start" fill="#202020">Todo parece urgente.</text>
<text x="52" y="182" font-family="Georgia,serif" font-size="52" font-weight="400" text-anchor="start" fill="#202020">¿Qué hacemos primero?</text>
<text x="52" y="226" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Hotel Horizonte · Elegir también implica decir qué no se hará.</text>
<path d="M52 250 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
</g>
<text x="52" y="295" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">01   Primero: proteger lo que no puede negociarse</text>
<g id="proteccion" aria-label="La accesibilidad no compite como una mejora opcional.">
<rect x="52" y="320" width="1096" height="154" fill="#E5E6E0" stroke="#A5A79F" stroke-width="1.5"/>
<text x="80" y="364" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">La accesibilidad no compite como una mejora opcional.</text>
<text x="80" y="405" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Demorarla mantiene una exclusión. Hay un compromiso del hotel.</text>
<text x="80" y="446" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">La posible obligación legal todavía requiere verificación.</text>
</g>
<text x="52" y="529" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">02   Cuatro opciones. Sólo dos trabajos activos.</text>
<text x="145" y="580" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">QUÉ SE PROPONE Y PARA QUÉ</text>
<text x="922" y="580" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202020">DECISIÓN</text>
<path d="M52 617 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-accesibilidad" d="M801 687 H882" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="opcion-accesibilidad" aria-label="Completar cobertura accesible">
<circle cx="82" cy="666" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="82" y="675" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">1</text>
<text x="145" y="667" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Completar cobertura accesible</text>
<text x="145" y="708" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Atender también a quienes hoy</text>
<text x="145" y="746" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">no tienen una alternativa en ciertos turnos.</text>
</g>
<g id="ahora-accesibilidad" aria-label="AHORA · Protege el servicio">
<rect x="905" y="635" width="243" height="131" fill="#CFFF00" stroke="#A5A79F" stroke-width="1.5"/>
<text x="922" y="669" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#202020">AHORA</text>
<text x="922" y="708" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Protege</text>
<text x="922" y="743" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">el servicio</text>
</g>
<path d="M52 780 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-eventos" d="M801 850 H882" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="opcion-eventos" aria-label="Registrar mejor lo que ocurre">
<circle cx="82" cy="829" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="82" y="838" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">2</text>
<text x="145" y="830" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Registrar mejor lo que ocurre</text>
<text x="145" y="871" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Instrumentar eventos: producir evidencia</text>
<text x="145" y="909" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">y reducir reconstrucciones manuales.</text>
</g>
<g id="ahora-eventos" aria-label="AHORA · Permite aprender">
<rect x="905" y="798" width="243" height="131" fill="#CFFF00" stroke="#A5A79F" stroke-width="1.5"/>
<text x="922" y="832" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#202020">AHORA</text>
<text x="922" y="871" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Permite</text>
<text x="922" y="906" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">aprender</text>
</g>
<path d="M52 943 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-canales" d="M801 1013 H882" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="opcion-canales" aria-label="Sumar canales externos">
<circle cx="82" cy="992" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="82" y="1001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">3</text>
<text x="145" y="993" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Sumar canales externos</text>
<text x="145" y="1034" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Puede traer reservas, pero también ampliar</text>
<text x="145" y="1072" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">un servicio que todavía tiene fallas.</text>
</g>
<g id="espera-canales" aria-label="ESPERA · Se posterga la expansión">
<rect x="905" y="961" width="243" height="131" fill="#F7F6F2" stroke="#A5A79F" stroke-width="1.5"/>
<text x="922" y="995" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#202020">ESPERA</text>
<text x="922" y="1034" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Se posterga</text>
<text x="922" y="1069" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">la expansión</text>
</g>
<path d="M52 1106 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<path id="e-sobreventa" d="M801 1176 H882" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="opcion-sobreventa" aria-label="Automatizar la sobreventa">
<circle cx="82" cy="1155" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="82" y="1164" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">4</text>
<text x="145" y="1156" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Automatizar la sobreventa</text>
<text x="145" y="1197" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Promete más ocupación, pero sus efectos</text>
<text x="145" y="1235" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">y posibles daños todavía no se probaron.</text>
</g>
<g id="no-sobreventa" aria-label="NO AVANZA · Faltan pruebas sobre sus efectos">
<rect x="905" y="1124" width="243" height="131" fill="#F7F6F2" stroke="#A5A79F" stroke-width="1.5"/>
<text x="922" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#202020">NO AVANZA</text>
<text x="922" y="1197" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Faltan pruebas</text>
<text x="922" y="1232" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">sobre sus efectos</text>
</g>
<path d="M52 1269 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="reserva" aria-label="Se reserva capacidad para incidentes y soporte.">
<text x="52" y="1314" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202020">Se reserva capacidad para incidentes y soporte.</text>
</g>
<text x="52" y="1384" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">03   Cada postergación debe dejar por escrito</text>
<g id="quien" aria-label="Quién espera">
<text x="52" y="1450" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Quién espera</text>
<text x="52" y="1492" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Las personas o áreas</text>
<text x="52" y="1530" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">que quedan afectadas.</text>
</g>
<g id="consecuencia" aria-label="Qué se pierde">
<text x="425" y="1450" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Qué se pierde</text>
<text x="425" y="1492" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">El efecto de demorar</text>
<text x="425" y="1530" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">esa iniciativa.</text>
</g>
<g id="revisar" aria-label="Cuándo revisar">
<text x="800" y="1450" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#202020">Cuándo revisar</text>
<text x="800" y="1492" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">Una fecha y señales</text>
<text x="800" y="1530" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#202020">para cambiar la decisión.</text>
</g>
<path d="M52 1560 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="52" y="1596" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202020">Ordenar una lista no alcanza si todo sigue en marcha.</text>
</svg>
