<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Observar antes de explicar</title><desc id="desc">Separar lo que pasó de lo que creemos que significa ayuda a investigar mejor. ¿Otra persona puede distinguir en el registro qué vimos y qué estamos suponiendo?</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Observar antes de explicar">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N08">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N08 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Observar antes de explicar</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Separar lo que pasó de lo que creemos que significa ayuda a investigar</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">mejor.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Contexto y evento" data-row-bottom="504.48">
<path d="M52 320.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="363.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Contexto y evento</text>
<text x="78" y="407.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Dónde, cuándo y en qué condiciones ocurrió.</text>
<text x="78" y="453.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Registrá la escena antes de atribuir una causa.</text>
</g>
<g id="item-1" aria-label="Interpretación e incertidumbre" data-row-bottom="696.36">
<path d="M52 512.48 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="555.48" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Interpretación e incertidumbre</text>
<text x="78" y="599.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Qué explicación proponemos y qué falta saber.</text>
<text x="78" y="645.28" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La interpretación es una hipótesis, no el hecho observado.</text>
</g>
<g id="item-2" aria-label="Contraste" data-row-bottom="888.24">
<path d="M52 704.36 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="747.36" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Contraste</text>
<text x="78" y="791.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Otras personas, otros rastros y nuevos episodios.</text>
<text x="78" y="837.16" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Buscá qué confirma o contradice esa interpretación.</text>
</g>
<g id="item-3" aria-label="Función y consecuencia" data-row-bottom="1080.12">
<path d="M52 896.24 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="939.24" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Función y consecuencia</text>
<text x="78" y="983.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Para qué sirve la práctica y qué efectos produce.</text>
<text x="78" y="1029.04" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Algo incómodo puede estar protegiendo una condición necesaria.</text>
</g>
<g id="item-4" aria-label="Decisión" data-row-bottom="1272.0">
<path d="M52 1088.12 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1131.12" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Decisión</text>
<text x="78" y="1175.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Conservar, cambiar o hacer una prueba.</text>
<text x="78" y="1220.9199999999998" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Volvé a observar el resultado de esa decisión.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 416.54 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 608.4200000000001 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 800.3 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 992.18 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-4-decision" d="M1148 1184.06 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Pregunta de control">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Pregunta de control</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿Otra persona puede distinguir en el registro qué vimos y qué estamos</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">suponiendo?</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>