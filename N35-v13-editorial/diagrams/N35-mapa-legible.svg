<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Cambiar el recorrido, no el argumento</title><desc id="desc">Cada audiencia necesita una entrada diferente a la misma intervención. ¿La otra persona puede justificar qué conservaría y qué cambiaría en otra situación? Repetir una frase no demuestra que pueda intervenir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Cambiar el recorrido, no el argumento">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N35">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N35 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Cambiar el recorrido, no el argumento</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cada audiencia necesita una entrada diferente a la misma intervención.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Argumento que se conserva" data-row-bottom="538.5">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Argumento que se</text>
<text x="78" y="391.9" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">conserva</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Afirmación, evidencia, razón, límite,</text>
<text x="530" y="379.4" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">objeción y revisión.</text>
<text x="530" y="420.8" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">La tesis del caso mantiene un alcance</text>
<text x="530" y="456.2" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">asistido y una salida.</text>
</g>
<g id="item-1" aria-label="Recorridos por audiencia" data-row-bottom="783.0">
<path d="M52 546.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="590.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Recorridos por</text>
<text x="78" y="636.4" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">audiencia</text>
<text x="530" y="588.5" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Dirección: recursos y riesgo.</text>
<text x="530" y="623.9" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Tecnología: reconstrucción.</text>
<text x="530" y="665.3" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Operaciones: actuar y reparar.</text>
<text x="530" y="700.6999999999999" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Comercial: promesa sostenible.</text>
</g>
<g id="item-2" aria-label="Personas afectadas" data-row-bottom="1027.5">
<path d="M52 791.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="835.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Personas afectadas</text>
<text x="530" y="833.0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Entender la consecuencia y poder</text>
<text x="530" y="868.4" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">objetarla.</text>
<text x="530" y="909.8" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Una objeción debe reabrir la afirmación</text>
<text x="530" y="945.1999999999999" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">que pone en duda.</text>
</g>
<g id="item-3" aria-label="Transferencia" data-row-bottom="1272.0">
<path d="M52 1035.5 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1079.5" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Transferencia</text>
<text x="530" y="1077.5" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Explicar el criterio en un caso nuevo.</text>
<text x="530" y="1118.9" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">Actuar, detener o reparar sin copiar la</text>
<text x="530" y="1154.3000000000002" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#202020">solución anterior.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 424.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 668.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 913.25 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 1157.75 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="Prueba de comprensión">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Prueba de comprensión</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿La otra persona puede justificar qué conservaría y qué cambiaría en</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">otra situación? Repetir una frase no demuestra que pueda intervenir.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>