  <g id="layer-design"><text class="meta" x="940" y="805" fill="#6f8e00">03</text><text class="meta" x="990" y="805" fill="#666762">DISEÑO Y ARQUITECTURA</text><circle cx="1325" cy="799" r="9" fill="none" stroke="#242522" stroke-width="2"/><text class="label" x="1347" y="805" fill="#242522">UML</text><circle cx="1450" cy="799" r="7" fill="#7c7f78"/><text class="label" x="1470" y="805" fill="#666762">C4</text><path d="M940 840 H1620" class="line" fill="none"/></g>
  <g id="concept-detail"><text class="meta" x="940" y="890" fill="#6f8e00">CONCEPTO CENTRAL · EXPERIENCIA Y PERSONAS</text><text class="title" x="940" y="940" fill="#242522">Gestión de stakeholders</text><text class="body" x="940" y="978" fill="#666762">Identifica quién decide, quién hace el trabajo, quién recibe el efecto</text><text class="body" x="940" y="1008" fill="#666762">y quién queda sin voz.</text></g>
</svg>
