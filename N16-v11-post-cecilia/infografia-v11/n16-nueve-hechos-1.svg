    <text x="205" y="726" fill="#5d605a" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle">titular y contacto</text>
    <text x="367" y="547" fill="#5d605a" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">1 : N</text>
    <circle cx="287" cy="568" r="8" fill="#f4f2ec" stroke="#555852" stroke-width="3"/>
