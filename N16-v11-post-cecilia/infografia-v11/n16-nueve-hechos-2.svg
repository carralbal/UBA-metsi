<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1680" width="1200" height="1680" role="img" aria-labelledby="title desc">
  <title id="title">N16 · Nueve hechos · 2 de 2: comunicación y cierre</title><desc id="desc">Modelo conceptual del caso ficticio con reparación por episodio y política P1: el mismo trámite puede registrar una decisión o una baja. Resolver exige firma, entrega válida de esa decisión al titular y observaciones tratadas. Los intentos fallidos se conservan dentro de un episodio de reparación responsable.</desc>

