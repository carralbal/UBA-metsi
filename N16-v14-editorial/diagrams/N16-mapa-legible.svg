<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Dos modelos distintos no siempre se contradicen</title><desc id="desc">Primero hay que comparar el mismo episodio. En HH-16, proceso, estados, experiencia y tablero hablan del mismo episodio. La comparación debe mostrar qué afirmación hace cada uno.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Dos modelos distintos no siempre se contradicen">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N16">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N16 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Dos modelos distintos no siempre se</text>
<text x="52" y="185.5" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">contradicen</text>
<text x="52" y="263.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Primero hay que comparar el mismo episodio.</text>
</g>
<path d="M52 308.8 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Alinear la comparación" data-row-bottom="567.6">
<circle cx="82" cy="382.8" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="383.8" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Alinear la comparación</text>
<text x="145" y="427.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Misma reserva, momento y evidencia.</text>
<text x="145" y="473.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una confirmación recibida y una limpieza terminada no son lo</text>
<text x="145" y="511.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">mismo.</text>
</g>
<path id="e-item-0-item-1" d="M82 412.8 V582.6" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Clasificar la diferencia" data-row-bottom="802.4000000000001">
<circle cx="82" cy="617.6" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="627.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="618.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Clasificar la diferencia</text>
<text x="145" y="662.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Distinto propósito, error, desfase temporal o tensión abierta.</text>
<text x="145" y="708.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No corregir un modelo sólo porque no se parece al otro.</text>
</g>
<path id="e-item-1-item-2" d="M82 647.6 V817.4000000000001" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Asignar un tratamiento" data-row-bottom="1037.2">
<circle cx="82" cy="852.4000000000001" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="862.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="853.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Asignar un tratamiento</text>
<text x="145" y="897.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Corregir, investigar, decidir o aceptar un riesgo explícito.</text>
<text x="145" y="943.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cada opción exige una razón diferente.</text>
</g>
<path id="e-item-2-item-3" d="M82 882.4000000000001 V1052.2" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Cerrar con evidencia" data-row-bottom="1272.0">
<circle cx="82" cy="1087.2" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1097.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="1088.2" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Cerrar con evidencia</text>
<text x="145" y="1132.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Responsable, plazo y efecto comprobable.</text>
<text x="145" y="1178.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Actualizar las representaciones que dependían de la diferencia.</text>
</g>
<g id="decision" aria-label="La coherencia se prueba">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">La coherencia se prueba</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">En HH-16, proceso, estados, experiencia y tablero hablan del mismo</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">episodio. La comparación debe mostrar qué afirmación hace cada uno.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>