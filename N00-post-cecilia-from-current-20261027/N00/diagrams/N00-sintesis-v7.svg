<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" role="img" aria-labelledby="N00-summary-title N00-summary-desc"><title id="N00-summary-title">N00: del concepto al producto</title><desc id="N00-summary-desc">Preparar: Reconstruí la tesis y elegí un fragmento que cambie tu mirada. → Situar: Formulá una hipótesis con una cita de HH-00 y una evidencia que podría debilitarla. → Contrastar: Llevá una pregunta al encuentro y compará razones, sin buscar repetir la resolución de Martina. → Revisar: Guardá qué pensabas, qué sostenés ahora y qué evidencia te haría cambiar otra vez.</desc><rect x="0" y="0" width="640" height="860" fill="#fafaf8"/><text x="20" y="27" fill="#171917" font-family="Avenir" font-size="13" font-weight="600">RECORRIDO DE SÍNTESIS · N00</text><rect x="20" y="55" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="55" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="83" r="13" fill="#171917"/><text x="43" y="88" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">1</text><text x="73" y="87" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Preparar</text><text x="39" y="111" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Reconstruí la tesis y elegí un fragmento que cambie tu mirada.</text><text x="310" y="213.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="218.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="218.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="246.0" r="13" fill="#171917"/><text x="43" y="251.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">2</text><text x="73" y="250.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Situar</text><text x="39" y="274.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Formulá una hipótesis con una cita de HH-00 y una evidencia que</text><text x="39" y="293.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">podría debilitarla.</text><text x="310" y="376.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="381.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="381.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="409.0" r="13" fill="#171917"/><text x="43" y="414.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">3</text><text x="73" y="413.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Contrastar</text><text x="39" y="437.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Llevá una pregunta al encuentro y compará razones, sin buscar</text><text x="39" y="456.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">repetir la resolución de Martina.</text><text x="310" y="539.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="544.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="544.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="572.0" r="13" fill="#171917"/><text x="43" y="577.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">4</text><text x="73" y="576.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Revisar</text><text x="39" y="600.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Guardá qué pensabas, qué sostenés ahora y qué evidencia te haría</text><text x="39" y="619.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">cambiar otra vez.</text><rect x="20" y="727" width="600" height="110" fill="#171917"/><text x="39" y="750" fill="#cfff00" font-family="Avenir" font-size="13" font-weight="600">PRODUCTO PARA EL ENCUENTRO</text><text x="39" y="778" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">Una nota de una página: tesis propia, fragmento marcado, hipótesis</text><text x="39" y="800" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">sobre HH-00 con cita, evidencia que podría debilitarla y pregunta</text><text x="39" y="822" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">para el encuentro.</text></svg>