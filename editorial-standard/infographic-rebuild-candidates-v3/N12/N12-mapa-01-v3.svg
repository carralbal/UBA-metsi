<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">Lo pedido, lo ocurrido y lo vigente no son lo mismo</title><desc id="desc">Una transición defendible separa el comando, el evento y el estado, y hace visibles la autoridad, la evidencia, el tiempo y la reparación que conectan esas representaciones. La composición utiliza la topología split para relacionar seis elementos del argumento.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4D4D4D"/></marker></defs><rect width="1800" height="1100" fill="#F6F4EE"/><rect x="42" y="34" width="1716" height="1024" rx="18" fill="none" stroke="#CCCCCC" stroke-width="2"/><g id="header"><path d="M 82 55 H 222 L 207 76 H 67 Z" fill="#CFFF00"/><text x="250.0" y="74.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#272525" text-anchor="start"><tspan x="250.0" dy="0.0">N12 · MAPA CONCEPTUAL</tspan></text><text x="90.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#272525" text-anchor="start"><tspan x="90.0" dy="0.0">Lo pedido, lo ocurrido y lo vigente no son lo mismo</tspan></text><text x="90.0" y="208.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">Una transición defendible separa el comando, el evento y el estado, y hace visibles la autoridad, la evidencia, el</tspan><tspan x="90.0" dy="26.8">tiempo y la reparación que conectan esas representaciones.</tspan></text><path d="M 90 253.0 H 1710" stroke="#CCCCCC" stroke-width="2"/></g><g id="connectors"><path d="M 410 400 H 650" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 410 720 H 650" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 970 490 H 1230" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 970 720 H 1230" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 810 540 V 650" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1390 500 V 650" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/><path d="M 590 275 V 865" stroke="#CFFF00" stroke-width="14"/></g><g id="objects"><g id="n1"><rect x="90.0" y="330.0" width="320.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="108.0" y="356.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="108.0" dy="0.0">01</tspan></text><text x="112.0" y="385.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="112.0" dy="0.0">Estado previo: qué se</tspan><tspan x="112.0" dy="28.1">considera vigente</tspan></text><circle cx="400.0" cy="340.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n2"><rect x="90.0" y="650.0" width="320.0" height="150.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="108.0" y="676.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="108.0" dy="0.0">02</tspan></text><text x="112.0" y="705.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="112.0" dy="0.0">Autoridad: quién puede</tspan><tspan x="112.0" dy="28.1">aceptar y asumir</tspan><tspan x="112.0" dy="28.1">consecuencias</tspan></text><circle cx="400.0" cy="660.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n3"><rect x="650.0" y="420.0" width="320.0" height="150.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="668.0" y="446.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="668.0" dy="0.0">03</tspan></text><text x="672.0" y="475.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="672.0" dy="0.0">Regla de resultado:</tspan><tspan x="672.0" dy="28.1">aceptar, rechazar,</tspan><tspan x="672.0" dy="28.1">esperar o escalar</tspan></text><circle cx="960.0" cy="430.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n4"><rect x="650.0" y="650.0" width="320.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="668.0" y="676.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="668.0" dy="0.0">04</tspan></text><text x="672.0" y="705.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="672.0" dy="0.0">Evento: afirma qué</tspan><tspan x="672.0" dy="28.1">ocurrió y conserva la</tspan><tspan x="672.0" dy="28.1">historia</tspan></text><circle cx="960.0" cy="660.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n5"><rect x="1230.0" y="330.0" width="320.0" height="150.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="1248.0" y="356.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1248.0" dy="0.0">05</tspan></text><text x="1252.0" y="385.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1252.0" dy="0.0">Estado: muestra qué se</tspan><tspan x="1252.0" dy="28.1">considera vigente para</tspan><tspan x="1252.0" dy="28.1">una audiencia</tspan></text><circle cx="1540.0" cy="340.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n6"><rect x="1230.0" y="650.0" width="320.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1248.0" y="676.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1248.0" dy="0.0">06</tspan></text><text x="1252.0" y="705.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1252.0" dy="0.0">Limpieza terminada no</tspan><tspan x="1252.0" dy="28.1">equivale a habitación</tspan><tspan x="1252.0" dy="28.1">entregable</tspan></text><circle cx="1540.0" cy="660.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><text x="595.0" y="890.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#272525" text-anchor="start"><tspan x="595.0" dy="0.0">EVENTO</tspan></text><text x="975.0" y="890.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#272525" text-anchor="start"><tspan x="975.0" dy="0.0">ESTADO Y AUTORIDAD</tspan></text></g><g id="footer"><path d="M 90 1000 H 1710" stroke="#CCCCCC" stroke-width="2"/><text x="90.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">METSI · LA FORMA VISUAL RESPONDE AL ARGUMENTO</tspan></text><text x="1710.0" y="1035.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="end"><tspan x="1710.0" dy="0.0">SPLIT</tspan></text></g></svg>
