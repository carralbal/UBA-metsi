<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N33, el uso conserva identidad aunque cambie el producto</title>
  <desc id="desc">El registro vivo HH-33 muestra un producto cuyo nombre no cambia mientras se reemplazan el modelo, las fuentes y los permisos. La entrada de gobierno vincula propósito, población, responsable, versión, procedencia, proveedor, evaluación, monitoreo, incidentes y retiro. Tres disparadores reabren evidencia y autoridad. Un incidente recorre contención, explicación, reparación y cambio, y la salida exige revocar accesos, sostener continuidad y preservar evidencia legítima.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:44px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.metric{font-size:34px}.rule{stroke:#A8AAA6;stroke-width:2}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}.pale{fill:#E4E6E3;stroke:#777A76;stroke-width:2}.soft{fill:#F1F2EF;stroke:#A8AAA6;stroke-width:2}.arrow{fill:none;stroke:#737673;stroke-width:3}.volt{fill:#CFFF00;stroke:#202020;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N33 · REGISTRO VIVO DE GOBIERNO</text>
  <text x="68" y="155" class="serif title">El uso conserva identidad aunque cambie el producto</text><text x="70" y="196" class="sans subtitle">Una aprobación sólo sigue vigente mientras su configuración sociotécnica puede reconstruirse.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Cambios silenciosos sobre el mismo nombre">
    <text x="72" y="270" class="sans section">HH-33 · EL NOMBRE COMERCIAL NO CAMBIÓ, EL SISTEMA SÍ</text>
    <g aria-label="Nombre estable"><rect x="72" y="302" width="1056" height="76" class="soft"/><text x="104" y="334" class="sans number">IDENTIDAD DECLARADA</text><text x="358" y="338" class="serif metric">asistente de reservas</text><text x="922" y="336" class="sans small">misma licencia · misma acta</text></g>
    <g aria-label="Modelo reemplazado"><rect x="72" y="396" width="328" height="118" class="pale"/><text x="104" y="432" class="sans number">MODELO</text><text x="104" y="468" class="sans label">versión reemplazada</text><text x="104" y="496" class="sans body">sin puerta común</text></g>
    <g aria-label="Fuentes ampliadas"><rect x="436" y="396" width="328" height="118" class="outline"/><text x="468" y="432" class="sans number">FUENTES</text><text x="468" y="468" class="sans label">promoción agregada</text><text x="468" y="496" class="sans body">contradice operación</text><circle cx="730" cy="428" r="9" class="volt"/></g>
    <g aria-label="Permiso ampliado"><rect x="800" y="396" width="328" height="118" class="pale"/><text x="832" y="432" class="sans number">PERMISOS</text><text x="832" y="468" class="sans label">inventario consultable</text><text x="832" y="496" class="sans body">nueva consecuencia</text></g>
  </g>
  <path d="M600 516 V554" class="arrow" marker-end="url(#arrow)"/>

  <g aria-label="Entrada viva de gobierno">
    <text x="72" y="588" class="sans section">UNA ENTRADA POR USO VINCULA DECISIONES QUE ANTES ESTABAN DISPERSAS</text>
    <rect x="72" y="620" width="1056" height="396" class="outline"/>
    <g aria-label="Propósito y población"><rect x="96" y="648" width="490" height="98" class="soft"/><text x="124" y="680" class="sans number">01 · PROPÓSITO Y POBLACIÓN</text><text x="124" y="716" class="sans label">tarea, personas, consecuencia y límite</text></g>
    <g aria-label="Autoridad y riesgo"><rect x="614" y="648" width="490" height="98" class="pale"/><text x="642" y="680" class="sans number">02 · AUTORIDAD Y RIESGO</text><text x="642" y="716" class="sans label">quién puede limitar, suspender y reparar</text></g>
    <g aria-label="Versión y procedencia"><rect x="96" y="768" width="490" height="98" class="pale"/><text x="124" y="800" class="sans number">03 · VERSIÓN Y PROCEDENCIA</text><text x="124" y="836" class="sans label">modelo, fuentes, datos y transformaciones</text></g>
    <g aria-label="Proveedor y cambio"><rect x="614" y="768" width="490" height="98" class="soft"/><text x="642" y="800" class="sans number">04 · PROVEEDOR Y CAMBIO</text><text x="642" y="836" class="sans label">aviso, evidencia, continuidad y salida</text></g>
    <g aria-label="Evaluación y monitoreo"><rect x="96" y="888" width="490" height="98" class="soft"/><text x="124" y="920" class="sans number">05 · EVALUACIÓN Y MONITOREO</text><text x="124" y="956" class="sans label">cobertura, daño, deriva y umbral</text></g>
    <g aria-label="Incidente y retiro"><rect x="614" y="888" width="490" height="98" class="pale"/><text x="642" y="920" class="sans number">06 · INCIDENTE Y RETIRO</text><text x="642" y="956" class="sans label">contención, reparación y revocación</text></g>
  </g>
  <path d="M600 1018 V1056" class="arrow" marker-end="url(#arrow)"/>

  <g aria-label="Disparadores de revisión">
    <text x="72" y="1090" class="sans section">TRES DISPARADORES REABREN EVIDENCIA Y PERMISO</text>
    <g aria-label="Cambio material"><rect x="72" y="1122" width="328" height="112" class="outline"/><text x="104" y="1158" class="sans number">CAMBIO MATERIAL</text><text x="104" y="1193" class="sans label">fuente · versión · herramienta</text><text x="104" y="1220" class="sans small">volver a probar reclamos afectados</text></g>
    <g aria-label="Incidente"><rect x="436" y="1122" width="328" height="112" class="pale"/><text x="468" y="1158" class="sans number">INCIDENTE</text><text x="468" y="1193" class="sans label">daño o pérdida de control</text><text x="468" y="1220" class="sans small">contener antes de clasificar</text><circle cx="730" cy="1154" r="9" class="volt"/></g>
    <g aria-label="Evidencia vencida"><rect x="800" y="1122" width="328" height="112" class="outline"/><text x="832" y="1158" class="sans number">EVIDENCIA VENCIDA</text><text x="832" y="1193" class="sans label">nueva población o contexto</text><text x="832" y="1220" class="sans small">reducir alcance hasta actualizar</text></g>
  </g>

  <g aria-label="Respuesta y retiro">
    <path d="M236 1236 V1282" class="arrow" marker-end="url(#arrow)"/><path d="M600 1236 V1282" class="arrow" marker-end="url(#arrow)"/><path d="M964 1236 V1282" class="arrow" marker-end="url(#arrow)"/>
    <rect x="72" y="1298" width="696" height="190" class="pale"/><text x="104" y="1336" class="sans number">RECORRIDO DEL INCIDENTE</text>
    <g aria-label="Contener"><circle cx="132" cy="1390" r="25" class="volt"/><text x="132" y="1396" class="sans number" text-anchor="middle">01</text><text x="102" y="1440" class="sans label">contener</text></g><path d="M162 1390 H240" class="arrow" marker-end="url(#arrow)"/>
    <g aria-label="Explicar"><circle cx="278" cy="1390" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="278" y="1396" class="sans number" text-anchor="middle">02</text><text x="248" y="1440" class="sans label">explicar</text></g><path d="M308 1390 H386" class="arrow" marker-end="url(#arrow)"/>
    <g aria-label="Reparar"><circle cx="424" cy="1390" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="424" y="1396" class="sans number" text-anchor="middle">03</text><text x="394" y="1440" class="sans label">reparar</text></g><path d="M454 1390 H532" class="arrow" marker-end="url(#arrow)"/>
    <g aria-label="Cambiar sistema"><circle cx="570" cy="1390" r="25" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="570" y="1396" class="sans number" text-anchor="middle">04</text><text x="538" y="1440" class="sans label">cambiar</text><text x="538" y="1466" class="sans small">y volver a probar</text></g>
    <g aria-label="Salida verificable"><rect x="796" y="1298" width="332" height="190" class="outline"/><text x="828" y="1336" class="sans number">SALIDA VERIFICABLE</text><text x="828" y="1374" class="sans label">revocar accesos</text><text x="828" y="1406" class="sans label">sostener continuidad</text><text x="828" y="1438" class="sans label">preservar evidencia legítima</text><text x="828" y="1470" class="sans label">eliminar dependencias residuales</text></g>
    <text x="600" y="1530" class="sans small" text-anchor="middle">el gobierno existe cuando el registro modifica una decisión, un permiso, un recurso o una reparación</text>
  </g>
</svg>
