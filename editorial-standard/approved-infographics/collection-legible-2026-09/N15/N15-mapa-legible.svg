<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">La pregunta elige el dibujo</title><desc id="desc">Cada representación permite ver unas relaciones y deja otras afuera. Usá los mismos identificadores de reserva, habitación y episodio. ¿La audiencia puede decidir con la vista sin que su autor la traduzca?</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="La pregunta elige el dibujo">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N15">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N15 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">La pregunta elige el dibujo</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Cada representación permite ver unas relaciones y deja otras afuera.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="¿Dónde esperamos?" data-row-bottom="489.6">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">¿Dónde esperamos?</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Vista de proceso.</text>
<text x="530" y="383.04" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Seguir trabajo, colas y traspasos de</text>
<text x="530" y="416.08000000000004" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">responsabilidad.</text>
</g>
<g id="item-1" aria-label="¿Qué está confirmado?" data-row-bottom="685.2">
<path d="M52 497.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="541.6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">¿Qué está confirmado?</text>
<text x="530" y="539.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Vista de estados.</text>
<text x="530" y="578.64" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Distinguir solicitudes, hechos y</text>
<text x="530" y="611.68" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">condiciones vigentes.</text>
</g>
<g id="item-2" aria-label="¿De qué dependemos?" data-row-bottom="880.8000000000001">
<path d="M52 693.2 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="737.2" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">¿De qué dependemos?</text>
<text x="530" y="735.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Vista de arquitectura.</text>
<text x="530" y="774.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Mostrar componentes, intercambios y</text>
<text x="530" y="807.28" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">restricciones.</text>
</g>
<g id="item-3" aria-label="¿Quién puede decidir?" data-row-bottom="1076.3999999999999">
<path d="M52 888.8 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="932.8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">¿Quién puede decidir?</text>
<text x="530" y="930.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Vista de autoridad.</text>
<text x="530" y="969.8399999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Precisar permisos y tratamiento de</text>
<text x="530" y="1002.8799999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">excepciones.</text>
</g>
<g id="item-4" aria-label="¿Quién encuentra una barrera?" data-row-bottom="1272.0">
<path d="M52 1084.4 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1128.4" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">¿Quién encuentra una</text>
<text x="78" y="1174.3000000000002" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">barrera?</text>
<text x="530" y="1126.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Vista de experiencia.</text>
<text x="530" y="1165.44" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Reconstruir condiciones reales de uso y</text>
<text x="530" y="1198.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">consecuencias.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 399.8 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 595.4 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
