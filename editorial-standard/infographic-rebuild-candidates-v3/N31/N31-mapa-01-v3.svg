eight="800" fill="#4D4D4D" text-anchor="start"><tspan x="108.0" dy="0.0">02</tspan></text><text x="112.0" y="555.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="112.0" dy="0.0">Búsqueda</tspan></text><circle cx="420.0" cy="510.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n3"><rect x="90.0" y="730.0" width="340.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="108.0" y="756.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="108.0" dy="0.0">03</tspan></text><text x="112.0" y="785.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="112.0" dy="0.0">Predicción</tspan></text><circle cx="420.0" cy="740.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n4"><rect x="1370.0" y="270.0" width="340.0" height="150.0" rx="8" fill="#E6E6E6" stroke="#4D4D4D" stroke-width="2"/><text x="1388.0" y="296.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1388.0" dy="0.0">04</tspan></text><text x="1392.0" y="325.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1392.0" dy="0.0">Agencia</tspan></text><circle cx="1700.0" cy="280.0" r="6" fill="#CFFF00" stroke="#4D4D4D" stroke-width="1.5"/></g><g id="n5"><rect x="1370.0" y="730.0" width="340.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="2"/><text x="1388.0" y="756.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#4D4D4D" text-anchor="start"><tspan x="1388.0" dy="0.0">05</tspan></text><text x="1392.0" y="785.0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#272525" text-anchor="start"><tspan x="1392.0" dy="0.0">Alternativa sin IA</t