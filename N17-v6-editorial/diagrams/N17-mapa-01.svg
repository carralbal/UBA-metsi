<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">N17, una estrategia combina lógicas por decisión</title>
  <desc id="desc">Un encuadre inicial separa conocimiento disponible, costo del error, reversibilidad y evidencia. Cinco lógicas reciben decisiones diferentes de Hotel Horizonte: predictiva para contratos y migración, iterativa para la regla de estados, incremental para dos pisos, adaptativa para cambiar la secuencia ante señales y experimental para la confirmación anticipada. Una puerta de compromiso decide expandir, observar o interrumpir según semántica estable, reparación y autoridad de Recepción.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#747672"/></marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}
      .eyebrow{font-size:25px;font-weight:700;letter-spacing:7px}.title{font-size:56px;letter-spacing:-1.3px}.subtitle{font-size:26px;fill:#5F615E}
      .section{font-size:22px;font-weight:700;letter-spacing:4px}.label{font-size:23px;font-weight:700}.body{font-size:20px;fill:#4F514E}.small{font-size:18px;fill:#666864}.number{font-size:18px;font-weight:700;letter-spacing:3px}
      .rule{stroke:#A9ABA7;stroke-width:2}.route{fill:none;stroke:#747672;stroke-width:3;marker-end:url(#arrow)}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#F7F7F4"/><rect x="36" y="36" width="1728" height="1028" rx="20" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M72 74 H210 L196 94 H58 Z" fill="#CFFF00"/><text x="238" y="94" class="sans eyebrow">N17 · ARQUITECTURA DE DECISIONES</text>
  <text x="72" y="168" class="serif title">Una estrategia combina lógicas, no etiquetas</text><text x="74" y="212" class="sans subtitle">Cada decisión recibe el compromiso y el mecanismo de aprendizaje que puede defender.</text><line x1="72" y1="246" x2="1728" y2="246" class="rule"/>

  <text x="84" y="300" class="sans section">ANTES DE ELEGIR</text><text x="560" y="300" class="sans section">CINCO LÓGICAS EN UNA INTERVENCIÓN</text><text x="1320" y="300" class="sans section">PUERTA DE COMPROMISO</text>
  <g aria-label="Criterios de encuadre">
    <path d="M84 338 H454 L482 366 V756 H84 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><path d="M454 338 V366 H482" fill="none" stroke="#777A76" stroke-width="2.2"/>
    <text x="118" y="390" class="sans number">HH-17 · ENCUADRE</text>
    <text x="118" y="450" class="sans label">¿Qué se sabe?</text><text x="118" y="480" class="sans small">estabilidad de premisas</text>
    <line x1="118" y1="508" x2="446" y2="508" class="rule"/>
    <text x="118" y="550" class="sans label">¿Qué cuesta errar?</text><text x="118" y="580" class="sans small">daño y exposición</text>
    <line x1="118" y1="608" x2="446" y2="608" class="rule"/>
    <text x="118" y="650" class="sans label">¿Qué puede revertirse?</text><text x="118" y="680" class="sans small">técnica, operación y promesa</text>
    <text x="118" y="730" class="sans number">EVIDENCIA PARA DECIDIR</text><circle cx="482" cy="548" r="10" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
  </g>
  <path d="M502 548 H548" class="route"/>

  <g aria-label="Cinco lógicas por decisión">
    <g><rect x="564" y="338" width="650" height="78" class="outline"/><circle cx="594" cy="377" r="9" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="622" y="370" class="sans number">PREDICTIVA</text><text x="810" y="370" class="sans body">contratos · migración · ventana</text><text x="810" y="397" class="sans small">anticipar compromisos costosos de cambiar tarde</text></g>
    <g><rect x="564" y="430" width="650" height="78" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><circle cx="594" cy="469" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="622" y="462" class="sans number">ITERATIVA</text><text x="810" y="462" class="sans body">regla compartida de estados</text><text x="810" y="489" class="sans small">refinar comprensión con versiones comparables</text></g>
    <g><rect x="564" y="522" width="650" height="78" class="outline"/><circle cx="594" cy="561" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="622" y="554" class="sans number">INCREMENTAL</text><text x="810" y="554" class="sans body">capacidad completa en dos pisos</text><text x="810" y="581" class="sans small">ampliar población, no sólo componentes</text></g>
    <g><rect x="564" y="614" width="650" height="78" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><circle cx="594" cy="653" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="622" y="646" class="sans number">ADAPTATIVA</text><text x="810" y="646" class="sans body">secuencia según señales críticas</text><text x="810" y="673" class="sans small">cambiar curso con memoria y autoridad</text></g>
    <g><rect x="564" y="706" width="650" height="78" class="outline"/><circle cx="594" cy="745" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="622" y="738" class="sans number">EXPERIMENTAL</text><text x="810" y="738" class="sans body">confirmación anticipada protegida</text><text x="810" y="765" class="sans small">distinguir hipótesis con protección y reparación</text></g>
  </g>
  <path d="M1230 560 H1308" class="route"/>

  <g aria-label="Puerta de compromiso">
    <path d="M1324 338 H1706 L1730 362 V784 H1324 Z" class="outline"/><text x="1356" y="388" class="sans number">AMPLIAR SÓLO SI</text>
    <g><circle cx="1360" cy="446" r="9" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="1388" y="453" class="sans label">Semántica estable</text></g><text x="1388" y="482" class="sans small">los estados conservan significado</text>
    <g><circle cx="1360" cy="536" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1388" y="543" class="sans label">Reparación suficiente</text></g><text x="1388" y="572" class="sans small">la tasa no empeora</text>
    <g><circle cx="1360" cy="626" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1388" y="633" class="sans label">Autoridad operable</text></g><text x="1388" y="662" class="sans small">Recepción puede detener</text>
    <line x1="1356" y1="700" x2="1698" y2="700" class="rule"/><text x="1356" y="738" class="sans number">EXPANDIR · OBSERVAR</text><text x="1356" y="768" class="sans number">INTERRUMPIR</text>
  </g>

  <path d="M72 842 H1728" class="rule"/><text x="84" y="890" class="sans section">REGISTRO COMÚN A TODAS LAS LÓGICAS</text>
  <g aria-label="Registro común">
    <rect x="84" y="922" width="1640" height="72" class="outline"/><text x="116" y="966" class="sans label">PROPÓSITO</text><line x1="320" y1="938" x2="320" y2="980" class="rule"/><text x="352" y="966" class="sans label">EVIDENCIA</text><line x1="566" y1="938" x2="566" y2="980" class="rule"/><text x="598" y="966" class="sans label">AUTORIDAD</text><line x1="820" y1="938" x2="820" y2="980" class="rule"/><text x="852" y="966" class="sans label">SALIDA</text><line x1="1030" y1="938" x2="1030" y2="980" class="rule"/><text x="1062" y="966" class="sans body">qué decisión habilita, limita o revisa</text>
  </g>
  <text x="84" y="1034" class="sans small">HÍBRIDO NO SIGNIFICA COLLAGE: LA COMBINACIÓN SE JUSTIFICA POR INCERTIDUMBRE, CONSECUENCIA Y APRENDIZAJE.</text><text x="1710" y="1034" class="sans small" text-anchor="end">N17 · METSI</text>
</svg>
