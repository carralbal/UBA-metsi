<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="999" viewBox="0 0 1344 999" role="img" aria-label="Una transición defendible separa el comando, el evento y el estado, y hace visibles la autoridad, la evidencia, el tiempo y la reparación que conectan esas representaciones."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#CCCCCC"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4D4D4D"/></marker></defs><path d="M121 32 H211 L200 47 H110 Z" fill="#CFFF00"/><rect width="100%" height="100%" fill="#FFFFFF"/><text x="120.0" y="78.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start"><tspan x="120.0" dy="0.0">Lo pedido, lo ocurrido y lo vigente no</tspan><tspan x="120.0" dy="56.6">son lo mismo</tspan></text><path d="M 626.0 326.3 L 718.0 326.3" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 718.0 326.3 H 672.0 V 566.1 H 626.0" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 626.0 566.1 L 718.0 566.1" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 718.0 566.1 H 672.0 V 805.9 H 626.0" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 626.0 805.9 L 718.0 805.9" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="120.0" y="210.6" width="506.0" height="231.4" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="244.6" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">01</tspan></text><text x="144.0" y="285.6" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Estado previo: qué se</tspan><tspan x="144.0" dy="43.2">considera vigente</tspan></text><rect x="718.0" y="210.6" width="506.0" height="231.4" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="742.0" y="244.6" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">02</tspan></text><text x="742.0" y="285.6" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">Autoridad: quién puede</tspan><tspan x="742.0" dy="43.2">aceptar y asumir</tspan><tspan x="742.0" dy="43.2">consecuencias</tspan></text><rect x="120.0" y="472.0" width="506.0" height="188.2" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="506.0" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">03</tspan></text><text x="144.0" y="547.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Regla de resultado: aceptar,</tspan><tspan x="144.0" dy="43.2">rechazar, esperar o escalar</tspan></text><rect x="718.0" y="472.0" width="506.0" height="188.2" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="742.0" y="506.0" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">04</tspan></text><text x="742.0" y="547.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">Evento: afirma qué ocurrió y</tspan><tspan x="742.0" dy="43.2">conserva la historia</tspan></text><rect x="120.0" y="690.2" width="506.0" height="231.4" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="724.2" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">05</tspan></text><text x="144.0" y="765.2" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Estado: muestra qué se</tspan><tspan x="144.0" dy="43.2">considera vigente para una</tspan><tspan x="144.0" dy="43.2">audiencia</tspan></text><rect x="718.0" y="690.2" width="506.0" height="231.4" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="742.0" y="724.2" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">06</tspan></text><text x="742.0" y="765.2" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">Limpieza terminada no</tspan><tspan x="742.0" dy="43.2">equivale a habitación</tspan><tspan x="742.0" dy="43.2">entregable</tspan></text></svg>
