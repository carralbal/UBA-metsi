<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Un dato no habla por sí solo</title><desc id="desc">Para usarlo como evidencia hay que poder reconstruir qué permite afirmar. Las demoras por canal permiten revisar una integración. No prueban, por sí solas, que todos los terceros sean la causa.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Un dato no habla por sí solo">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N11">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N11 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Un dato no habla por sí solo</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Para usarlo como evidencia hay que poder reconstruir qué permite afirmar.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Afirmación" data-row-bottom="620.0">
<path d="M52 302.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="346.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Afirmación</text>
<text x="530" y="344.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Delimitar qué se sostiene.</text>
<text x="530" y="390.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Sobre qué fenómeno, población y</text>
<text x="530" y="430.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">período estamos hablando.</text>
</g>
<g id="item-1" aria-label="Rastro" data-row-bottom="946.0">
<path d="M52 628.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="672.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Rastro</text>
<text x="530" y="670.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Conservar cómo se obtuvo y</text>
<text x="530" y="710.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">transformó el dato.</text>
<text x="530" y="756.24" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Fuente, registros, operaciones</text>
<text x="530" y="796.36" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">realizadas y faltantes.</text>
</g>
<g id="item-2" aria-label="Límite" data-row-bottom="1272.0">
<path d="M52 954.0 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="998.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#202020">Límite</text>
<text x="530" y="996.0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Explicitar hasta dónde sirve.</text>
<text x="530" y="1042.12" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">Incertidumbre, condiciones de uso y</text>
<text x="530" y="1082.2399999999998" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#202020">señales para revisar.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 465.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 791.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 1117.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="¿Alcanza para esta decisión?">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">¿Alcanza para esta decisión?</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Las demoras por canal permiten revisar una integración. No prueban, por</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">sí solas, que todos los terceros sean la causa.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>