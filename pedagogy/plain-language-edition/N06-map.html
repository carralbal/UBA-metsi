<figure class="edition-map native-flow" aria-labelledby="n06-map-title">
  <header><span>METSI · N06 · MAPA DE DECISIÓN</span><h2 id="n06-map-title">Investigar para decidir mejor</h2><p>La pregunta no es cuánto sabemos, sino qué necesitamos averiguar antes de comprometernos.</p></header>
  <ol class="evidence-flow">
    <li><b>01</b><div><h3>Nombrar la decisión</h3><p>¿Qué vamos a hacer si aparece una respuesta u otra?</p></div></li>
    <li><b>02</b><div><h3>Comparar explicaciones posibles</h3><p>No dar por cierta la primera causa que se nos ocurre.</p></div></li>
    <li><b>03</b><div><h3>Elegir qué observar o probar</h3><p>Buscar evidencia que permita distinguir esas explicaciones.</p></div></li>
    <li><b>04</b><div><h3>Revisar si alcanza</h3><p>Comparar lo encontrado con el riesgo de equivocarnos y lo que todavía falta saber.</p></div></li>
    <li><b>05</b><div><h3>Decidir el próximo compromiso</h3><p>Explicar qué podemos hacer ahora y qué observación nos haría revisar la decisión.</p></div></li>
  </ol>
  <aside class="evidence-criteria"><h3>Una investigación útil cumple cuatro condiciones</h3><p>Responde a la decisión · distingue explicaciones · llega a tiempo · justifica su costo.</p></aside>
  <footer><h3>No siempre corresponde avanzar</h3><p>Podemos continuar, modificar el plan, detenerlo o investigar algo más.</p></footer>
</figure>
