<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">N15, la pregunta elige la vista</title>
  <desc id="desc">Una pregunta sobre la validación previa de Hotel Horizonte atraviesa una puerta de selección que evalúa decisión, audiencia, evidencia, costo y vigencia. La salida no es un modelo total sino una cartera mínima de cinco vistas: proceso para localizar espera, estados para definir confirmación, arquitectura para localizar dependencia, autoridad para decidir excepciones y experiencia para reconocer barreras. Las vistas comparten identidades y fuentes, pero cada una conserva un límite y una pregunta propios.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#747672"/></marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}
      .eyebrow{font-size:25px;font-weight:700;letter-spacing:7px}.title{font-size:58px;letter-spacing:-1.5px}.subtitle{font-size:27px;fill:#5F615E}
      .section{font-size:23px;font-weight:700;letter-spacing:4px}.label{font-size:27px;font-weight:700}.body{font-size:22px;fill:#4F514E}.small{font-size:19px;fill:#666864}.number{font-size:20px;font-weight:700;letter-spacing:3px}
      .rule{stroke:#A9ABA7;stroke-width:2}.route{fill:none;stroke:#747672;stroke-width:3;marker-end:url(#arrow)}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#F7F7F4"/><rect x="36" y="36" width="1728" height="1028" rx="20" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M72 74 H210 L196 94 H58 Z" fill="#CFFF00"/><text x="238" y="94" class="sans eyebrow">N15 · PUERTA DE SELECCIÓN</text>
  <text x="72" y="170" class="serif title">La pregunta elige la vista</text><text x="74" y="214" class="sans subtitle">Una cartera mínima responde decisiones distintas sin fabricar un modelo total.</text><line x1="72" y1="248" x2="1728" y2="248" class="rule"/>

  <text x="84" y="306" class="sans section">PREGUNTA Y DECISIÓN</text><text x="684" y="306" class="sans section">CRITERIOS DE SELECCIÓN</text><text x="1202" y="306" class="sans section">CARTERA MÍNIMA</text>
  <g aria-label="Pregunta de Hotel Horizonte">
    <path d="M84 342 H584 L616 374 V724 H84 Z" class="outline"/><path d="M84 342 H290 L274 364 H68 Z" fill="#CFFF00"/>
    <text x="118" y="402" class="sans number">HH-15</text><text x="118" y="456" class="serif" style="font-size:35px">¿Puede la validación previa</text><text x="118" y="500" class="serif" style="font-size:35px">reducir dobles asignaciones</text><text x="118" y="544" class="serif" style="font-size:35px">sin excluir ni prometer antes</text><text x="118" y="588" class="serif" style="font-size:35px">de que el hotel pueda cumplir?</text>
    <line x1="118" y1="632" x2="574" y2="632" class="rule"/><text x="118" y="674" class="sans body">Decisión: probar una opción asistida,</text><text x="118" y="706" class="sans body">con ruta de excepción y revisión.</text><circle cx="616" cy="538" r="10" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
  </g>
  <path d="M636 538 H692" class="route"/>

  <g aria-label="Puerta de criterios">
    <path d="M708 342 H1110 L1142 374 V724 H708 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><path d="M1110 342 V374 H1142" fill="none" stroke="#777A76" stroke-width="2.2"/>
    <g aria-label="Criterio de decisión"><text x="744" y="404" class="sans number">01</text><text x="810" y="406" class="sans label">DECISIÓN</text><text x="810" y="438" class="sans small">qué debe poder resolverse</text></g>
    <line x1="744" y1="466" x2="1102" y2="466" class="rule"/>
    <g aria-label="Criterio de audiencia"><text x="744" y="508" class="sans number">02</text><text x="810" y="510" class="sans label">AUDIENCIA</text><text x="810" y="542" class="sans small">quién interpreta, decide y mantiene</text></g>
    <line x1="744" y1="570" x2="1102" y2="570" class="rule"/>
    <g aria-label="Criterio de evidencia"><text x="744" y="612" class="sans number">03</text><text x="810" y="614" class="sans label">EVIDENCIA</text><text x="810" y="646" class="sans small">qué sostiene el recorte y sus límites</text></g>
    <g aria-label="Criterio de costo y vigencia"><path d="M744 674 H1102" class="rule"/><text x="744" y="712" class="sans number">04 · COSTO + VIGENCIA</text></g>
    <circle cx="1142" cy="538" r="10" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
  </g>
  <path d="M1162 538 H1218" class="route"/>

  <g aria-label="Cinco vistas seleccionadas">
    <g aria-label="Vista de proceso"><line x1="1234" y1="372" x2="1706" y2="372" stroke="#777A76" stroke-width="3"/><circle cx="1234" cy="372" r="9" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="1262" y="362" class="sans number">PROCESO</text><text x="1452" y="362" class="sans" style="font-size:18px">¿dónde espera el huésped?</text></g>
    <g aria-label="Vista de estados"><line x1="1234" y1="452" x2="1706" y2="452" stroke="#777A76" stroke-width="3"/><circle cx="1234" cy="452" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1262" y="442" class="sans number">ESTADOS</text><text x="1452" y="442" class="sans" style="font-size:18px">¿cuándo puede confirmarse?</text></g>
    <g aria-label="Vista de arquitectura"><line x1="1234" y1="532" x2="1706" y2="532" stroke="#777A76" stroke-width="3"/><circle cx="1234" cy="532" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1262" y="522" class="sans number">ARQUITECTURA</text><text x="1488" y="522" class="sans" style="font-size:18px">¿qué dependencia puede fallar?</text></g>
    <g aria-label="Vista de autoridad"><line x1="1234" y1="612" x2="1706" y2="612" stroke="#777A76" stroke-width="3"/><circle cx="1234" cy="612" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1262" y="602" class="sans number">AUTORIDAD</text><text x="1452" y="602" class="sans" style="font-size:18px">¿quién decide la excepción?</text></g>
    <g aria-label="Vista de experiencia"><line x1="1234" y1="692" x2="1706" y2="692" stroke="#777A76" stroke-width="3"/><circle cx="1234" cy="692" r="9" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1262" y="682" class="sans number">EXPERIENCIA</text><text x="1470" y="682" class="sans" style="font-size:18px">¿quién encuentra una barrera?</text></g>
  </g>

  <g aria-label="Vínculos de cartera">
    <line x1="72" y1="796" x2="1728" y2="796" class="rule"/><text x="84" y="842" class="sans section">COHERENCIA SIN UNIFORMIDAD</text>
    <path d="M84 874 H1280 L1304 898 V958 H84 Z" class="outline"/><text x="116" y="916" class="sans label">RESERVA · HABITACIÓN · HUÉSPED · PROMESA · ASIGNACIÓN · EXCEPCIÓN</text><text x="116" y="946" class="sans small">identidades y fuentes compartidas, límites y preguntas explícitos en cada vista</text>
    <path d="M1352 874 H1702 L1726 898 V958 H1352 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2.2"/><text x="1382" y="914" class="sans number">PRUEBA SIN AUTOR</text><text x="1382" y="946" class="sans small">¿la audiencia puede decidir?</text>
  </g>
  <text x="84" y="1024" class="sans small">SI UNA VISTA NO CAMBIA UNA DECISIÓN, NO COMUNICA ALGO NECESARIO NI REDUCE RIESGO, NO SE CONSTRUYE.</text><text x="1710" y="1024" class="sans small" text-anchor="end">N15 · METSI</text>
</svg>
