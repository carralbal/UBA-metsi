<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">El contrato real tiene cuatro capas</title><desc id="desc">Un mensaje aceptado sólo constituye un contrato defendible cuando forma, significado, tiempo y operación permiten anticipar la misma consecuencia y una reparación practicable. La composición utiliza la topología strata para relacionar seis elementos del argumento.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4D4D4D"/></marker></defs><rect width="1800" height="1100" fill="#F6F4EE"/><rect x="42" y="34" width="1716" height="1024" rx="18" fill="none" stroke="#CCCCCC" stroke-width="2"/><g id="header"><path d="M 82 55 H 222 L 207 76 H 67 Z" fill="#CFFF00"/><text x="250.0" y="74.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#272525" text-anchor="start"><tspan x="250.0" dy="0.0">N27 · MAPA CONCEPTUAL</tspan></text><text x="90.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#272525" text-anchor="start"><tspan x="90.0" dy="0.0">El contrato real tiene cuatro capas</tspan></text><text x="90.0" y="208.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D4D4D" text-anchor="start"><tspan x="90.0" dy="0.0">Un mensaje aceptado sólo constituye un contrato defendible cuando forma, significado, tiempo y operación permiten</tspan><tspan x="90.0" dy="26.8">anticipar la misma consecuencia y una reparación practicable.</tspan></text><path d="M 90 253.0 H 1710" stroke="#CCCCCC" stroke-width="2"/></g><g id="connectors"><path d="M 1090 800 H 1490" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9"/><path d="M 1125 712 H 1490" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-dasharray="7 9"/><path d="M 1160 624 H 1490" fill="none" stroke="#CCCCCC" stroke-