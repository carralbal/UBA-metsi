name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Assemble publication
        run: |
          mkdir -p public/skills
          cp site/index.html site/metsi.css site/metsi.js site/favicon.svg site/og.png site/course-manifest.json public/
          cp -R site/covers site/pdf public/
          test "$(find public/pdf -maxdepth 1 -name '*.pdf' | wc -l | tr -d ' ')" = "11"
          for pdf in public/pdf/*.pdf; do
            test "$(head -c 4 "$pdf")" = "%PDF"
            test "$(wc -c < "$pdf")" -gt 1000000
          done
          cp -R editorial-standard/. public/skills/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
