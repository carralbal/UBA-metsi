<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Pedir no es confirmar que ocurrió</title><desc id="desc">Comando, evento y estado cumplen funciones diferentes. “Limpieza terminada” no significa “lista para entregar”. También importan inspección, asignación, acceso y autorización.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Pedir no es confirmar que ocurrió">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N12">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N12 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Pedir no es confirmar que ocurrió</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Comando, evento y estado cumplen funciones diferentes.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Estado anterior" data-row-bottom="489.6">
<circle cx="82" cy="344.0" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="354.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="345.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Estado anterior</text>
<text x="145" y="389.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Qué se considera válido antes de actuar.</text>
<text x="145" y="434.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Debe poder reconocerse sin reconstrucciones informales.</text>
</g>
<path id="e-item-0-item-1" d="M82 374.0 V504.6" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Comando" data-row-bottom="685.2">
<circle cx="82" cy="539.6" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="549.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="540.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Comando</text>
<text x="145" y="584.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una solicitud de cambio.</text>
<text x="145" y="630.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Puede quedar pendiente o ser rechazada: todavía no es un hecho.</text>
</g>
<path id="e-item-1-item-2" d="M82 569.6 V700.2" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Condiciones para actuar" data-row-bottom="880.8000000000001">
<circle cx="82" cy="735.2" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="745.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="736.2" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Condiciones para actuar</text>
<text x="145" y="780.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Autoridad, reglas, evidencia y tiempo.</text>
<text x="145" y="826.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Quién puede habilitar el cambio y con qué respaldo.</text>
</g>
<path id="e-item-2-item-3" d="M82 765.2 V895.8000000000001" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Evento" data-row-bottom="1076.3999999999999">
<circle cx="82" cy="930.8" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="940.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="931.8" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Evento</text>
<text x="145" y="975.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Registro de lo que efectivamente ocurrió.</text>
<text x="145" y="1021.5999999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Conserva el hecho, no sólo la intención de producirlo.</text>
</g>
<path id="e-item-3-item-4" d="M82 960.8 V1091.3999999999999" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-4" aria-label="Estado vigente" data-row-bottom="1272.0">
<circle cx="82" cy="1126.4" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1136.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">05</text>
<text x="145" y="1127.4" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Estado vigente</text>
<text x="145" y="1171.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Qué vale después de la transición.</text>
<text x="145" y="1217.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Si hay un error, se repara sin borrar la historia.</text>
</g>
<g id="decision" aria-label="Hotel Horizonte">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Hotel Horizonte</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">“Limpieza terminada” no significa “lista para entregar”. También</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">importan inspección, asignación, acceso y autorización.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>