" dy="0.0">05</tspan></text><text x="144.0" y="808.4" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Estado ambiguo que no debe</tspan><tspan x="144.0" dy="43.2">confirmarse ni</tspan><tspan x="144.0" dy="43.2">sobrescribirse sin evidencia</tspan></text><rect x="718.0" y="733.4" width="506.0" height="231.4" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="742.0" y="767.4" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">06</tspan></text><text x="742.0" y="808.4" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="742.0" dy="0.0">Comparar agencia, PMS y</tspan><tspan x="742.0" dy="43.2">cerradura para explicar y</tspan><tspan x="742.0" dy="43.2">reparar</tspan></text></svg>
