  <g id="layer-people"><text class="meta" x="940" y="625" fill="#6f8e00">01</text><text class="meta" x="990" y="625" fill="#666762">EXPERIENCIA Y PERSONAS</text><circle cx="1325" cy="619" r="11" fill="#cfff00" stroke="#6f8e00"/><text class="label" x="1350" y="625" fill="#242522">Gestión de stakeholders</text><path d="M940 660 H1620" class="line" fill="none"/></g>
