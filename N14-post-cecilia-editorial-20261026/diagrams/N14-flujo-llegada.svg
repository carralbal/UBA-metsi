<svg xmlns="http://www.w3.org/2000/svg" width="680" height="605" viewBox="0 0 680 605" role="img" aria-labelledby="title desc"><title id="title">HH-14: una llegada en dos carriles</title><desc id="desc">Mapa informal de ocho pasos. Recepción sigue el caso; las áreas aportan preparación y acceso. Una excepción retorna a verificar condiciones antes de asignar y comprobar ingreso.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#41483d"/></marker></defs><rect width="100%" height="100%" fill="#fafaf6"/><style>text{font-family:Avenir,sans-serif;fill:#171917;font-size:17px}.title{font-size:19px;font-weight:700}.small{font-size:15px}.num{font-family:Baskerville,serif;font-size:18px;font-weight:700;fill:#cfff00}.edge{fill:none;stroke:#41483d;stroke-width:1.6;marker-end:url(#arrow)}.guide{stroke:#b9bfb0;stroke-dasharray:4 5}</style><text x="24" y="28" text-anchor="start" class="title"><tspan x="24" dy="0">Recepción</tspan></text><text x="367" y="28" text-anchor="start" class="title"><tspan x="367" dy="0">Áreas que aportan evidencia</tspan></text><path class="guide" d="M340 43 V585"/><rect x="20" y="55" width="295" height="51" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="43" cy="78" r="14" fill="#171917"/><text x="43" y="84" text-anchor="middle" class="num"><tspan x="43" dy="0">1</tspan></text><text x="67" y="79" text-anchor="start" class=""><tspan x="67" dy="0">Identificar llegada L-01</tspan></text><rect x="20" y="127" width="295" height="51" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="43" cy="150" r="14" fill="#171917"/><text x="43" y="156" text-anchor="middle" class="num"><tspan x="43" dy="0">2</tspan></text><text x="67" y="151" text-anchor="start" class=""><tspan x="67" dy="0">Consultar promesa</tspan></text><rect x="365" y="112" width="295" height="64" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="388" cy="135" r="14" fill="#171917"/><text x="388" y="141" text-anchor="middle" class="num"><tspan x="388" dy="0">3</tspan></text><text x="412" y="136" text-anchor="start" class=""><tspan x="412" dy="0">Mariela: inspección</tspan><tspan x="412" dy="22">y condiciones de unidad</tspan></text><rect x="365" y="197" width="295" height="64" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="388" cy="220" r="14" fill="#171917"/><text x="388" y="226" text-anchor="middle" class="num"><tspan x="388" dy="0">4</tspan></text><text x="412" y="221" text-anchor="start" class=""><tspan x="412" dy="0">Federico: verificar</tspan><tspan x="412" dy="22">resultado de acceso</tspan></text><rect x="20" y="293" width="295" height="63" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="43" cy="316" r="14" fill="#171917"/><text x="43" y="322" text-anchor="middle" class="num"><tspan x="43" dy="0">5</tspan></text><text x="67" y="317" text-anchor="start" class=""><tspan x="67" dy="0">Reunir resultados</tspan><tspan x="67" dy="22">del caso y su versión</tspan></text><rect x="20" y="378" width="295" height="63" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="43" cy="401" r="14" fill="#171917"/><text x="43" y="407" text-anchor="middle" class="num"><tspan x="43" dy="0">6</tspan></text><text x="67" y="402" text-anchor="start" class=""><tspan x="67" dy="0">¿Son suficientes</tspan><tspan x="67" dy="22">para esta reserva?</tspan></text><rect x="20" y="463" width="295" height="51" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="43" cy="486" r="14" fill="#171917"/><text x="43" y="492" text-anchor="middle" class="num"><tspan x="43" dy="0">7</tspan></text><text x="67" y="487" text-anchor="start" class=""><tspan x="67" dy="0">Asignar y habilitar</tspan></text><rect x="20" y="535" width="295" height="51" rx="8" fill="#fff" stroke="#b5bcae"/><circle cx="43" cy="558" r="14" fill="#171917"/><text x="43" y="564" text-anchor="middle" class="num"><tspan x="43" dy="0">8</tspan></text><text x="67" y="559" text-anchor="start" class=""><tspan x="67" dy="0">Verificar ingreso</tspan></text><rect x="365" y="375" width="295" height="104" rx="8" fill="#edf2d8" stroke="#aeb99a"/><text x="381" y="400" text-anchor="start" class=""><tspan x="381" dy="0">Falta evidencia → excepción</tspan><tspan x="381" dy="22">Responsable, próxima acción</tspan><tspan x="381" dy="22">y atención. Volver a verificar.</tspan></text><path class="edge" d="M167 106 V124"/><path class="edge" d="M315 145 H362"/><path class="edge" d="M328 145 V229 H362"/><path class="edge" d="M511 176 V185 H348 V306 H318"/><path class="edge" d="M510 261 V327 H318"/><path class="edge" d="M167 356 V375"/><path class="edge" d="M315 407 H362"/><path class="edge" d="M167 441 V460"/><path class="edge" d="M167 514 V532"/><path class="edge" d="M510 375 V349 H328 V335 H318"/><text x="177" y="457" text-anchor="start" class="small"><tspan x="177" dy="0">Sí</tspan></text><text x="40" y="228" text-anchor="start" class="small"><tspan x="40" dy="0">3 y 4 pueden avanzar</tspan><tspan x="40" dy="22">en paralelo.</tspan></text></svg>