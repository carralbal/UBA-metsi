<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Una estrategia necesita puertas de decisión</title><desc id="desc">Un hito no es sólo una fecha: debe cambiar lo que estamos autorizados a hacer. Investigar, reducir alcance, reparar o retirar. Ampliar no es la única salida posible; debe justificarse con evidencia.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Una estrategia necesita puertas de decisión">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N20">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N20 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Una estrategia necesita puertas de</text>
<text x="52" y="185.5" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">decisión</text>
<text x="52" y="263.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Un hito no es sólo una fecha: debe cambiar lo que estamos autorizados a</text>
<text x="52" y="300.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">hacer.</text>
</g>
<path d="M52 346.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Comprender" data-row-bottom="595.95">
<circle cx="82" cy="420.6" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="430.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="421.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Comprender</text>
<text x="145" y="465.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Reconstruir episodios, evidencia e hipótesis.</text>
<text x="145" y="511.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No comprometer una solución antes de sostener el encuadre.</text>
</g>
<path id="e-item-0-item-1" d="M82 450.6 V610.95" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Preparar" data-row-bottom="821.3000000000001">
<circle cx="82" cy="645.95" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="655.95" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="646.95" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Preparar</text>
<text x="145" y="690.95" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Asegurar personas, permisos y contingencia.</text>
<text x="145" y="736.75" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una prueba necesita condiciones para detenerse o reparar.</text>
</g>
<path id="e-item-1-item-2" d="M82 675.95 V836.3000000000001" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Probar" data-row-bottom="1046.6499999999999">
<circle cx="82" cy="871.3" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="881.3" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="872.3" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Probar</text>
<text x="145" y="916.3" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Observar el caso normal, la falla y la reparación.</text>
<text x="145" y="962.0999999999999" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La demostración favorable no alcanza por sí sola.</text>
</g>
<path id="e-item-2-item-3" d="M82 901.3 V1061.6499999999999" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Transferir" data-row-bottom="1272.0">
<circle cx="82" cy="1096.65" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1106.65" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="1097.65" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Transferir</text>
<text x="145" y="1141.65" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Operaciones puede sostener el uso y detenerlo.</text>
<text x="145" y="1187.45" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">El equipo no debe depender del conocimiento privado de quien</text>
<text x="145" y="1225.25" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">diseñó.</text>
</g>
<g id="decision" aria-label="Si una puerta no abre">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Si una puerta no abre</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Investigar, reducir alcance, reparar o retirar. Ampliar no es la única</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">salida posible; debe justificarse con evidencia.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>