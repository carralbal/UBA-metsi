<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">HH-10 · nueve decisiones que abren una puerta</title>
  <desc id="desc">Mapa editorial en tres bandas. La primera relaciona situación, afectados y outcome; la segunda, mecanismos rivales, evidencia y frontera; la tercera, restricciones, protecciones y condición de revisión. Las tres alimentan una puerta de suficiencia proporcional con cuatro salidas: aprobar, devolver, dividir o reformular. Las cuatro salidas conservan un hito de revisión y la evidencia nueva vuelve al encuadre.</desc>
  <defs>
    <style>
      text { font-family: Avenir, "Avenir Next", sans-serif; fill: #292826; }
      .kicker { font-size: 17px; font-weight: 750; letter-spacing: 3.2px; }
      .title { font-size: 47px; font-weight: 760; letter-spacing: -1.2px; }
      .subtitle { font-size: 20px; fill: #65635e; }
      .band-number { font-size: 14px; font-weight: 760; letter-spacing: 2.5px; }
      .band-title { font-size: 27px; font-weight: 760; letter-spacing: -.3px; }
      .band-copy { font-size: 16px; fill: #64615b; }
      .field-number { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
      .field-label { font-size: 21px; font-weight: 760; }
      .field-copy { font-size: 15px; fill: #5e5c57; }
      .rail-label { font-size: 14px; font-weight: 700; letter-spacing: 1.3px; fill: #68665f; }
      .gate-kicker { font-size: 14px; font-weight: 800; letter-spacing: 2.5px; }
      .gate-dark-kicker { font-size: 14px; font-weight: 800; letter-spacing: 2.5px; fill: #d8d3c9; }
      .gate-title { font-size: 25px; font-weight: 780; fill: #ffffff; }
      .gate-copy { font-size: 16px; fill: #e8e6df; }
      .gate-micro { font-size: 14px; fill: #cfcac0; letter-spacing: .5px; }
      .decision-number { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; }
      .decision-title { font-size: 21px; font-weight: 780; }
      .decision-copy { font-size: 15px; fill: #5b5954; }
      .footer-note { font-size: 15px; font-weight: 700; fill: #5e5b55; }
      .band { stroke: #77746d; stroke-width: 1.7; }
      .band-blue { fill: #e5edef; }
      .band-sand { fill: #efe8db; }
      .band-green { fill: #e2eadf; }
      .gate-field { fill: #ece9e1; stroke: #77746d; stroke-width: 1.7; }
      .fine { fill: none; stroke: #6e6b65; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .fine-blue { fill: none; stroke: #7897a3; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .fine-sand { fill: none; stroke: #b29458; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .fine-green { fill: none; stroke: #789171; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .rail { fill: none; stroke: #7b7871; stroke-width: 2; stroke-dasharray: 2 8; stroke-linecap: round; }
      .input-route { fill: none; stroke-width: 2.7; stroke-dasharray: 2 8; stroke-linecap: round; stroke-linejoin: round; }
      .decision-route { fill: none; stroke: #64615c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .feedback-route { fill: none; stroke: #9f884e; stroke-width: 2.2; stroke-dasharray: 2 8; stroke-linecap: round; stroke-linejoin: round; }
      .port { stroke: #55534e; stroke-width: 1.3; }
      .port-blue { fill: #a8c2cb; }
      .port-sand { fill: #cab273; }
      .port-green { fill: #acc5a6; }
      .port-dark { fill: #3a3936; }
    </style>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="2" seed="10" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="fade"><feFuncA type="table" tableValues="0 .025"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64615c"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#9f884e"/>
    </marker>
  </defs>

  <rect width="1800" height="1100" fill="#f7f5ef" filter="url(#paper)"/>
  <rect x="42" y="42" width="1716" height="1016" rx="22" fill="none" stroke="#b9b6ae" stroke-width="1.4"/>

  <g id="header">
    <text x="84" y="86" class="kicker">N10 · INSTRUMENTO DE DECISIÓN</text>
    <text x="84" y="143" class="title">HH-10 · nueve decisiones que abren una puerta</text>
    <text x="84" y="181" class="subtitle">Los campos no se completan en fila: se controlan mutuamente y limitan qué compromiso puede autorizarse.</text>
    <line x1="84" y1="208" x2="1716" y2="208" stroke="#98958e" stroke-width="1.35"/>
  </g>

  <!-- Superficies principales -->
  <g id="band-surfaces">
    <path class="band band-blue" d="M72 238H1215L1248 271V444H72Z"/>
    <path class="band band-sand" d="M72 470H1215L1248 503V676H72Z"/>
    <path class="band band-green" d="M72 702H1215L1248 735V908H72Z"/>
    <path class="gate-field" d="M1280 238H1695L1728 271V908H1280Z"/>
  </g>

  <!-- Conectores: detrás de campos y decisiones -->
  <g id="relations-behind-objects">
    <path class="rail" d="M344 407H1215"/>
    <path class="rail" d="M344 639H1215"/>
    <path class="rail" d="M344 871H1215"/>

    <path class="fine-blue" d="M395 352V407M688 352V407M981 352V407"/>
    <path class="fine-sand" d="M395 584V639M688 584V639M981 584V639"/>
    <path class="fine-green" d="M395 816V871M688 816V871M981 816V871"/>

    <path class="input-route" d="M1215 407C1250 407 1260 360 1302 360" stroke="#7897a3"/>
    <path class="input-route" d="M1215 639C1265 639 1240 410 1302 410" stroke="#b29458"/>
    <path class="input-route" d="M1215 871C1285 871 1235 460 1302 460" stroke="#789171"/>

    <path class="decision-route" d="M1508 497C1508 512 1310 504 1310 532V841"/>
    <path class="decision-route" d="M1310 567H1342" marker-end="url(#arrow-dark)"/>
    <path class="decision-route" d="M1310 657H1342" marker-end="url(#arrow-dark)"/>
    <path class="decision-route" d="M1310 747H1342" marker-end="url(#arrow-dark)"/>
    <path class="decision-route" d="M1310 837H1342" marker-end="url(#arrow-dark)"/>

    <path class="feedback-route" d="M1692 567H1712V956H946V890C946 879 957 871 973 871" marker-end="url(#arrow-feedback)"/>
    <path class="feedback-route" d="M1692 657H1712"/>
    <path class="feedback-route" d="M1692 747H1712"/>
    <path class="feedback-route" d="M1692 837H1712"/>
  </g>

  <!-- Banda 1 -->
  <g id="group-situar-el-cambio">
    <rect x="72" y="238" width="14" height="206" fill="#7897a3"/>
    <text x="106" y="272" class="band-number">BANDA 01</text>
    <text x="106" y="310" class="band-title">SITUAR EL</text>
    <text x="106" y="341" class="band-title">CAMBIO</text>
    <text x="106" y="374" class="band-copy">Qué ocurre, para quién</text>
    <text x="106" y="396" class="band-copy">y qué debería cambiar.</text>
    <text x="1000" y="428" class="rail-label">CONTROL ENTRE CAMPOS</text>

    <g id="situation">
      <path d="M358 276H400L416 292V342H358Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.8"/>
      <path d="M400 276V294H416M367 307H406M367 319H406M367 331H394" class="fine"/>
      <rect x="350" y="285" width="7" height="49" fill="#b9d0d7" stroke="#55534e" stroke-width="1.2"/>
      <text x="435" y="279" class="field-number">01</text>
      <text x="435" y="305" class="field-label">Situación</text>
      <text x="435" y="330" class="field-copy">episodios observados</text>
      <text x="435" y="350" class="field-copy">y faltantes</text>
      <circle cx="395" cy="407" r="7.5" class="port port-blue"/>
    </g>

    <g id="affected">
      <ellipse cx="665" cy="324" rx="36" ry="19" fill="#fbfaf6" stroke="#55534e" stroke-width="1.7"/>
      <circle cx="652" cy="292" r="13" fill="#d9e6e9" stroke="#55534e" stroke-width="1.7"/>
      <circle cx="680" cy="296" r="11" fill="#f0e5d2" stroke="#55534e" stroke-width="1.7"/>
      <path d="M638 325C641 309 665 306 672 324M669 325C672 313 691 312 695 327" class="fine"/>
      <text x="721" y="279" class="field-number">02</text>
      <text x="721" y="304" class="field-label">Afectados y</text>
      <text x="721" y="328" class="field-label">perspectivas</text>
      <text x="721" y="351" class="field-copy">valor, carga y voces</text>
      <circle cx="688" cy="407" r="7.5" class="port port-blue"/>
    </g>

    <g id="outcome">
      <circle cx="955" cy="311" r="35" fill="#fbfaf6" stroke="#55534e" stroke-width="1.8"/>
      <circle cx="955" cy="311" r="21" fill="none" stroke="#7897a3" stroke-width="2"/>
      <circle cx="955" cy="311" r="7" fill="#7897a3"/>
      <path d="M929 337 917 349M981 285 994 272" class="fine-blue"/>
      <path d="M986 270 997 269 995 280" fill="#7897a3"/>
      <text x="1010" y="279" class="field-number">03</text>
      <text x="1010" y="305" class="field-label">Outcome</text>
      <text x="1010" y="330" class="field-copy">cambio, población</text>
      <text x="1010" y="350" class="field-copy">y ventana</text>
      <circle cx="981" cy="407" r="7.5" class="port port-blue"/>
    </g>
    <circle cx="1215" cy="407" r="8" class="port port-blue"/>
  </g>

  <!-- Banda 2 -->
  <g id="group-sostener-el-argumento">
    <rect x="72" y="470" width="14" height="206" fill="#b29458"/>
    <text x="106" y="504" class="band-number">BANDA 02</text>
    <text x="106" y="542" class="band-title">SOSTENER EL</text>
    <text x="106" y="573" class="band-title">ARGUMENTO</text>
    <text x="106" y="606" class="band-copy">Qué podría explicarlo,</text>
    <text x="106" y="628" class="band-copy">qué lo sostiene y dónde.</text>
    <text x="1000" y="660" class="rail-label">CONTRASTE ENTRE CAMPOS</text>

    <g id="mechanisms">
      <circle cx="373" cy="541" r="12" fill="#fbfaf6" stroke="#55534e" stroke-width="1.7"/>
      <circle cx="412" cy="516" r="9" fill="#dfcfae" stroke="#55534e" stroke-width="1.5"/>
      <circle cx="417" cy="544" r="9" fill="#dce7ea" stroke="#55534e" stroke-width="1.5"/>
      <circle cx="412" cy="572" r="9" fill="#dfe8dc" stroke="#55534e" stroke-width="1.5"/>
      <path d="M385 537C394 528 398 522 403 518M385 541H408M385 546C394 555 398 564 403 569" class="fine"/>
      <text x="448" y="511" class="field-number">04</text>
      <text x="448" y="536" class="field-label">Mecanismos</text>
      <text x="448" y="560" class="field-label">rivales</text>
      <text x="448" y="583" class="field-copy">relaciones y predicciones</text>
      <circle cx="395" cy="639" r="7.5" class="port port-sand"/>
    </g>

    <g id="evidence">
      <path d="M642 538 668 526 694 538 668 550Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.6"/>
      <path d="M642 538V571L668 584V550M694 538V571L668 584" fill="#f3ede1" stroke="#55534e" stroke-width="1.6"/>
      <path d="M655 508H681V543H655Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.5"/>
      <path d="M661 519H675M661 527H675" class="fine"/>
      <rect x="703" y="542" width="25" height="25" fill="none" stroke="#8f7c4f" stroke-width="1.7" stroke-dasharray="4 4"/>
      <text x="744" y="511" class="field-number">05</text>
      <text x="744" y="536" class="field-label">Evidencia y</text>
      <text x="744" y="560" class="field-label">vacíos</text>
      <text x="744" y="583" class="field-copy">sostén, contradicción, falta</text>
      <circle cx="688" cy="639" r="7.5" class="port port-sand"/>
    </g>

    <g id="boundary">
      <path d="M934 510H977V523H993V580H934Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.6" stroke-dasharray="5 4"/>
      <circle cx="956" cy="544" r="12" fill="#dfcfae" stroke="#55534e" stroke-width="1.5"/>
      <circle cx="1007" cy="558" r="8" fill="#fbfaf6" stroke="#55534e" stroke-width="1.5"/>
      <path d="M977 544H995" class="fine-sand"/>
      <text x="1030" y="511" class="field-number">06</text>
      <text x="1030" y="536" class="field-label">Frontera</text>
      <text x="1030" y="561" class="field-copy">interior, entorno y riesgo</text>
      <text x="1030" y="581" class="field-copy">de exclusión</text>
      <circle cx="981" cy="639" r="7.5" class="port port-sand"/>
    </g>
    <circle cx="1215" cy="639" r="8" class="port port-sand"/>
  </g>

  <!-- Banda 3 -->
  <g id="group-limitar-y-reabrir">
    <rect x="72" y="702" width="14" height="206" fill="#789171"/>
    <text x="106" y="736" class="band-number">BANDA 03</text>
    <text x="106" y="774" class="band-title">LIMITAR Y</text>
    <text x="106" y="805" class="band-title">REABRIR</text>
    <text x="106" y="838" class="band-copy">Qué no debe degradarse</text>
    <text x="106" y="860" class="band-copy">y qué obliga a volver.</text>
    <text x="1000" y="892" class="rail-label">REVISIÓN ENTRE CAMPOS</text>

    <g id="constraints">
      <path d="M350 756 369 746 388 756 369 766Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.5"/>
      <path d="M350 756V808L369 818V766M388 756V808L369 818" fill="#e9e2d4" stroke="#55534e" stroke-width="1.5"/>
      <path d="M389 765 408 755 427 765 408 775Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.5"/>
      <path d="M389 765V808L408 818V775M427 765V808L408 818" fill="#dce7ea" stroke="#55534e" stroke-width="1.5"/>
      <text x="448" y="743" class="field-number">07</text>
      <text x="448" y="768" class="field-label">Restricciones y</text>
      <text x="448" y="792" class="field-label">preferencias</text>
      <text x="448" y="815" class="field-copy">límites y compromisos</text>
      <text x="448" y="835" class="field-copy">soluciones deseadas</text>
      <circle cx="395" cy="871" r="7.5" class="port port-green"/>
    </g>

    <g id="protections">
      <path d="M666 748 705 761V786C705 807 691 821 666 832 641 821 627 807 627 786V761Z" fill="#fbfaf6" stroke="#55534e" stroke-width="1.8"/>
      <path d="M650 788 662 800 684 772" fill="none" stroke="#789171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="707" cy="818" r="9" fill="#acc5a6" stroke="#55534e" stroke-width="1.3"/>
      <text x="744" y="743" class="field-number">08</text>
      <text x="744" y="768" class="field-label">Protecciones y</text>
      <text x="744" y="792" class="field-label">reparación</text>
      <text x="744" y="815" class="field-copy">daño, señal y autoridad</text>
      <circle cx="688" cy="871" r="7.5" class="port port-green"/>
    </g>

    <g id="revision">
      <path d="M976 756A34 34 0 1 1 946 811" fill="none" stroke="#55534e" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
      <circle cx="976" cy="790" r="12" fill="#dfe8dc" stroke="#55534e" stroke-width="1.6"/>
      <path d="M976 777V790L987 797" class="fine-green"/>
      <text x="1030" y="743" class="field-number">09</text>
      <text x="1030" y="768" class="field-label">Condición de</text>
      <text x="1030" y="792" class="field-label">revisión</text>
      <text x="1030" y="815" class="field-copy">hallazgo que obliga a volver</text>
      <circle cx="981" cy="871" r="7.5" class="port port-green"/>
    </g>
    <circle cx="1215" cy="871" r="8" class="port port-green"/>
  </g>

  <!-- Puerta de decisión -->
  <g id="decision-gate">
    <text x="1314" y="274" class="gate-kicker">PUERTA DE DECISIÓN</text>
    <text x="1314" y="305" class="band-copy">Cuatro salidas legítimas.</text>

    <g id="gate">
      <path d="M1334 329H1668L1697 358V468L1668 497H1334L1305 468V358Z" fill="#2e2d2a" stroke="#2e2d2a" stroke-width="2"/>
      <circle cx="1302" cy="360" r="8" class="port port-blue"/>
      <circle cx="1302" cy="410" r="8" class="port port-sand"/>
      <circle cx="1302" cy="460" r="8" class="port port-green"/>
      <text x="1501" y="366" text-anchor="middle" class="gate-dark-kicker">SUFICIENCIA PROPORCIONAL</text>
      <text x="1501" y="405" text-anchor="middle" class="gate-title">¿Alcanza para esta acción?</text>
      <text x="1501" y="436" text-anchor="middle" class="gate-copy">bajo estas protecciones</text>
      <text x="1501" y="459" text-anchor="middle" class="gate-copy">y hasta este hito de revisión</text>
      <text x="1501" y="482" text-anchor="middle" class="gate-micro">FUERZA DEL ARGUMENTO × COSTO DEL COMPROMISO</text>
      <circle cx="1508" cy="497" r="8" class="port port-dark"/>
    </g>

    <g id="approve">
      <path d="M1342 528H1668L1692 552V606H1342Z" fill="#dfe8dc" stroke="#687262" stroke-width="1.7"/>
      <text x="1364" y="555" class="decision-number">01</text>
      <text x="1405" y="557" class="decision-title">APROBAR</text>
      <text x="1405" y="584" class="decision-copy">Autorizar el próximo compromiso.</text>
      <circle cx="1692" cy="567" r="7" class="port port-green"/>
    </g>

    <g id="return">
      <path d="M1342 618H1668L1692 642V696H1342Z" fill="#e3ebed" stroke="#69787d" stroke-width="1.7"/>
      <text x="1364" y="645" class="decision-number">02</text>
      <text x="1405" y="647" class="decision-title">DEVOLVER</text>
      <text x="1405" y="674" class="decision-copy">Pedir evidencia decisiva.</text>
      <circle cx="1692" cy="657" r="7" class="port port-blue"/>
    </g>

    <g id="divide">
      <path d="M1342 708H1668L1692 732V786H1342Z" fill="#efe6d5" stroke="#80745e" stroke-width="1.7"/>
      <text x="1364" y="735" class="decision-number">03</text>
      <text x="1405" y="737" class="decision-title">DIVIDIR</text>
      <text x="1405" y="764" class="decision-copy">Separar problemas incompatibles.</text>
      <circle cx="1692" cy="747" r="7" class="port port-sand"/>
    </g>

    <g id="reframe">
      <path d="M1342 798H1668L1692 822V876H1342Z" fill="#e5e3dd" stroke="#77746d" stroke-width="1.7"/>
      <text x="1364" y="825" class="decision-number">04</text>
      <text x="1405" y="827" class="decision-title">REFORMULAR</text>
      <text x="1405" y="854" class="decision-copy">Cambiar frontera o mecanismo.</text>
      <circle cx="1692" cy="837" r="7" class="port port-dark"/>
    </g>
  </g>

  <g id="review-loop-note">
    <circle cx="1050" cy="956" r="7" class="port port-sand"/>
    <text x="1080" y="979" class="footer-note">Cada salida conserva una condición de revisión.</text>
    <text x="1080" y="1003" class="field-copy">La evidencia nueva vuelve al encuadre antes del costo irreversible.</text>
  </g>

  <g id="legend">
    <circle cx="88" cy="1004" r="7" class="port port-blue"/>
    <text x="105" y="1009" class="field-copy">situación y outcome</text>
    <circle cx="272" cy="1004" r="7" class="port port-sand"/>
    <text x="289" y="1009" class="field-copy">argumento y evidencia</text>
    <circle cx="488" cy="1004" r="7" class="port port-green"/>
    <text x="505" y="1009" class="field-copy">protección y revisión</text>
  </g>
</svg>
