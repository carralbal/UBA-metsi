<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N26, la promesa vive entre capacidades autónomas</title>
  <desc id="desc">La promesa de ingreso confirmado conecta cinco capacidades internas del hotel con tres participantes externos a través de una frontera de confianza. Cada vínculo conserva una afirmación, un responsable y una salida. Ante identidad indeterminada, la degradación diseñada permite verificación presencial, llave limitada, registro doble y reconciliación posterior. Ricardo gobierna la promesa completa, Lucía ejecuta la contingencia, Federico conserva contratos y trazas y Camila limita lo que el canal puede prometer.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}.eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:46px;letter-spacing:-1px}.subtitle{font-size:20px;fill:#5E605D}.section{font-size:18px;font-weight:700;letter-spacing:4px}.label{font-size:18px;font-weight:700}.body{font-size:16px;fill:#4F524F}.small{font-size:14px;fill:#646764}.number{font-size:14px;font-weight:700;letter-spacing:3px}.rule{stroke:#A8AAA6;stroke-width:2}.edge{fill:none;stroke:#737673;stroke-width:3}.dash{fill:none;stroke:#8E918D;stroke-width:3;stroke-dasharray:10 10}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737673"/></marker>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N26 · MAPA DE ECOSISTEMA</text>
  <text x="68" y="155" class="serif title">La promesa vive entre capacidades autónomas</text><text x="70" y="196" class="sans subtitle">Gobernar no es controlar todo: es acordar vínculos, degradación y salida.</text><path d="M68 226 H1132" class="rule"/>

  <g aria-label="Promesa">
    <text x="72" y="270" class="sans section">UNA PROMESA, VARIAS CERTEZAS PARCIALES</text>
    <path d="M72 302 H1128 V426 H72 Z" class="outline"/><path d="M72 302 H242 L230 324 H60 Z" fill="#CFFF00"/>
    <text x="108" y="352" class="sans number">INGRESO CONFIRMADO</text><text x="108" y="392" class="serif title">reserva → habitación → llave</text>
    <text x="1090" y="352" class="sans label" text-anchor="end">resultado completo</text><text x="1090" y="385" class="sans body" text-anchor="end">no disponibilidad aislada</text>
  </g>

  <g aria-label="Mapa de participantes y capacidades">
    <text x="72" y="488" class="sans section">EL ECOSISTEMA RELEVANTE SIGUE LA PROMESA, NO EL ORGANIGRAMA</text>
    <path d="M72 520 H714 V982 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/>
    <text x="108" y="564" class="sans number">CAPACIDADES DEL HOTEL</text>
    <g><circle cx="120" cy="622" r="20" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="120" y="628" class="sans number" text-anchor="middle">01</text><text x="160" y="618" class="sans label">Inventario y reserva</text><text x="160" y="646" class="sans body">PMS · disponibilidad</text></g>
    <g><circle cx="120" cy="706" r="20" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="120" y="712" class="sans number" text-anchor="middle">02</text><text x="160" y="702" class="sans label">Estado material</text><text x="160" y="730" class="sans body">Housekeeping · fuente y hora</text></g>
    <g><circle cx="120" cy="790" r="20" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="120" y="796" class="sans number" text-anchor="middle">03</text><text x="160" y="786" class="sans label">Asignación</text><text x="160" y="814" class="sans body">Recepción · decisión y excepción</text></g>
    <g><circle cx="120" cy="874" r="20" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="120" y="880" class="sans number" text-anchor="middle">04</text><text x="160" y="870" class="sans label">Conciliación de pagos</text><text x="160" y="898" class="sans body">autorización y reversión</text></g>
    <g><circle cx="120" cy="946" r="20" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="120" y="952" class="sans number" text-anchor="middle">05</text><text x="160" y="942" class="sans label">Registro de eventos</text><text x="160" y="970" class="sans body">traza y reparación</text></g>
    <path d="M742 520 V982" class="dash"/><text x="758" y="552" class="sans number">FRONTERA DE CONFIANZA</text>
    <path d="M770 582 H1128 V982 H770 Z" class="outline"/><text x="806" y="626" class="sans number">PARTICIPANTES AUTÓNOMOS</text>
    <g><circle cx="824" cy="698" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="824" y="704" class="sans number" text-anchor="middle">A</text><text x="870" y="694" class="sans label">Canal externo</text><text x="870" y="724" class="sans body">reserva, procedencia y cambios</text></g>
    <g><circle cx="824" cy="806" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="824" y="812" class="sans number" text-anchor="middle">B</text><text x="870" y="802" class="sans label">Servicio de identidad</text><text x="870" y="832" class="sans body">afirmación vigente y trazable</text></g>
    <g><circle cx="824" cy="914" r="22" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="824" y="920" class="sans number" text-anchor="middle">C</text><text x="870" y="910" class="sans label">Plataforma de cerraduras</text><text x="870" y="940" class="sans body">autorización con vigencia</text></g>
    <path d="M702 698 H770 M702 806 H770 M702 914 H770" class="edge" marker-end="url(#arrow)"/>
    <text x="744" y="1014" class="sans small" text-anchor="middle">cada cruce declara procedencia, vigencia, autoridad y alternativa</text>
  </g>

  <g aria-label="Degradación diseñada">
    <text x="72" y="1076" class="sans section">UNA DEPENDENCIA CAÍDA NO DEBE INAUGURAR LA NEGOCIACIÓN</text>
    <path d="M72 1108 H1128 V1308 H72 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/>
    <path d="M138 1178 H1048" class="edge" marker-end="url(#arrow)"/>
    <g><circle cx="142" cy="1178" r="24" fill="#CFFF00" stroke="#202020" stroke-width="2"/><text x="142" y="1184" class="sans number" text-anchor="middle">01</text><text x="142" y="1228" class="sans label" text-anchor="middle">Indeterminado</text><text x="142" y="1255" class="sans small" text-anchor="middle">identidad externa</text></g>
    <g><circle cx="366" cy="1178" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="366" y="1184" class="sans number" text-anchor="middle">02</text><text x="366" y="1228" class="sans label" text-anchor="middle">Verificación</text><text x="366" y="1255" class="sans small" text-anchor="middle">presencial</text></g>
    <g><circle cx="590" cy="1178" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="590" y="1184" class="sans number" text-anchor="middle">03</text><text x="590" y="1228" class="sans label" text-anchor="middle">Llave limitada</text><text x="590" y="1255" class="sans small" text-anchor="middle">autorización de guardia</text></g>
    <g><circle cx="814" cy="1178" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="814" y="1184" class="sans number" text-anchor="middle">04</text><text x="814" y="1228" class="sans label" text-anchor="middle">Doble registro</text><text x="814" y="1255" class="sans small" text-anchor="middle">episodio y traza</text></g>
    <g><circle cx="1038" cy="1178" r="24" fill="#FFFFFF" stroke="#202020" stroke-width="2"/><text x="1038" y="1184" class="sans number" text-anchor="middle">05</text><text x="1038" y="1228" class="sans label" text-anchor="middle">Reconciliación</text><text x="1038" y="1255" class="sans small" text-anchor="middle">posterior</text></g>
  </g>

  <g aria-label="Responsabilidad de punta a punta">
    <text x="72" y="1372" class="sans section">LA RESPONSABILIDAD SE DISTRIBUYE SIN DILUIR LA RESPUESTA</text>
    <path d="M72 1404 H1128 V1470 H72 Z" class="outline"/>
    <text x="102" y="1445" class="sans label">Ricardo</text><text x="210" y="1445" class="sans body">gobierna</text><path d="M326 1424 V1454" class="rule"/>
    <text x="360" y="1445" class="sans label">Lucía</text><text x="448" y="1445" class="sans body">ejecuta</text><path d="M548 1424 V1454" class="rule"/>
    <text x="582" y="1445" class="sans label">Federico</text><text x="690" y="1445" class="sans body">traza</text><path d="M776 1424 V1454" class="rule"/>
    <text x="810" y="1445" class="sans label">Camila</text><text x="904" y="1445" class="sans body">limita la promesa</text>
  </g>
  <path d="M72 1504 H1128" class="rule"/><text x="72" y="1540" class="sans small">CADA PARTE PUEDE CUMPLIR Y LA PROMESA COMPLETA PUEDE FALLAR.</text><text x="1128" y="1540" class="sans small" text-anchor="end">N26 · METSI</text>
</svg>
