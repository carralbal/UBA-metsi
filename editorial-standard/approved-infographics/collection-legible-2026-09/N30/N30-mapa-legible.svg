<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">El tablero está verde. La familia espera.</title><desc id="desc">La disponibilidad técnica no cuenta toda la experiencia del servicio. Medir llave funcional en diez minutos, sin reasignación indebida y con acceso prometido. Alertar, asignar autoridad, contener y aprender; no sólo enviar mensajes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="El tablero está verde. La familia espera.">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N30">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N30 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">El tablero está verde. La familia</text>
<text x="52" y="185.5" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">espera.</text>
<text x="52" y="263.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La disponibilidad técnica no cuenta toda la experiencia del servicio.</text>
</g>
<path d="M52 308.8 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Señal técnica" data-row-bottom="567.6">
<path d="M52 340.8 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="383.8" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Señal técnica</text>
<text x="78" y="427.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Latencia, reintentos y resultados desconocidos.</text>
<text x="78" y="473.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Indica cómo responden los componentes.</text>
</g>
<g id="item-1" aria-label="Recorrido" data-row-bottom="802.4000000000001">
<path d="M52 575.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="618.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Recorrido</text>
<text x="78" y="662.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Reserva, asignación y llave.</text>
<text x="78" y="708.4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Permite seguir una llegada de principio a fin.</text>
</g>
<g id="item-2" aria-label="Negocio" data-row-bottom="1037.2">
<path d="M52 810.4000000000001 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="853.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Negocio</text>
<text x="78" y="897.4000000000001" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Ingreso, contingencia y compensación.</text>
<text x="78" y="943.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Muestra si se sostiene la promesa del hotel.</text>
</g>
<g id="item-3" aria-label="Experiencia" data-row-bottom="1272.0">
<path d="M52 1045.2 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<text x="78" y="1088.2" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Experiencia</text>
<text x="78" y="1132.2" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Espera, accesibilidad y ayuda.</text>
<text x="78" y="1178.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Hace visible lo que la persona pudo completar.</text>
</g>
<g id="relation-key" aria-label="Relaciones entre condiciones">
<text x="78" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">CONDICIONES QUE SE LEEN EN CONJUNTO</text>
</g>
<path id="e-item-0-decision" d="M1148 458.20000000000005 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-1-decision" d="M1148 693.0 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-2-decision" d="M1148 927.8 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<path id="e-item-3-decision" d="M1148 1162.6000000000001 H1175 V1348 H1124 V1364" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="decision" aria-label="De la señal a la acción">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">De la señal a la acción</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Medir llave funcional en diez minutos, sin reasignación indebida y con</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">acceso prometido. Alertar, asignar autoridad, contener y aprender; no</text>
<text x="78" y="1540.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">sólo enviar mensajes.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>