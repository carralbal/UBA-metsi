<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">N20, la estrategia avanza sólo cuando el hito cambia una decisión</title>
  <desc id="desc">La capacidad de Hotel Horizonte atraviesa cuatro puertas: comprender, preparar, probar y transferir. Cada puerta asocia evidencia, autoridad y una consecuencia. Cuando una condición falla, la estrategia puede investigar, reducir alcance, reparar o retirar. El apoyo extraordinario desciende mientras la autonomía operacional aumenta hasta que operación puede usar, observar y reparar.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12 Z" fill="#747672"/></marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202020}.serif{font-family:Georgia,'Times New Roman',serif;fill:#202020}
      .eyebrow{font-size:22px;font-weight:700;letter-spacing:6px}.title{font-size:48px;letter-spacing:-1px}.subtitle{font-size:21px;fill:#5E605D}.section{font-size:19px;font-weight:700;letter-spacing:4px}.label{font-size:19px;font-weight:700}.body{font-size:17px;fill:#50524F}.small{font-size:15px;fill:#666865}.number{font-size:16px;font-weight:700;letter-spacing:3px}.rule{stroke:#A8AAA6;stroke-width:2}.route{fill:none;stroke:#747672;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#8A8C88;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}.outline{fill:#FFFFFF;stroke:#777A76;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="#F7F7F4"/><rect x="34" y="34" width="1132" height="1532" rx="18" fill="none" stroke="#C6C8C4" stroke-width="2"/>
  <path d="M68 72 H188 L176 92 H56 Z" fill="#CFFF00"/><text x="214" y="91" class="sans eyebrow">N20 · ESTRATEGIA SITUADA</text>
  <text x="68" y="157" class="serif title">El hito cambia una decisión posible</text><text x="70" y="198" class="sans subtitle">La fecha ordena. Evidencia, autoridad y consecuencia permiten avanzar o salir.</text><path d="M68 230 H1132" class="rule"/>

  <text x="72" y="276" class="sans section">CAPACIDAD QUE LA ESTRATEGIA DEBE SOSTENER</text>
  <g aria-label="Capacidad de Hotel Horizonte">
    <path d="M72 310 H1128 L1144 326 V500 H72 Z" class="outline"/><path d="M72 310 H236 L224 330 H60 Z" fill="#CFFF00"/>
    <text x="100" y="360" class="sans number">HH-20 · LLEGADA</text>
    <text x="100" y="412" class="serif" style="font-size:31px">Confirmar una habitación sólo con capacidad</text><text x="100" y="450" class="serif" style="font-size:31px">disponible, observable y reparable.</text>
    <line x1="690" y1="348" x2="690" y2="468" class="rule"/><text x="730" y="376" class="sans label">Población limitada</text><text x="730" y="409" class="sans label">Excepción accesible</text><text x="730" y="442" class="sans label">Reversión ensayada</text><text x="730" y="475" class="sans small">la promesa precede a la práctica</text>
  </g>

  <text x="72" y="556" class="sans section">CUATRO PUERTAS DE COMPROMISO</text><text x="1128" y="556" class="sans small" text-anchor="end">de menor a mayor exposición</text>
  <g aria-label="Puertas de compromiso">
    <path d="M134 640 V1085" stroke="#202020" stroke-width="4"/>
    <g aria-label="Puerta comprender">
      <circle cx="134" cy="650" r="29" fill="#CFFF00" stroke="#202020" stroke-width="3"/><text x="134" y="656" class="sans number" text-anchor="middle">01</text>
      <path d="M179 598 H1098 L1114 614 V704 H179 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><text x="210" y="633" class="sans label">COMPRENDER</text><text x="210" y="671" class="sans body">Evidencia: episodios, obligación e hipótesis delimitada.</text><line x1="670" y1="619" x2="670" y2="682" class="rule"/><text x="708" y="640" class="sans number">AUTORIDAD</text><text x="708" y="672" class="sans body">Elena fija el límite de la promesa.</text>
    </g>
    <g aria-label="Puerta preparar">
      <circle cx="134" cy="790" r="29" fill="#FFFFFF" stroke="#202020" stroke-width="3"/><text x="134" y="796" class="sans number" text-anchor="middle">02</text>
      <path d="M179 738 H1098 L1114 754 V844 H179 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="210" y="773" class="sans label">PREPARAR</text><text x="210" y="811" class="sans body">Evidencia: datos, personas, permiso y contingencia.</text><line x1="670" y1="759" x2="670" y2="822" class="rule"/><text x="708" y="780" class="sans number">CONSECUENCIA</text><text x="708" y="812" class="sans body">Exponer una población acotada.</text>
    </g>
    <g aria-label="Puerta probar">
      <circle cx="134" cy="930" r="29" fill="#FFFFFF" stroke="#202020" stroke-width="3"/><text x="134" y="936" class="sans number" text-anchor="middle">03</text>
      <path d="M179 878 H1098 L1114 894 V984 H179 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><text x="210" y="913" class="sans label">PROBAR</text><text x="210" y="951" class="sans body">Evidencia: episodio ordinario, falla y reparación.</text><line x1="670" y1="899" x2="670" y2="962" class="rule"/><text x="708" y="920" class="sans number">CONSECUENCIA</text><text x="708" y="952" class="sans body">Ampliar, reducir o detener.</text>
    </g>
    <g aria-label="Puerta transferir">
      <circle cx="134" cy="1070" r="29" fill="#FFFFFF" stroke="#202020" stroke-width="3"/><text x="134" y="1076" class="sans number" text-anchor="middle">04</text>
      <path d="M179 1018 H1098 L1114 1034 V1124 H179 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="210" y="1053" class="sans label">TRANSFERIR</text><text x="210" y="1091" class="sans body">Evidencia: Operaciones puede usar, observar y reparar.</text><line x1="670" y1="1039" x2="670" y2="1102" class="rule"/><text x="708" y="1060" class="sans number">AUTORIDAD</text><text x="708" y="1092" class="sans body">Operaciones acepta y puede detener.</text>
    </g>
  </g>

  <text x="72" y="1180" class="sans section">SI UNA CONDICIÓN FALLA, HAY UNA SALIDA REAL</text>
  <g aria-label="Salidas ante una puerta fallida">
    <path d="M98 1216 H334 L348 1230 V1326 H98 Z" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="223" y="1253" class="sans number" text-anchor="middle">INVESTIGAR</text><text x="223" y="1285" class="sans small" text-anchor="middle">cerrar preguntas sin función</text><text x="223" y="1310" class="sans small" text-anchor="middle">y conservar la versión</text>
    <rect x="370" y="1216" width="250" height="110" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><text x="495" y="1253" class="sans number" text-anchor="middle">REDUCIR</text><text x="495" y="1285" class="sans small" text-anchor="middle">proteger población</text><text x="495" y="1310" class="sans small" text-anchor="middle">y reversión</text>
    <rect x="642" y="1216" width="250" height="110" fill="#E4E6E3" stroke="#777A76" stroke-width="2"/><text x="767" y="1253" class="sans number" text-anchor="middle">REPARAR</text><text x="767" y="1285" class="sans small" text-anchor="middle">corregir dato, permiso</text><text x="767" y="1310" class="sans small" text-anchor="middle">o contingencia</text>
    <path d="M914 1216 H1098 L1114 1232 V1326 H914 Z" fill="#FFFFFF" stroke="#777A76" stroke-width="2"/><text x="1014" y="1253" class="sans number" text-anchor="middle">RETIRAR</text><text x="1014" y="1285" class="sans small" text-anchor="middle">liberar capacidad</text><text x="1014" y="1310" class="sans small" text-anchor="middle">sin borrar aprendizaje</text>
  </g>

  <g aria-label="Transferencia gradual">
    <path d="M72 1380 H1128" class="rule"/><text x="72" y="1423" class="sans section">TRANSFERENCIA GRADUAL</text><text x="1128" y="1423" class="sans number" text-anchor="end">AUTONOMÍA PROBADA</text>
    <text x="72" y="1472" class="sans small">APOYO EXTRAORDINARIO</text><path d="M278 1466 H930" stroke="#A8AAA6" stroke-width="14"/><path d="M278 1466 H570" stroke="#202020" stroke-width="14"/><path d="M930 1466 H1078" stroke="#CFFF00" stroke-width="14"/><text x="1090" y="1472" class="sans small">OPERACIÓN</text>
    <text x="72" y="1516" class="sans body">La intervención termina cuando el resultado puede sostenerse y revisarse sin conocimiento privado.</text>
  </g>
  <text x="72" y="1550" class="sans small">TAILORING ES DISEÑAR FUNCIONES, EVIDENCIA Y SALIDAS; NO RECORTAR CEREMONIAS.</text><text x="1128" y="1550" class="sans small" text-anchor="end">N20 · METSI</text>
</svg>
