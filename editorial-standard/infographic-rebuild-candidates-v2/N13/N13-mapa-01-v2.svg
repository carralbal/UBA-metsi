<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1042" viewBox="0 0 1344 1042" role="img" aria-label="Una transición distribuida converge cuando conserva la identidad de la intención, protege una invariante y reconcilia representaciones divergentes sin falsificar la historia."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#CCCCCC"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4D4D4D"/></marker></defs><path d="M121 32 H211 L200 47 H110 Z" fill="#CFFF00"/><rect width="100%" height="100%" fill="#FFFFFF"/><text x="120.0" y="78.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start"><tspan x="120.0" dy="0.0">Repetir un mensaje no debe multiplicar</tspan><tspan x="120.0" dy="56.6">el efecto</tspan></text><path d="M 626.0 326.3 L 718.0 326.3" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 718.0 326.3 H 672.0 V 587.7 H 626.0" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 626.0 587.7 L 718.0 587.7" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 718.0 587.7 H 672.0 V 849.1 H 626.0" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 626.0 849.1 L 718.0 849.1" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="120.0" y="210.6" width="506.0" height="231.4" rx="9" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/><text x="144.0" y="244.6" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">01</tspan></text><text x="144.0" y="285.6" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="144.0" dy="0.0">Solicitud original para</tspan><tspan x="1