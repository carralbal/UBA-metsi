<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Una afirmación necesita su historia</title><desc id="desc">No es lo mismo observar algo que explicar por qué pasó o decidir qué hacer. Conservá procedencia, definiciones, incertidumbre y responsables. Una transformación no debe borrar la anterior.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Una afirmación necesita su historia">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N04">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N04 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Una afirmación necesita su historia</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No es lo mismo observar algo que explicar por qué pasó o decidir qué hacer.</text>
</g>
<path d="M52 270 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Fuente" data-row-bottom="457.0">
<circle cx="82" cy="344.0" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="354.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="345.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Fuente</text>
<text x="145" y="389.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Persona, sensor o documento.</text>
<text x="145" y="434.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿De dónde salió la información?</text>
</g>
<path id="e-item-0-item-1" d="M82 374.0 V472.0" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Registro" data-row-bottom="620.0">
<circle cx="82" cy="507.0" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="517.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="508.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Registro</text>
<text x="145" y="552.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Captura situada y parcial.</text>
<text x="145" y="597.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿Qué se anotó y en qué condiciones?</text>
</g>
<path id="e-item-1-item-2" d="M82 537.0 V635.0" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Dato" data-row-bottom="783.0">
<circle cx="82" cy="670.0" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="680.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="671.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Dato</text>
<text x="145" y="715.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Registro codificado según una definición.</text>
<text x="145" y="760.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿Qué significa cada valor?</text>
</g>
<path id="e-item-2-item-3" d="M82 700.0 V798.0" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Interpretación" data-row-bottom="946.0">
<circle cx="82" cy="833.0" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="843.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="834.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Interpretación</text>
<text x="145" y="878.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Significado que atribuimos a lo registrado.</text>
<text x="145" y="923.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿Qué lectura hacemos y qué otras son posibles?</text>
</g>
<path id="e-item-3-item-4" d="M82 863.0 V961.0" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-4" aria-label="Hipótesis" data-row-bottom="1109.0">
<circle cx="82" cy="996.0" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1006.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">05</text>
<text x="145" y="997.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Hipótesis</text>
<text x="145" y="1041.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Explicación que puede ponerse a prueba.</text>
<text x="145" y="1086.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿Qué evidencia podría mostrar que estamos equivocados?</text>
</g>
<path id="e-item-4-item-5" d="M82 1026.0 V1124.0" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-5" aria-label="Decisión" data-row-bottom="1272.0">
<circle cx="82" cy="1159.0" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1169.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">06</text>
<text x="145" y="1160.0" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Decisión</text>
<text x="145" y="1204.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Acción con una condición de revisión.</text>
<text x="145" y="1249.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">¿Quién decide y cuándo volveremos a evaluar?</text>
</g>
<g id="decision" aria-label="En cada paso">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">En cada paso</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Conservá procedencia, definiciones, incertidumbre y responsables. Una</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">transformación no debe borrar la anterior.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>