<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1680" width="1200" height="1680" role="img" aria-labelledby="title desc">
  <title id="title">N16 · Nueve hechos · 1 de 2: identidad y huella</title><desc id="desc">En el caso ficticio, una persona tiene un trámite identificado; el trámite conserva historial de cambios y observaciones, cada una con sus propias respuestas. El estado visible se deriva del historial, no puede mutarse sin dejar una nueva huella.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#454743" stroke-width="2"/></marker>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#c5c5bf"/></pattern>
  </defs>
  <path d="M0 0H1200V1680H0Z" fill="#f4f2ec"/>
  <path d="M36 36H1164V1644H36Z" fill="none" stroke="#bebfb8" stroke-width="2"/>
  <path d="M78 80H170V91H78Z" fill="#cefa00"/>
  <text x="196" y="96" fill="#353733" font-family="Avenir Next,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">METSI · N16 · CASO DIDÁCTICO FICTICIO</text>


  <g id="heading">
    <text x="78" y="187" fill="#20221f" font-family="Didot,Georgia,serif" font-size="77">No alcanza con saber</text>
    <text x="78" y="261" fill="#20221f" font-family="Didot,Georgia,serif" font-size="77">cómo quedó.</text>
    <text x="80" y="317" fill="#5d605a" font-family="Baskerville,Georgia,serif" font-size="30">Para explicar un estado hay que conservar la historia del trámite,</text>
    <text x="80" y="353" fill="#5d605a" font-family="Baskerville,Georgia,serif" font-size="30">no sólo su última etiqueta.</text>
    <path d="M78 389H1122" stroke="#aeb0a8" stroke-width="2"/>
    <text x="80" y="433" fill="#373934" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">01 / IDENTIDAD Y HUELLA</text>
    <text x="1120" y="433" fill="#6b6e67" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="end">HOJA 1 DE 2</text>
  </g>
  <g id="routes" fill="none" stroke="#575a53" stroke-width="3" marker-end="url(#arrow)">
    <path d="M287 568H447"/>
    <path d="M765 738V788H340V839"/>
    <path d="M765 738V788H894V839"/>
    <path d="M894 1140V1198"/>
  </g>
