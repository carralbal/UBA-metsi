<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" role="img" aria-labelledby="N02-summary-title N02-summary-desc"><title id="N02-summary-title">N02: del concepto al producto</title><desc id="N02-summary-desc">Seguir la promesa: Empezá por entregar alojamiento en las condiciones acordadas; una confirmación técnica cubre sólo una parte. → Reconstruir el trabajo: Relacioná actores con verbos, tiempos y autoridad, incluyendo la excepción y su reparación. → Comparar explicaciones: Contrastá demora, significado y promesa comercial con pruebas distintas. El episodio no elige una causa única. → Revisar el recorte: Justificá qué queda fuera y ampliá si una mejora traslada espera, trabajo o riesgo a otra relación.</desc><rect x="0" y="0" width="640" height="860" fill="#fafaf8"/><text x="20" y="27" fill="#171917" font-family="Avenir" font-size="13" font-weight="600">RECORRIDO DE SÍNTESIS · N02</text><rect x="20" y="55" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="55" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="83" r="13" fill="#171917"/><text x="43" y="88" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">1</text><text x="73" y="87" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Seguir la promesa</text><text x="39" y="111" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Empezá por entregar alojamiento en las condiciones acordadas; una</text><text x="39" y="130" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">confirmación técnica cubre sólo una parte.</text><text x="310" y="213.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="218.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="218.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="246.0" r="13" fill="#171917"/><text x="43" y="251.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">2</text><text x="73" y="250.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Reconstruir el trabajo</text><text x="39" y="274.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Relacioná actores con verbos, tiempos y autoridad, incluyendo la</text><text x="39" y="293.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">excepción y su reparación.</text><text x="310" y="376.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="381.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="381.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="409.0" r="13" fill="#171917"/><text x="43" y="414.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">3</text><text x="73" y="413.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Comparar explicaciones</text><text x="39" y="437.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Contrastá demora, significado y promesa comercial con pruebas</text><text x="39" y="456.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">distintas. El episodio no elige una causa única.</text><text x="310" y="539.0" fill="#171917" font-family="Avenir" font-size="18" font-weight="400">↓</text><rect x="20" y="544.0" width="600" height="141.0" fill="#e3e6e4"/><rect x="20" y="544.0" width="5" height="141.0" fill="#cfff00"/><circle cx="48" cy="572.0" r="13" fill="#171917"/><text x="43" y="577.0" fill="#cfff00" font-family="Baskerville" font-size="16" font-weight="700">4</text><text x="73" y="576.0" fill="#171917" font-family="Avenir" font-size="19" font-weight="600">Revisar el recorte</text><text x="39" y="600.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">Justificá qué queda fuera y ampliá si una mejora traslada espera,</text><text x="39" y="619.0" fill="#171917" font-family="Baskerville" font-size="17" font-weight="400">trabajo o riesgo a otra relación.</text><rect x="20" y="727" width="600" height="110" fill="#171917"/><text x="39" y="750" fill="#cfff00" font-family="Avenir" font-size="13" font-weight="600">PRODUCTO PARA EL ENCUENTRO</text><text x="39" y="778" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">HH-02: un mapa del episodio de las 13:06 con relaciones, tiempos,</text><text x="39" y="800" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">autoridad, al menos dos hipótesis y una exclusión justificada; dos</text><text x="39" y="822" fill="#ffffff" font-family="Baskerville" font-size="17" font-weight="400">respuestas que lo pongan a prueba.</text></svg>