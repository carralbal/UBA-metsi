<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="997" viewBox="0 0 1344 997" role="img" aria-label="Secuencia de diez transformaciones en orden de lectura: del pedido al problema, del software al sistema de trabajo, de la opinión a la evidencia, de la actividad al mecanismo, del modelo a la decisión, del marco a la estrategia situada, del output al outcome, de la aplicación al ecosistema, de la demostración de IA a la autonomía gobernada y del portfolio a la práctica reflexiva."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#CCCCCC"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4D4D4D"/></marker></defs><path d="M121 32 H211 L200 47 H110 Z" fill="#CFFF00"/><rect width="100%" height="100%" fill="#FFFFFF"/><text x="120.0" y="78.0" fill="#272525" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start"><tspan x="120.0" dy="0.0">El recorrido completo: ocho bloques, una</tspan><tspan x="120.0" dy="56.6">capacidad acumulativa</tspan></text><path d="M 378.0 369.5 L 402.0 369.5" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 660.0 369.5 L 684.0 369.5" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 942.0 369.5 L 966.0 369.5" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 1095.0 528.4 L 1095.0 558.4" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 966.0 738.9 L 942.0 738.9" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 684.0 738.9 L 660.0 738.9" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 402.0 738.9 L 378.0 738.9" stroke="#CCCCCC" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="120.0" y="210.6" width="258.0" height="317.8" rx="9" fill=