<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc"><title id="title">Accesible de principio a fin</title><desc id="desc">Una etiqueta en la pantalla no garantiza que la persona pueda completar el recorrido. Incluí la excepción y la reparación. El servicio no es accesible si sólo funciona cuando todo sale bien.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777A76"/></marker></defs>
<rect width="1200" height="1620" fill="#F7F6F2"/>
<g id="header" aria-label="Accesible de principio a fin">
<path d="M52 36 H126 L116 52 H42 Z" fill="#CFFF00"/>
<g id="document-label" aria-label="METSI · N09">
<text x="154" y="53" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#202020">METSI · N09 · MAPA DE DECISIÓN</text>
</g>
<text x="52" y="118.0" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#202020">Accesible de principio a fin</text>
<text x="52" y="205.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una etiqueta en la pantalla no garantiza que la persona pueda completar el</text>
<text x="52" y="242.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">recorrido.</text>
</g>
<path d="M52 288.6 H1148" fill="none" stroke="#92958F" stroke-width="2"/>
<g id="item-0" aria-label="Propósito y condiciones" data-row-bottom="504.48">
<circle cx="82" cy="362.6" r="26" fill="#CFFF00" stroke="#202020" stroke-width="2"/>
<text x="66" y="372.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">01</text>
<text x="145" y="363.6" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Propósito y condiciones</text>
<text x="145" y="407.6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Confirmar que el alojamiento sea compatible.</text>
<text x="145" y="453.40000000000003" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Considerar movilidad, teclado, conectividad y apoyos.</text>
</g>
<path id="e-item-0-item-1" d="M82 392.6 V519.48" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-1" aria-label="Señal y acción" data-row-bottom="696.36">
<circle cx="82" cy="554.48" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="564.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">02</text>
<text x="145" y="555.48" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Señal y acción</text>
<text x="145" y="599.48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La pantalla ofrece una habitación adaptada.</text>
<text x="145" y="645.28" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">La persona reserva y recibe una confirmación.</text>
</g>
<path id="e-item-1-item-2" d="M82 584.48 V711.36" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-2" aria-label="Trabajo que sostiene la oferta" data-row-bottom="888.24">
<circle cx="82" cy="746.36" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="756.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">03</text>
<text x="145" y="747.36" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Trabajo que sostiene la oferta</text>
<text x="145" y="791.36" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Verificar atributos y disponibilidad reales.</text>
<text x="145" y="837.16" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">No alcanza con que la etiqueta esté cargada.</text>
</g>
<path id="e-item-2-item-3" d="M82 776.36 V903.24" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-3" aria-label="Evidencia" data-row-bottom="1080.12">
<circle cx="82" cy="938.24" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="948.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">04</text>
<text x="145" y="939.24" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Evidencia</text>
<text x="145" y="983.24" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Saber de dónde viene el dato y si sigue vigente.</text>
<text x="145" y="1029.04" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Identificar quién puede confirmarlo o corregirlo.</text>
</g>
<path id="e-item-3-item-4" d="M82 968.24 V1095.12" fill="none" stroke="#92958F" stroke-width="2" marker-end="url(#arrow)"/>
<g id="item-4" aria-label="Falla y respuesta" data-row-bottom="1272.0">
<circle cx="82" cy="1130.12" r="26" fill="#F7F6F2" stroke="#202020" stroke-width="2"/>
<text x="66" y="1140.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#202020">05</text>
<text x="145" y="1131.12" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">Falla y respuesta</text>
<text x="145" y="1175.12" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Una promesa falsa puede impedir el ingreso.</text>
<text x="145" y="1220.9199999999998" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Dar una alternativa verificable, un plazo y un responsable.</text>
</g>
<g id="decision" aria-label="La prueba es el recorrido completo">
<rect x="52" y="1370" width="1096" height="200" fill="#E5E6E0"/><rect x="52" y="1370" width="7" height="200" fill="#CFFF00"/>
<text x="78" y="1418" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#202020">La prueba es el recorrido completo</text>
<text x="78" y="1465.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">Incluí la excepción y la reparación. El servicio no es accesible si sólo</text>
<text x="78" y="1502.8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#202020">funciona cuando todo sale bien.</text>
</g>
<g id="reading-key" aria-label="Lectura del mapa">
<text x="52" y="1606" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#202020">Las relaciones orientan la decisión; no reemplazan la explicación del texto.</text>
</g>
</svg>